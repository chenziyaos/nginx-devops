<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">json_set 对来源变量做一次解析，一次取多个路径的值</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">从上到下是 json_set 的处理流程；绿色表示成功取到值，红色表示解析失败</text>
