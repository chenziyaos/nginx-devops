<polygon points="896,298 906,304 896,310" fill="#8F959E"/>
<rect x="70" y="262" width="220" height="84" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="180" y="308.9" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">ngx_array_push</text>
<rect x="490" y="158" width="220" height="84" rx="8" fill="#F0FBEF" stroke="#8EE085" stroke-width="1.5" data-role="node"/>
<text x="600" y="195.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">没满</text>
<text x="600" y="215.2" font-size="12" fill="#646A73" text-anchor="middle">nelts ＜ nalloc</text>
<rect x="490" y="262" width="220" height="84" rx="8" fill="#F0F4FF" stroke="#82A7FC" stroke-width="1.5" data-role="node"/>
<text x="600" y="289.9" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">满了，元素区在池尾</text>
<text x="600" y="309.7" font-size="12" fill="#646A73" text-anchor="middle">块内还有一格：d.last 后移，</text>
<text x="600" y="328.7" font-size="12" fill="#646A73" text-anchor="middle">nalloc + 1</text>
<rect x="490" y="366" width="220" height="84" rx="8" fill="#FEF1F1" stroke="#F98E8B" stroke-width="1.5" data-role="node"/>
<text x="600" y="393.9" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">满了，不在池尾</text>
<text x="600" y="413.7" font-size="12" fill="#646A73" text-anchor="middle">palloc 2 倍并 memcpy，旧空间</text>
<text x="600" y="432.7" font-size="12" fill="#646A73" text-anchor="middle">留在池里</text>
<rect x="910" y="262" width="220" height="84" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="1020" y="308.9" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">返回下一格</text>
<text x="40" y="490" font-size="12" fill="#646A73" data-role="source">来源：src/core/ngx_array.c（1.31.9）</text>
