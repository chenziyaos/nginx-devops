<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, Helvetica, Arial, sans-serif" viewBox="0 0 1200 721" width="1200" height="721">
<rect x="0" y="0" width="1200" height="721" rx="16" fill="#FAFBFD" stroke="#DEE0E3" stroke-width="1" data-role="frame"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">408 和 499 分别对应超时的两个方向，504 是等后端超时</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">时间从上到下，三段依次对应 408、499、504；蓝色的 nginx 是记状态码的一方</text>
<line x1="226.7" y1="168" x2="226.7" y2="657" stroke="#C9CDD4" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="126.7" y="128" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="actor"/>
<text x="226.7" y="153" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">客户端</text>
<line x1="600" y1="168" x2="600" y2="657" stroke="#C9CDD4" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="500" y="128" width="200" height="40" rx="8" fill="#F0F4FF" stroke="#82A7FC" stroke-width="1.5" data-role="actor"/>
<text x="600" y="153" font-size="14" fill="#245BDB" font-weight="bold" text-anchor="middle">nginx</text>
<line x1="973.3" y1="168" x2="973.3" y2="657" stroke="#C9CDD4" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="873.3" y="128" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="actor"/>
<text x="973.3" y="153" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">后端</text>
<text x="236.7" y="202.6" font-size="13" fill="#1F2329">请求头没发完</text>
<polyline points="226.7,211 588,211" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="588,205 598,211 588,217" fill="#8F959E"/>
<text x="610" y="243.6" font-size="13" fill="#1F2329">client_header_timeout 到期，关闭，记 408</text>
<polyline points="600,252 626,252 626,270 614,270" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="614,264 604,270 614,276" fill="#8F959E"/>
<text x="236.7" y="310.6" font-size="13" fill="#1F2329">完整请求</text>
<polyline points="226.7,319 588,319" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="588,313 598,319 588,325" fill="#8F959E"/>
<text x="610" y="351.6" font-size="13" fill="#1F2329">转发</text>
<polyline points="600,360 961.3,360" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="961.3,354 971.3,360 961.3,366" fill="#8F959E"/>
<text x="236.7" y="392.6" font-size="13" fill="#1F2329">客户端超时更短，先断开</text>
<polyline points="226.7,401 252.7,401 252.7,419 240.7,419" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="240.7,413 230.7,419 240.7,425" fill="#8F959E"/>
<text x="610" y="459.6" font-size="13" fill="#1F2329">发现客户端断开，关后端，记 499</text>
<polyline points="600,468 626,468 626,486 614,486" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="614,480 604,486 614,492" fill="#8F959E"/>
<text x="236.7" y="526.5" font-size="13" fill="#1F2329">完整请求</text>
<polyline points="226.7,535 588,535" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="588,529 598,535 588,541" fill="#8F959E"/>
<text x="610" y="567.5" font-size="13" fill="#1F2329">转发</text>
<polyline points="600,576 961.3,576" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="961.3,570 971.3,576 961.3,582" fill="#8F959E"/>
<text x="610" y="608.5" font-size="13" fill="#1F2329">proxy_read_timeout 到期，回 504</text>
<polyline points="600,617 626,617 626,635 614,635" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="614,629 604,635 614,641" fill="#8F959E"/>
<text x="40" y="697" font-size="12" fill="#646A73" data-role="source">来源：本文整理</text>
</svg>
