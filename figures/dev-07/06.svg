<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, Helvetica, Arial, sans-serif" viewBox="0 0 1200 721" width="1200" height="721">
<rect x="0" y="0" width="1200" height="721" rx="16" fill="#FAFBFD" stroke="#DEE0E3" stroke-width="1" data-role="frame"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">server 级 rewrite 每个请求跑一次，location 级每次匹配后都跑</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">从上到下是阶段顺序；server 级规则只有内部跳转才会再执行</text>
<line x1="180" y1="168" x2="180" y2="657" stroke="#C9CDD4" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="80" y="128" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="actor"/>
<text x="180" y="153" font-size="12" fill="#1F2329" font-weight="bold" text-anchor="middle">SERVER_REWRITE</text>
<line x1="460" y1="168" x2="460" y2="657" stroke="#C9CDD4" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="360" y="128" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="actor"/>
<text x="460" y="153" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">FIND_CONFIG（2）</text>
<line x1="740" y1="168" x2="740" y2="657" stroke="#C9CDD4" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="640" y="128" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="actor"/>
<text x="740" y="153" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">REWRITE（3）</text>
<line x1="1020" y1="168" x2="1020" y2="657" stroke="#C9CDD4" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="920" y="128" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="actor"/>
<text x="1020" y="153" font-size="13" fill="#1F2329" font-weight="bold" text-anchor="middle">POST_REWRITE（4）</text>
<text x="190" y="202.6" font-size="13" fill="#1F2329">server 级 rewrite（/old/ → /new/）</text>
<polyline points="180,211 206,211 206,229 194,229" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="194,223 184,229 194,235" fill="#8F959E"/>
<text x="190" y="269.6" font-size="13" fill="#1F2329">继续</text>
<polyline points="180,278 448,278" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="448,272 458,278 448,284" fill="#8F959E"/>
<text x="470" y="310.6" font-size="13" fill="#1F2329">选定 location</text>
<polyline points="460,319 486,319 486,337 474,337" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="474,331 464,337 474,343" fill="#8F959E"/>
<text x="470" y="377.6" font-size="13" fill="#1F2329">继续</text>
<polyline points="460,386 728,386" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="728,380 738,386 728,392" fill="#8F959E"/>
<text x="750" y="418.6" font-size="13" fill="#1F2329">location 级 rewrite ... last</text>
<polyline points="740,427 766,427 766,445 754,445" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="754,439 744,445 754,451" fill="#8F959E"/>
<text x="750" y="485.6" font-size="13" fill="#1F2329">继续</text>
<polyline points="740,494 1008,494" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="1008,488 1018,494 1008,500" fill="#8F959E"/>
<text x="1010" y="526.5" font-size="13" fill="#1F2329" text-anchor="end">uri_changed：重新匹配</text>
<polyline points="1020,535 994,535 994,553 1006,553" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="1006,547 1016,553 1006,559" fill="#8F959E"/>
<text x="1010" y="593.5" font-size="13" fill="#1F2329" text-anchor="end">回头</text>
<polyline points="1020,602 472,602" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="472,596 462,602 472,608" fill="#8F959E"/>
<text x="470" y="634.5" font-size="13" fill="#1F2329">新 location 的规则</text>
<polyline points="460,643 728,643" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="728,637 738,643 728,649" fill="#8F959E"/>
<text x="40" y="697" font-size="12" fill="#646A73" data-role="source">来源：ngx_http_rewrite_module.c、ngx_http_core.c（1.31.10）</text>
</svg>
