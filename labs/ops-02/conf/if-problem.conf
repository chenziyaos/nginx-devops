events {
    worker_connections 1024;
}

http {
    access_log logs/access.log combined;

    # Map must be in http block, not in location
    map $arg_test $test_header {
        default   "";
        "yes"     "map-value";
    }

    server {
        listen 127.0.0.1:18048;
        server_name _;

        # This demonstrates the if problem: add_header in if creates an implicit location
        # and can cause unexpected behavior where server-level headers disappear
        location / {
            root html;
            add_header X-Parent "parent-value";
            if ($arg_test = "yes") {
                # add_header in if block creates a location config that overrides parent
                add_header X-IfTest "if-value";
            }
        }

        location /alternative {
            # Better approach: use map to conditionally set header without if
            add_header X-Parent "parent-value";
            add_header X-MapTest $test_header always;
            root html;
        }
    }
}
