<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, Helvetica, Arial, sans-serif" viewBox="0 0 1200 514" width="1200" height="514">
<rect x="0" y="0" width="1200" height="514" rx="16" fill="#FAFBFD" stroke="#DEE0E3" stroke-width="1" data-role="frame"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">ngx_array_push 是否搬家取决于数组在池里的位置</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">从左到右：数组没满直接给下一格；满了时只有元素区在池尾才能原地扩一格，否则整体搬家</text>
<text x="180" y="143" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">调用</text>
<text x="600" y="143" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">数组状态</text>
<text x="1020" y="143" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">结果</text>
<polyline points="294,304 387,304 387,200 476,200" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="476,194 486,200 476,206" fill="#8F959E"/>
<polyline points="294,304 476,304" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="476,298 486,304 476,310" fill="#8F959E"/>
<polyline points="294,304 387,304 387,408 476,408" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="476,402 486,408 476,414" fill="#8F959E"/>
