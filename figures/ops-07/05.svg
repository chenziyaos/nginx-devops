<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, Helvetica, Arial, sans-serif" viewBox="0 0 1200 420" width="1200" height="420">
<rect x="0" y="0" width="1200" height="420" rx="16" fill="#FAFBFD" stroke="#DEE0E3" stroke-width="1" data-role="frame"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">一致性哈希摘掉一台只影响那台的 key；普通哈希会影响其他机器</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">同一组 60 个 key，去掉后端 C 之前和之后各算一次落点</text>
<rect x="40" y="144.4" width="548" height="187" rx="12" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="1.5" data-role="card"/>
<rect x="469.7" y="164.4" width="98.3" height="24" rx="12" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1" data-role="pill"/>
<text x="518.8" y="180.6" font-size="12" fill="#646A73" text-anchor="middle" data-role="pill">影响其他机器</text>
<circle cx="71" cy="173.4" r="11" fill="#FFFFFF" stroke="#BBBFC4" stroke-width="2" data-role="card-id"/>
<text x="71" y="178.4" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">①</text>
<text x="90" y="184.9" font-size="20" fill="#646A73" font-weight="bold" data-role="card-title">普通 hash</text>
<text x="90" y="208" font-size="13" fill="#646A73">crc32(key) % 总权重</text>
<line x1="60" y1="229.4" x2="568" y2="229.4" stroke="#EFF0F1" stroke-width="1"/>
<text x="60" y="263.4" font-size="14" fill="#646A73">去掉 C 后</text>
<text x="568" y="263.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="end">模数变了</text>
<line x1="60" y1="277.4" x2="568" y2="277.4" stroke="#EFF0F1" stroke-width="1"/>
<text x="60" y="301.4" font-size="14" fill="#646A73">不在 C 上的 42 个 key</text>
<rect x="437.3" y="286.4" width="130.7" height="24" rx="8" fill="#FEF1F1" stroke="#F98E8B" stroke-width="1" data-role="value-chip"/>
<text x="560" y="301.4" font-size="14" fill="#D83931" font-weight="bold" text-anchor="end">21 个换了机器</text>
<rect x="612" y="144.4" width="548" height="187" rx="12" fill="#F0F4FF" stroke="#C9CDD4" stroke-width="1.5" data-role="card"/>
<rect x="624" y="143.4" width="524" height="3" rx="1.5" fill="#3370FF" data-role="colorline"/>
<rect x="1028" y="164.4" width="112" height="24" rx="12" fill="#E1EAFF" stroke="#82A7FC" stroke-width="1" data-role="pill"/>
<text x="1084" y="180.6" font-size="12" fill="#245BDB" text-anchor="middle" data-role="pill">仅影响 C 的 key</text>
<circle cx="643" cy="173.4" r="11" fill="#FFFFFF" stroke="#3370FF" stroke-width="2" data-role="card-id"/>
<text x="643" y="178.4" font-size="13" fill="#245BDB" font-weight="bold" text-anchor="middle">②</text>
<text x="662" y="184.9" font-size="20" fill="#245BDB" font-weight="bold" data-role="card-title">hash consistent</text>
<text x="662" y="208" font-size="13" fill="#646A73">每台 160 × 权重 个点</text>
<line x1="632" y1="229.4" x2="1140" y2="229.4" stroke="#EFF0F1" stroke-width="1"/>
<text x="632" y="263.4" font-size="14" fill="#646A73">去掉 C 后</text>
<text x="1140" y="263.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="end">只删 C 的 160 个点</text>
<line x1="632" y1="277.4" x2="1140" y2="277.4" stroke="#EFF0F1" stroke-width="1"/>
<text x="632" y="301.4" font-size="14" fill="#646A73">不在 C 上的 42 个 key</text>
<rect x="1020" y="286.4" width="120" height="24" rx="8" fill="#F0FBEF" stroke="#8EE085" stroke-width="1" data-role="value-chip"/>
<text x="1132" y="301.4" font-size="14" fill="#2EA121" font-weight="bold" text-anchor="end">0 个换了机器</text>
<text x="40" y="396" font-size="12" fill="#646A73" data-role="source">来源：ngx_http_upstream_hash_module.c、labs/ops-07 实验（1.31.9）</text>
</svg>
