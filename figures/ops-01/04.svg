<text x="60" y="320.3" font-size="18" fill="#1F2329" font-weight="bold">创建 *_temp 目录</text>
<text x="60" y="349.9" font-size="14" fill="#646A73">client_body_temp 等</text>
<rect x="432" y="280" width="336" height="96" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="step"/>
<circle cx="744" cy="306" r="13" fill="#F5F6F7" stroke="#BBBFC4" stroke-width="2"/>
<text x="744" y="310.5" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">5</text>
<text x="452" y="320.3" font-size="18" fill="#1F2329" font-weight="bold">打开日志和检查监听</text>
<text x="452" y="349.9" font-size="14" fill="#646A73">address already in use</text>
<rect x="824" y="280" width="336" height="96" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="step"/>
<circle cx="1136" cy="306" r="13" fill="#F5F6F7" stroke="#BBBFC4" stroke-width="2"/>
