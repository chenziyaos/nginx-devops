<rect x="544.8" y="244" width="293.6" height="56" rx="8" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="1" data-role="layer-chip"/>
<text x="691.6" y="277" font-size="14" fill="#1F2329" text-anchor="middle">节点 B</text>
