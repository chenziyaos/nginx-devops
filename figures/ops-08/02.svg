<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, Helvetica, Arial, sans-serif" viewBox="0 0 1200 420" width="1200" height="420">
<rect x="0" y="0" width="1200" height="420" rx="16" fill="#FAFBFD" stroke="#DEE0E3" stroke-width="1" data-role="frame"/>
<text x="40" y="58" font-size="26" fill="#1F2329" font-weight="bold" data-role="title">SNI 不认识时落到默认 server，ssl_reject_handshake 决定握手能否继续</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">先按 SNI 选 server，再看选中的 server 有没有设置 ssl_reject_handshake</text>
<text x="144" y="147" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">ClientHello</text>
<text x="448" y="147" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">选 server</text>
<text x="752" y="147" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">ssl_reject_handshake</text>
<text x="1056" y="147" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">结果</text>
