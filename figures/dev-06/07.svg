<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, Helvetica, Arial, sans-serif" viewBox="0 0 1200 542" width="1200" height="542">
<rect x="0" y="0" width="1200" height="542" rx="16" fill="#FAFBFD" stroke="#DEE0E3" stroke-width="1" data-role="frame"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">count 归零才释放，再按配置走 keepalive、延迟关闭或关闭</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">从左到右依次判断：先看还有没有输出，再看引用计数，最后决定连接去向</text>
<text x="180" y="143" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">finalize_request</text>
<text x="600" y="143" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">能不能释放</text>
<text x="1020" y="143" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">连接去向</text>
