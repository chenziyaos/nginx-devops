# dev-02: a 111-byte server_name next to a second server on the same address,
# with the default server_names_hash_bucket_size
events { }

http {
    server {
        listen 127.0.0.1:19040;
        server_name aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.test;
    }

    server {
        listen 127.0.0.1:19040;
        server_name b.test;
    }
}
