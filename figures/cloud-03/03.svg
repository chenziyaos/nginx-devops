<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">header 匹配只在同一个 path 的规则里找</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">请求 /api/x 不带 x-env；红色是 v2.9.1 实测的结果，绿色是给 / 规则补上 PathPrefix /api 之后</text>
