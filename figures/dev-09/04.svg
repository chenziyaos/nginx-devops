<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, Helvetica, Arial, sans-serif" viewBox="0 0 1200 420" width="1200" height="420">
<rect x="0" y="0" width="1200" height="420" rx="16" fill="#FAFBFD" stroke="#DEE0E3" stroke-width="1" data-role="frame"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">失败的惩罚在几次选择之内就被自动收回，不需要定时器</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">从左到右：第 1 次请求失败降权，第 2 次请求重新参与计算，第 3 次请求权重已恢复。每个框展示 effective_weight 变化和选择结果</text>
<text x="180" y="156.6" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">请求 1</text>
<text x="600" y="156.6" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">请求 2</text>
<text x="1020" y="156.6" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">请求 3</text>
<polyline points="294,303.1 476,303.1" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="476,297.1 486,303.1 476,309.1" fill="#8F959E"/>
<polyline points="714,303.1 896,303.1" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="896,297.1 906,303.1 896,309.1" fill="#8F959E"/>
<polyline points="180,240.6 180,256.6" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="174,256.6 180,266.6 186,256.6" fill="#8F959E"/>
<rect x="70" y="171.6" width="220" height="65" rx="8" fill="#FEF1F1" stroke="#F98E8B" stroke-width="1.5" data-role="node"/>
<text x="180" y="199.5" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">A 失败</text>
<text x="180" y="219.3" font-size="12" fill="#646A73" text-anchor="middle">effective 5 → 3（扣 5/2）</text>
<rect x="70" y="270.6" width="220" height="65" rx="8" fill="#F0F4FF" stroke="#82A7FC" stroke-width="1.5" data-role="node"/>
<text x="180" y="298.5" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">同一请求重试</text>
<text x="180" y="318.3" font-size="12" fill="#646A73" text-anchor="middle">A 在 tried 位图里，选 B</text>
<rect x="490" y="270.6" width="220" height="65" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="600" y="298.5" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">A 加 3</text>
<text x="600" y="318.3" font-size="12" fill="#646A73" text-anchor="middle">effective → 4，current 1，选 C</text>
<rect x="910" y="270.6" width="220" height="65" rx="8" fill="#F0FBEF" stroke="#8EE085" stroke-width="1.5" data-role="node"/>
<text x="1020" y="298.5" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">A 加 4</text>
<text x="1020" y="318.3" font-size="12" fill="#646A73" text-anchor="middle">effective → 5，选 A</text>
<text x="40" y="396" font-size="12" fill="#646A73" data-role="source">来源：ngx_http_upstream_round_robin.c、labs/dev-09 实验输出（1.31.10）</text>
</svg>
