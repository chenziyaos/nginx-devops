<text x="686" y="332.2" font-size="13" fill="#646A73">request_handler</text>
<rect x="290" y="277.6" width="240" height="76" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="step"/>
<circle cx="510" cy="299.6" r="13" fill="#F5F6F7" stroke="#BBBFC4" stroke-width="2"/>
