<text x="491.5" y="155" font-size="14" fill="#1F2329" font-weight="bold">ingress2gateway v1.2.0</text>
<text x="818.6" y="155" font-size="14" fill="#1F2329" font-weight="bold">NGF v2.9.1</text>
<text x="58" y="197.9" font-size="14" fill="#1F2329">canary-weight: 20</text>
<text x="491.5" y="197.9" font-size="14" fill="#1F2329">权重 v1 80、v2 20</text>
<text x="818.6" y="197.9" font-size="14" fill="#1F2329">生效</text>
<text x="58" y="239.9" font-size="14" fill="#1F2329">enable-cors</text>
<text x="491.5" y="239.9" font-size="14" fill="#1F2329">CORS filter</text>
<text x="818.6" y="239.9" font-size="14" fill="#1F2329">生效</text>
<text x="58" y="291.9" font-size="14" fill="#1F2329">use-regex</text>
<text x="491.5" y="291.9" font-size="14" fill="#1F2329">RegularExpression，加 (?i) 前缀</text>
<text x="818.6" y="280.9" font-size="14" fill="#1F2329">UnsupportedValue，整条 route 不</text>
<text x="818.6" y="302.9" font-size="14" fill="#1F2329">生效</text>
<text x="58" y="353.9" font-size="14" fill="#2EA121" font-weight="bold">proxy-read-timeout: 30</text>
<text x="491.5" y="342.9" font-size="14" fill="#2EA121" font-weight="bold">timeouts.request 5m0s（最大值</text>
<text x="491.5" y="364.9" font-size="14" fill="#2EA121" font-weight="bold">乘 10）</text>
<text x="818.6" y="342.9" font-size="14" fill="#2EA121" font-weight="bold">UnsupportedField，忽略，用 nginx 默</text>
