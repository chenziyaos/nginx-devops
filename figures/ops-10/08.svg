<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, Helvetica, Arial, sans-serif" viewBox="0 0 1200 420" width="1200" height="420">
<rect x="0" y="0" width="1200" height="420" rx="16" fill="#FAFBFD" stroke="#DEE0E3" stroke-width="1" data-role="frame"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">缓存条目按 inactive 删除，与有效期无关</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">从左到右：最后访问时刻开始计时，默认 inactive = 600 秒后 manager 检查一次就删除</text>
<rect x="40" y="172" width="238" height="118" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="step"/>
<text x="60" y="212.3" font-size="18" fill="#1F2329" font-weight="bold">最后访问</text>
<rect x="334" y="172" width="238" height="118" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="step"/>
<text x="354" y="212.3" font-size="18" fill="#1F2329" font-weight="bold">算 expire</text>
<text x="354" y="241.9" font-size="14" fill="#646A73">访问时间 + inactive</text>
<text x="354" y="263.9" font-size="14" fill="#646A73">默认 600 秒</text>
<rect x="628" y="172" width="238" height="118" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="step"/>
<text x="648" y="212.3" font-size="18" fill="#1F2329" font-weight="bold">manager 检查</text>
<text x="648" y="241.9" font-size="14" fill="#646A73">间隔最长 10 秒</text>
<text x="648" y="263.9" font-size="14" fill="#646A73">未到 expire 就继续等</text>
<rect x="922" y="172" width="238" height="118" rx="12" fill="#FEF1F1" stroke="#F54A45" stroke-width="2" data-role="step"/>
<text x="942" y="212.3" font-size="18" fill="#1F2329" font-weight="bold">删除</text>
<text x="942" y="241.9" font-size="14" fill="#646A73">删文件和共享内存节点</text>
<text x="942" y="263.9" font-size="14" fill="#646A73">不看 valid_sec</text>
<polyline points="284,231 318,231" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="318,225 328,231 318,237" fill="#8F959E"/>
<polyline points="578,231 612,231" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="612,225 622,231 612,237" fill="#8F959E"/>
<polyline points="872,231 906,231" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="906,225 916,231 906,237" fill="#8F959E"/>
<text x="40" y="396" font-size="12" fill="#646A73" data-role="source">来源：本文整理</text>
</svg>
