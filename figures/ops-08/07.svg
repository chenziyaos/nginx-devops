<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, Helvetica, Arial, sans-serif" viewBox="0 0 1200 479" width="1200" height="479">
<rect x="0" y="0" width="1200" height="479" rx="16" fill="#FAFBFD" stroke="#DEE0E3" stroke-width="1" data-role="frame"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">浏览器从 Alt-Svc 头学到 HTTP/3，下一次访问时用 QUIC</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">TCP 和 UDP 共用同一个端口号和证书；浏览器先走 TCP 拿到 Alt-Svc，然后试 UDP</text>
<line x1="226.7" y1="168" x2="226.7" y2="415" stroke="#C9CDD4" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="126.7" y="128" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="actor"/>
<text x="226.7" y="153" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">浏览器</text>
<line x1="600" y1="168" x2="600" y2="415" stroke="#C9CDD4" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="500" y="128" width="200" height="40" rx="8" fill="#F0F4FF" stroke="#82A7FC" stroke-width="1.5" data-role="actor"/>
<text x="600" y="153" font-size="14" fill="#245BDB" font-weight="bold" text-anchor="middle">nginx TCP 18160</text>
<line x1="973.3" y1="168" x2="973.3" y2="415" stroke="#C9CDD4" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="873.3" y="128" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="actor"/>
<text x="973.3" y="153" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">nginx UDP 18160</text>
<text x="236.7" y="202.6" font-size="13" fill="#1F2329">第一次访问：TLS + h2</text>
<polyline points="226.7,211 588,211" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="588,205 598,211 588,217" fill="#8F959E"/>
<text x="590" y="243.6" font-size="13" fill="#1F2329" text-anchor="end">响应头 alt-svc，h3 在 18160，ma=86400</text>
<polyline points="600,252 238.7,252" fill="none" stroke="#8F959E" stroke-width="2" stroke-dasharray="6 4"/>
<polygon points="238.7,246 228.7,252 238.7,258" fill="#8F959E"/>
<text x="236.7" y="284.6" font-size="13" fill="#1F2329">记住 86400 秒</text>
<polyline points="226.7,293 252.7,293 252.7,311 240.7,311" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="240.7,305 230.7,311 240.7,317" fill="#8F959E"/>
<text x="236.7" y="351.6" font-size="13" fill="#1F2329">之后的访问：QUIC 握手，ALPN h3</text>
<polyline points="226.7,360 961.3,360" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="961.3,354 971.3,360 961.3,366" fill="#8F959E"/>
<text x="963.3" y="392.6" font-size="13" fill="#1F2329" text-anchor="end">HTTP/3 响应</text>
<polyline points="973.3,401 238.7,401" fill="none" stroke="#8F959E" stroke-width="2" stroke-dasharray="6 4"/>
<polygon points="238.7,395 228.7,401 238.7,407" fill="#8F959E"/>
<text x="40" y="455" font-size="12" fill="#646A73" data-role="source">来源：ngx_http_request.c、ngx_http_ssl_module.c（1.31.10）</text>
</svg>
