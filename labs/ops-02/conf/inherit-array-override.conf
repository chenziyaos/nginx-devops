events {
    worker_connections 1024;
}

http {
    access_log logs/access.log combined;

    server {
        listen 127.0.0.1:18045;
        server_name _;

        # Parent add_header
        add_header X-Parent "from-server";

        location / {
            # Child add_header - should OVERRIDE parent, not inherit
            add_header X-Child "from-location";
            return 200 "test\n";
        }

        location /inherited {
            # No add_header here - should inherit parent
            return 200 "inherited\n";
        }
    }
}
