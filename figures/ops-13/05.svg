<text x="530.4" y="252.7" font-size="14" fill="#646A73">using</text>
<text x="530.4" y="274.7" font-size="14" fill="#646A73">configuration</text>
<rect x="745.6" y="160.8" width="179.2" height="146" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="step"/>
