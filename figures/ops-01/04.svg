<text x="60" y="168.3" font-size="18" fill="#1F2329" font-weight="bold">解析 -g 指令</text>
<rect x="432" y="128" width="336" height="96" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="step"/>
<circle cx="744" cy="154" r="13" fill="#F5F6F7" stroke="#BBBFC4" stroke-width="2"/>
