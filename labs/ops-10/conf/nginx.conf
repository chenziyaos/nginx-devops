# ops-10: proxy cache. 18200 is the caching proxy, 18201 the backend.
worker_processes 1;
error_log logs/error.log info;

events { worker_connections 64; }

http {
    log_format front   '$request_method $uri $upstream_cache_status $status';
    log_format backend '$request_method $request_uri $status';

    proxy_cache_path out/run/cache   levels=1:2 keys_zone=c:1m;
    proxy_cache_path out/run/cache-i levels=1:2 keys_zone=ci:1m inactive=2s;

    # the backend: every body carries $msec, so a cached copy is easy to tell apart
    server {
        listen 127.0.0.1:18201;
        access_log logs/backend.log backend;
        root out/run/www;

        location /b/plain   { return 200 "$uri $msec\n"; }
        location /b/cc60    { add_header Cache-Control "max-age=60"; return 200 "$uri $msec\n"; }
        location /b/smax    { add_header Cache-Control "max-age=60, s-maxage=90"; return 200 "$uri $msec\n"; }
        location /b/xae     { add_header X-Accel-Expires 30; add_header Cache-Control "max-age=60"; return 200 "$uri $msec\n"; }
        location /b/exppast { add_header Expires "Thu, 01 Jan 1970 00:00:01 GMT"; add_header Cache-Control "max-age=60"; return 200 "$uri $msec\n"; }
        location /b/private { add_header Cache-Control "private, max-age=60"; return 200 "$uri $msec\n"; }
        location /b/age0    { add_header Cache-Control "max-age=0"; return 200 "$uri $msec\n"; }
        location /b/xae0    { add_header X-Accel-Expires 0; add_header Cache-Control "max-age=60"; return 200 "$uri $msec\n"; }
        location /b/cookie  { add_header Set-Cookie "a=1"; return 200 "$uri $msec\n"; }

        # 3000 bytes at 1000 bytes/s: about 2 s
        location /b/slow    { limit_rate 1000; }
        # 200 while out/run/www/flag.txt exists, 500 after run.sh removes it
        location /b/toggle  { try_files /flag.txt =500; }
        # a static file: ETag and Last-Modified for revalidation
        location /b/file    { try_files /file.txt =404; }
    }

    server {
        listen 127.0.0.1:18200;
        access_log logs/access.log front;

        proxy_cache c;
        proxy_cache_valid 200 3s;
        add_header X-Cache $upstream_cache_status always;

        location /b/      { proxy_pass http://127.0.0.1:18201; }

        # two locations that send the same URI to the backend, and one with the documented key
        location /k1/     { proxy_pass http://127.0.0.1:18201/b/plain; }
        location /k2/     { proxy_pass http://127.0.0.1:18201/b/plain; }
        location /k3/     { proxy_cache_key $scheme$proxy_host$request_uri; proxy_pass http://127.0.0.1:18201/b/plain; }

        location /seq/    { proxy_cache_valid 200 2s; proxy_pass http://127.0.0.1:18201/b/plain; }

        location /uses/   { proxy_cache_min_uses 2; proxy_pass http://127.0.0.1:18201/b/plain; }

        location /bg/ {
            proxy_cache_valid 200 5s;
            proxy_cache_use_stale updating;
            proxy_cache_background_update on;
            proxy_pass http://127.0.0.1:18201/b/plain;
        }

        location /lock/   { proxy_cache_lock on; proxy_cache_valid 200 1m; proxy_pass http://127.0.0.1:18201/b/slow; }
        location /nolock/ { proxy_cache_valid 200 1m; proxy_pass http://127.0.0.1:18201/b/slow; }

        location /err/ {
            proxy_cache_valid 200 2s;
            proxy_cache_use_stale error timeout http_500;
            proxy_pass http://127.0.0.1:18201/b/toggle;
        }
        location /err2/ {
            proxy_cache_valid 200 2s;
            proxy_pass http://127.0.0.1:18201/b/toggle;
        }

        location /rv/ {
            proxy_cache_valid 200 2s;
            proxy_cache_revalidate on;
            proxy_pass http://127.0.0.1:18201/b/file;
        }

        location /byp/    { proxy_cache_bypass $http_x_refresh; proxy_pass http://127.0.0.1:18201/b/plain; }

        location /inact/  { proxy_cache ci; proxy_cache_valid 200 1h; proxy_pass http://127.0.0.1:18201/b/plain; }
    }
}
