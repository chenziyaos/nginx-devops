events {
    worker_connections 1024;
}

http {
    access_log logs/access.log combined;

    server {
        listen 127.0.0.1:18049;
        server_name _;

        # Test add_header on 200 (safe status)
        location /ok {
            add_header X-Regular "regular";
            add_header X-Always "always" always;
            return 200 "ok\n";
        }

        # Test add_header on 404 (unsafe status)
        location /notfound {
            add_header X-Regular "regular";
            add_header X-Always "always" always;
            return 404 "not found\n";
        }
    }
}
