# ops-03: a config with an error, loaded by reload
worker_processes 2;
error_log logs/error.log info;

events { worker_connections 64; }

http {
    log_format lab '$pid $uri $status $body_bytes_sent';
    access_log logs/access.log lab;

    server {
        listen 127.0.0.1:18060;
        root   html;
        no_such_directive on;

        location / {
            return 200 "broken worker=$pid\n";
        }
        location /big/ {
            root       out/run;
            limit_rate 200k;
        }
    }
}
