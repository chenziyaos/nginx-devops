<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, Helvetica, Arial, sans-serif" viewBox="0 0 1200 630" width="1200" height="630">
<rect x="0" y="0" width="1200" height="630" rx="16" fill="#FAFBFD" stroke="#DEE0E3" stroke-width="1" data-role="frame"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">reload 后会话能否复用，取决于 ticket 密钥的存储位置</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">左边：无共享缓存，密钥随 SSL_CTX 创建；右边：有共享缓存，密钥存在内存里</text>
<line x1="180" y1="168" x2="180" y2="566" stroke="#C9CDD4" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="80" y="128" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="actor"/>
<text x="180" y="153" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">客户端</text>
<line x1="460" y1="168" x2="460" y2="566" stroke="#C9CDD4" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="360" y="128" width="200" height="40" rx="8" fill="#FFF5EB" stroke="#FFBA6B" stroke-width="1.5" data-role="actor"/>
<text x="460" y="153" font-size="14" fill="#D46B08" font-weight="bold" text-anchor="middle">旧配置 SSL_CTX</text>
<line x1="740" y1="168" x2="740" y2="566" stroke="#C9CDD4" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="640" y="128" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="actor"/>
<text x="740" y="153" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">新配置 SSL_CTX</text>
<line x1="1020" y1="168" x2="1020" y2="566" stroke="#C9CDD4" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="920" y="128" width="200" height="40" rx="8" fill="#F0F4FF" stroke="#82A7FC" stroke-width="1.5" data-role="actor"/>
<text x="1020" y="153" font-size="14" fill="#245BDB" font-weight="bold" text-anchor="middle">共享内存 SSL 区</text>
<text x="190" y="202.6" font-size="13" fill="#1F2329">第一次握手</text>
<polyline points="180,211 448,211" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="448,205 458,211 448,217" fill="#8F959E"/>
<text x="450" y="243.6" font-size="13" fill="#1F2329" text-anchor="end">ticket（无共享缓存时用自己的密钥）</text>
<polyline points="460,252 192,252" fill="none" stroke="#8F959E" stroke-width="2" stroke-dasharray="6 4"/>
<polygon points="192,246 182,252 192,258" fill="#8F959E"/>
<text x="470" y="284.6" font-size="13" fill="#1F2329">reload：重新创建 SSL_CTX；同名同大</text>
<text x="470" y="304.6" font-size="13" fill="#1F2329">小的共享内存原样交给新配置</text>
<polyline points="460,313 728,313" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="728,307 738,313 728,319" fill="#8F959E"/>
<rect x="40" y="329" width="59.4" height="24" rx="12" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1" data-role="pill"/>
<text x="69.7" y="345.2" font-size="12" fill="#646A73" text-anchor="middle" data-role="pill">reload</text>
<line x1="107.4" y1="341" x2="1160" y2="341" stroke="#EFF0F1" stroke-width="1"/>
<text x="190" y="379.6" font-size="13" fill="#1F2329">带着 ticket 重连</text>
<polyline points="180,388 728,388" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="728,382 738,388 728,394" fill="#8F959E"/>
<text x="730" y="420.6" font-size="13" fill="#1F2329" text-anchor="end">无共享缓存：解不开，完整握手（New）</text>
<polyline points="740,429 192,429" fill="none" stroke="#8F959E" stroke-width="2" stroke-dasharray="6 4"/>
<polygon points="192,423 182,429 192,435" fill="#8F959E"/>
<text x="750" y="461.6" font-size="13" fill="#1F2329">有共享缓存：从共享内存取密钥</text>
<polyline points="740,470 1008,470" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="1008,464 1018,470 1008,476" fill="#8F959E"/>
<text x="1010" y="502.6" font-size="13" fill="#1F2329" text-anchor="end">密钥返回</text>
<polyline points="1020,511 752,511" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="752,505 742,511 752,517" fill="#8F959E"/>
<text x="730" y="543.5" font-size="13" fill="#1F2329" text-anchor="end">解开 ticket，复用（Reused）</text>
<polyline points="740,552 192,552" fill="none" stroke="#8F959E" stroke-width="2" stroke-dasharray="6 4"/>
<polygon points="192,546 182,552 192,558" fill="#8F959E"/>
<text x="40" y="606" font-size="12" fill="#646A73" data-role="source">来源：ngx_event_openssl.c（1.31.10）</text>
</svg>
