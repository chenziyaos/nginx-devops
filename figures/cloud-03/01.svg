<text x="40" y="58" font-size="25" fill="#1F2329" font-weight="bold" data-role="title">注解是字符串，Gateway API 是有 schema 的资源；两者最后都落到 nginx 配置</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">上面是 Ingress 的路径，下面是 Gateway API 加 NGF 的路径；红色是没人校验的环节，绿色是会报错或写 status 的环节</text>
