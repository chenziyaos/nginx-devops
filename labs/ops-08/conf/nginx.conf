# ops-08: TLS, HTTP/2 and HTTP/3. run.sh creates the CA and certificates in out/run/.
worker_processes 1;
error_log logs/error.log info;

events { worker_connections 64; }

http {
    access_log off;
    root html;

    # a.test: an RSA and an ECDSA certificate, HTTP/2, HTTP/3
    server {
        listen 127.0.0.1:18160 ssl default_server;
        listen 127.0.0.1:18160 quic reuseport;
        server_name a.test;

        ssl_certificate     ../out/run/a-rsa.crt;
        ssl_certificate_key ../out/run/a-rsa.key;
        ssl_certificate     ../out/run/a-ec.crt;
        ssl_certificate_key ../out/run/a-ec.key;

        http2 on;
        http3 on;
        add_header Alt-Svc 'h3=":18160"; ma=86400';

        location /proto { return 200 "$server_protocol $ssl_protocol\n"; }
    }

    server {
        listen 127.0.0.1:18160 ssl;
        server_name b.test;
        ssl_certificate     ../out/run/b.crt;
        ssl_certificate_key ../out/run/b.key;
    }

    # unknown names are refused on this port
    server {
        listen 127.0.0.1:18161 ssl default_server;
        ssl_reject_handshake on;
    }
    server {
        listen 127.0.0.1:18161 ssl;
        server_name a.test;
        ssl_certificate     ../out/run/a-rsa.crt;
        ssl_certificate_key ../out/run/a-rsa.key;
    }

    # tickets without and with a shared session cache; no HTTP/2
    server {
        listen 127.0.0.1:18162 ssl;
        ssl_certificate     ../out/run/a-rsa.crt;
        ssl_certificate_key ../out/run/a-rsa.key;
    }
    server {
        listen 127.0.0.1:18163 ssl;
        ssl_certificate     ../out/run/a-rsa.crt;
        ssl_certificate_key ../out/run/a-rsa.key;
        ssl_session_cache   shared:SSL:1m;
        error_page 497 =301 https://$host:18163$request_uri;
    }

    # certificates loaded at handshake time by the SNI name, without and with a cache
    server {
        listen 127.0.0.1:18167 ssl;
        ssl_certificate     ../out/run/dyn/$ssl_server_name.crt;
        ssl_certificate_key ../out/run/dyn/$ssl_server_name.key;
    }
    server {
        listen 127.0.0.1:18168 ssl;
        ssl_certificate     ../out/run/dyn/$ssl_server_name.crt;
        ssl_certificate_key ../out/run/dyn/$ssl_server_name.key;
        ssl_certificate_cache max=10;
    }

    # plain HTTP with HTTP/2 prior knowledge, and without
    server {
        listen 127.0.0.1:18164;
        http2 on;
        location /proto { return 200 "$server_protocol\n"; }
    }
    server {
        listen 127.0.0.1:18165;
        location /proto { return 200 "$server_protocol\n"; }
    }
}
