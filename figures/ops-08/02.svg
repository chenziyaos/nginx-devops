<polygon points="938,198 948,204 938,210" fill="#8F959E"/>
<polyline points="860,256 901,256 901,308 938,308" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="938,302 948,308 938,314" fill="#8F959E"/>
<rect x="40" y="214" width="208" height="84" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="144" y="241.9" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">SNI</text>
<text x="144" y="261.7" font-size="12" fill="#646A73" text-anchor="middle">ngx_http_find_virtual_serve</text>
<text x="144" y="280.7" font-size="12" fill="#646A73" text-anchor="middle">r</text>
<rect x="344" y="162" width="208" height="84" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="448" y="189.9" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">找到</text>
<text x="448" y="209.7" font-size="12" fill="#646A73" text-anchor="middle">换成这个 server 的 SSL_CTX</text>
<text x="448" y="228.7" font-size="12" fill="#646A73" text-anchor="middle">和证书</text>
<rect x="344" y="266" width="208" height="84" rx="8" fill="#FFF5EB" stroke="#FFBA6B" stroke-width="1.5" data-role="node"/>
<text x="448" y="303.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">没找到或没有 SNI</text>
<text x="448" y="323.2" font-size="12" fill="#646A73" text-anchor="middle">留在端口的默认 server</text>
<rect x="648" y="214" width="208" height="84" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="752" y="260.9" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">该 server 设置了吗？</text>
