<text x="560" y="265" font-size="14" fill="#245BDB" font-weight="bold" text-anchor="end">hello（插入）</text>
<line x1="60" y1="279" x2="568" y2="279" stroke="#EFF0F1" stroke-width="1"/>
<text x="60" y="303" font-size="14" fill="#646A73">3</text>
<text x="568" y="303" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="end">copy_filter（只有 body）</text>
<line x1="60" y1="317" x2="568" y2="317" stroke="#EFF0F1" stroke-width="1"/>
<text x="60" y="341" font-size="14" fill="#646A73">4</text>
<text x="568" y="341" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="end">range_body（只有 body）</text>
<line x1="60" y1="355" x2="568" y2="355" stroke="#EFF0F1" stroke-width="1"/>
<text x="60" y="379" font-size="14" fill="#646A73">5</text>
<text x="568" y="379" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="end">not_modified</text>
<rect x="612" y="128" width="548" height="281" rx="12" fill="#F0F4FF" stroke="#C9CDD4" stroke-width="1.5" data-role="card"/>
<rect x="624" y="127" width="524" height="3" rx="1.5" fill="#3370FF" data-role="colorline"/>
<text x="632" y="168.5" font-size="20" fill="#245BDB" font-weight="bold" data-role="card-title">header filter 调用顺序</text>
<line x1="632" y1="193" x2="1140" y2="193" stroke="#EFF0F1" stroke-width="1"/>
<text x="632" y="227" font-size="14" fill="#646A73">1</text>
<text x="1140" y="227" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="end">not_modified</text>
<line x1="632" y1="241" x2="1140" y2="241" stroke="#EFF0F1" stroke-width="1"/>
<text x="632" y="265" font-size="14" fill="#646A73">2</text>
<rect x="973.3" y="250" width="166.7" height="24" rx="8" fill="#F0F4FF" stroke="#82A7FC" stroke-width="1" data-role="value-chip"/>
<text x="1132" y="265" font-size="14" fill="#245BDB" font-weight="bold" text-anchor="end">hello：加 X-Hello</text>
<line x1="632" y1="279" x2="1140" y2="279" stroke="#EFF0F1" stroke-width="1"/>
<text x="632" y="303" font-size="14" fill="#646A73">3</text>
<text x="1140" y="303" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="end">headers_filter：加 X-Add</text>
<line x1="632" y1="317" x2="1140" y2="317" stroke="#EFF0F1" stroke-width="1"/>
<text x="632" y="341" font-size="14" fill="#646A73">4</text>
<text x="1140" y="341" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="end">…</text>
<line x1="632" y1="355" x2="1140" y2="355" stroke="#EFF0F1" stroke-width="1"/>
<text x="632" y="379" font-size="14" fill="#646A73">5</text>
<text x="1140" y="379" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="end">header_filter 写出</text>
