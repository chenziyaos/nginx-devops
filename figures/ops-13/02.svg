<text x="58" y="178.2" font-size="14" fill="#1F2329" font-weight="bold">哪部分放不下</text>
<text x="487.7" y="178.2" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">内部状态</text>
<text x="716.2" y="178.2" font-size="14" fill="#2EA121" font-weight="bold" text-anchor="middle">对外状态码</text>
<text x="852.7" y="178.2" font-size="14" fill="#1F2329" font-weight="bold">error.log 原文</text>
<text x="58" y="221.1" font-size="14" fill="#1F2329">请求行放不进一个缓冲</text>
<text x="487.7" y="221.1" font-size="14" fill="#1F2329" text-anchor="middle">414</text>
<text x="716.2" y="221.1" font-size="14" fill="#2EA121" font-weight="bold" text-anchor="middle">414</text>
<text x="852.7" y="221.1" font-size="14" fill="#1F2329">too long URI</text>
<text x="58" y="263.1" font-size="14" fill="#1F2329">某个头行放不进一个缓冲</text>
<text x="487.7" y="263.1" font-size="14" fill="#1F2329" text-anchor="middle">494</text>
<text x="716.2" y="263.1" font-size="14" fill="#2EA121" font-weight="bold" text-anchor="middle">400</text>
<text x="852.7" y="263.1" font-size="14" fill="#1F2329">too long header line</text>
