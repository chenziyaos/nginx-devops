<text x="844" y="168.3" font-size="18" fill="#1F2329" font-weight="bold">打开 pid 文件</text>
<text x="844" y="197.9" font-size="14" fill="#646A73">不写内容</text>
<rect x="40" y="280" width="336" height="96" rx="12" fill="#E1EAFF" stroke="#3370FF" stroke-width="2" data-role="step"/>
<circle cx="352" cy="306" r="13" fill="#E1EAFF" stroke="#3370FF" stroke-width="2"/>
