<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, Helvetica, Arial, sans-serif" viewBox="0 0 1200 420" width="1200" height="420">
<rect x="0" y="0" width="1200" height="420" rx="16" fill="#FAFBFD" stroke="#DEE0E3" stroke-width="1" data-role="frame"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">resolve 让 zone 里的 peer 跟着 DNS 走</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">从左到右是一次重新解析；结果写进共享内存，所有 worker 都用同一份 peer</text>
<rect x="40" y="152" width="179.2" height="168" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="step"/>
<text x="60" y="192.3" font-size="18" fill="#1F2329" font-weight="bold">配置阶段</text>
<text x="60" y="221.9" font-size="14" fill="#646A73">带 resolve 的名字不</text>
<text x="60" y="243.9" font-size="14" fill="#646A73">解析</text>
<text x="60" y="265.9" font-size="14" fill="#646A73">（no_resolve）</text>
<rect x="275.2" y="152" width="179.2" height="168" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="step"/>
<text x="295.2" y="192.3" font-size="18" fill="#1F2329" font-weight="bold">定时器到期</text>
<text x="295.2" y="221.9" font-size="14" fill="#646A73">zone 模块调用</text>
<text x="295.2" y="243.9" font-size="14" fill="#646A73">resolver</text>
<rect x="510.4" y="152" width="179.2" height="168" rx="12" fill="#F0F4FF" stroke="#82A7FC" stroke-width="1.5" data-role="step"/>
<text x="530.4" y="192.3" font-size="18" fill="#1F2329" font-weight="bold">CoreDNS</text>
<text x="530.4" y="220.3" font-size="18" fill="#1F2329" font-weight="bold">应答</text>
<text x="530.4" y="249.9" font-size="14" fill="#646A73">headless 名字返回</text>
<text x="530.4" y="271.9" font-size="14" fill="#646A73">每个 ready Pod 的</text>
<text x="530.4" y="293.9" font-size="14" fill="#646A73">A 记录</text>
<rect x="745.6" y="152" width="179.2" height="168" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="step"/>
<text x="765.6" y="192.3" font-size="18" fill="#1F2329" font-weight="bold">更新 peer</text>
<text x="765.6" y="221.9" font-size="14" fill="#646A73">新地址加入，消失的</text>
<text x="765.6" y="243.9" font-size="14" fill="#646A73">地址删除</text>
<rect x="980.8" y="152" width="179.2" height="168" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="step"/>
<text x="1000.8" y="192.3" font-size="18" fill="#1F2329" font-weight="bold">下一次解析</text>
<text x="1000.8" y="221.9" font-size="14" fill="#646A73">valid（或 TTL）之</text>
<text x="1000.8" y="243.9" font-size="14" fill="#646A73">后再加 1 秒</text>
<polyline points="225.2,236 259.2,236" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="259.2,230 269.2,236 259.2,242" fill="#8F959E"/>
<polyline points="460.4,236 494.4,236" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="494.4,230 504.4,236 494.4,242" fill="#8F959E"/>
<polyline points="695.6,236 729.6,236" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="729.6,230 739.6,236 729.6,242" fill="#8F959E"/>
<polyline points="930.8,236 964.8,236" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="964.8,230 974.8,236 964.8,242" fill="#8F959E"/>
<text x="40" y="396" font-size="12" fill="#646A73" data-role="source">来源：ngx_http_upstream.c、ngx_http_upstream_zone_module.c、ngx_resolver.c（1.31.10）</text>
</svg>
