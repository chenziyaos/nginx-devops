worker_processes 1;
error_log logs/error.log debug;

events {
    worker_connections 64;
}

http {
    log_format v '$server_name $status $uri';
    access_log logs/access.log v;

    # --- server selection: port 18080, no default_server, so the first one is the default
    server {
        listen 127.0.0.1:18080;
        server_name first.test;
        return 200 "first.test\n";
    }

    server {
        listen 127.0.0.1:18080;
        server_name ~^www\..+\.org$;
        return 200 "regex ~^www\..+\.org\n";
    }

    server {
        listen 127.0.0.1:18080;
        server_name ~^(?<n>[0-9]+)\.num\.test$;
        return 200 "regex num, n=$n\n";
    }

    server {
        listen 127.0.0.1:18080;
        server_name example.com;
        return 200 "example.com\n";
    }

    server {
        listen 127.0.0.1:18080;
        server_name *.example.com;
        return 200 "*.example.com\n";
    }

    server {
        listen 127.0.0.1:18080;
        server_name *.api.example.com;
        return 200 "*.api.example.com\n";
    }

    server {
        listen 127.0.0.1:18080;
        server_name www.*;
        return 200 "www.*\n";
    }

    server {
        listen 127.0.0.1:18080;
        server_name .dot.test;
        return 200 ".dot.test\n";
    }

    # --- port 18081: the second server is marked default_server
    server {
        listen 127.0.0.1:18081;
        server_name a.test;
        return 200 "a.test\n";
    }

    server {
        listen 127.0.0.1:18081 default_server;
        server_name b.test;
        return 200 "b.test (default_server)\n";
    }

    # --- location matching: port 18082
    server {
        listen 127.0.0.1:18082;

        location = / {
            return 200 "= /\n";
        }

        location / {
            return 200 "/\n";
        }

        location /docs/ {
            return 200 "/docs/\n";
        }

        location ^~ /static/ {
            return 200 "^~ /static/\n";
        }

        location /static/img/ {
            return 200 "/static/img/\n";
        }

        location = /exact {
            return 200 "= /exact\n";
        }

        location /exact {
            return 200 "/exact\n";
        }

        location /api {
            return 200 "/api\n";
        }

        location ~ ^/api/v[0-9]+/ {
            return 200 "~ ^/api/v[0-9]+/\n";
        }

        location ~ ^/api {
            return 200 "~ ^/api\n";
        }

        location ~ \.(png|jpg)$ {
            return 200 "~ \.(png|jpg)\n";
        }

        location ~* \.pdf$ {
            return 200 "~* \.pdf\n";
        }
    }

    # --- predicate locations: port 18083
    server {
        listen 127.0.0.1:18083;

        location / {
            return 200 "/\n";
        }

        location ^~ /stable/ {
            return 200 "^~ /stable/\n";
        }

        location ~ \.json$ {
            return 200 "~ \.json\n";
        }

        location $http_x_beta {
            return 200 "$http_x_beta (predicate)\n";
        }

        location /admin/ {
            location $http_x_admin {
                return 200 "/admin/ > $http_x_admin (nested predicate)\n";
            }

            return 200 "/admin/\n";
        }
    }

    # --- try_files: port 18084
    server {
        listen 127.0.0.1:18084;
        root html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            try_files $uri @backend;
        }

        location @backend {
            return 200 "named location, uri=$uri\n";
        }

        location /strict/ {
            try_files $uri =404;
        }

        location /loop/ {
            try_files $uri /loop/again;
        }
    }

    # --- root and alias: port 18085
    server {
        listen 127.0.0.1:18085;

        location /root-demo/ {
            root html;
        }

        location /files/ {
            alias data/files/;
        }

        # the location has no trailing slash, the alias has one
        location /img {
            alias data/files/;
        }

        location ~ ^/cap/(.+)$ {
            alias data/files/$1;
        }
    }

    # --- phases: port 18086
    server {
        listen 127.0.0.1:18086;
        root html;

        location /deny-return/ {
            deny all;
            return 200 "return ran, deny did not\n";
        }

        location /deny-static/ {
            deny all;
        }

        location /rewrite-last/ {
            rewrite ^/rewrite-last/(.*)$ /target/$1 last;
        }

        location /rewrite-break/ {
            rewrite ^/rewrite-break/(.*)$ /target/$1 break;
        }

        location /target/ {
            return 200 "location /target/, uri=$uri\n";
        }
    }
}
