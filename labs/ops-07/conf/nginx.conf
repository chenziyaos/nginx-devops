# ops-07: load balancing methods and passive health checks. One worker, so every request
# sees the same balancer state. 18141-18146 are backends that answer with their port,
# 18158 and 18159 are ports nobody listens on.
worker_processes 1;
error_log logs/error.log warn;

events { worker_connections 256; }

http {
    log_format t '$request_uri $status $upstream_addr $upstream_status';
    access_log logs/access.log t;

    # backends: the body is the port; 18144 sends files at 50 KB/s, /slow.bin is slow everywhere
    map $server_port $rate { 18144 50k; default 0; }
    map $server_port $fail { 18142 1; default 0; }

    server {
        listen 127.0.0.1:18141;
        listen 127.0.0.1:18142;
        listen 127.0.0.1:18143;
        listen 127.0.0.1:18144;
        listen 127.0.0.1:18146;
        access_log off;
        root out/run/files;
        limit_rate $rate;

        location / { return 200 "$server_port\n"; }
        location ~ \.bin$ { add_header X-Port $server_port; }
        location = /slow.bin { limit_rate 50k; add_header X-Port $server_port; }
        location /flaky { if ($fail) { return 500 "$server_port\n"; } return 200 "$server_port\n"; }
    }

    upstream rr       { server 127.0.0.1:18141 weight=5; server 127.0.0.1:18142; server 127.0.0.1:18143; }
    upstream onedead  { server 127.0.0.1:18141; server 127.0.0.1:18159 fail_timeout=2s; }
    upstream single   { server 127.0.0.1:18159; }
    upstream alldead  { server 127.0.0.1:18158; server 127.0.0.1:18159; }
    upstream withbak  { server 127.0.0.1:18158; server 127.0.0.1:18159; server 127.0.0.1:18146 backup; }
    upstream withdown { server 127.0.0.1:18141; server 127.0.0.1:18142 down; }
    upstream flaky    { server 127.0.0.1:18141; server 127.0.0.1:18142; }
    upstream flaky2   { server 127.0.0.1:18141; server 127.0.0.1:18142; }
    upstream flaky3   { server 127.0.0.1:18141; server 127.0.0.1:18142; }
    upstream ch3 { hash $arg_k consistent; server 127.0.0.1:18141; server 127.0.0.1:18142; server 127.0.0.1:18143; }
    upstream ch2 { hash $arg_k consistent; server 127.0.0.1:18141; server 127.0.0.1:18142; }
    upstream ph3 { hash $arg_k; server 127.0.0.1:18141; server 127.0.0.1:18142; server 127.0.0.1:18143; }
    upstream ph2 { hash $arg_k; server 127.0.0.1:18141; server 127.0.0.1:18142; }
    upstream iph { ip_hash; server 127.0.0.1:18141; server 127.0.0.1:18142; server 127.0.0.1:18143; }
    upstream lc  { least_conn; server 127.0.0.1:18141; server 127.0.0.1:18144; }
    upstream rr2 { server 127.0.0.1:18141; server 127.0.0.1:18144; }
    upstream lt  { least_time last_byte; server 127.0.0.1:18141; server 127.0.0.1:18144; }
    upstream rr3 { server 127.0.0.1:18141; server 127.0.0.1:18144; }
    upstream st  { sticky cookie srv; server 127.0.0.1:18141; server 127.0.0.1:18142; server 127.0.0.1:18143; }
    upstream str { sticky cookie srv; server 127.0.0.1:18141 route=a; server 127.0.0.1:18142 route=b; }

    server {
        listen 127.0.0.1:18140;

        location /rr/       { proxy_pass http://rr/; }
        location /onedead/  { proxy_pass http://onedead/; }
        location /single/   { proxy_pass http://single/; }
        location /alldead/  { proxy_pass http://alldead/; }
        location /withbak/  { proxy_pass http://withbak/; }
        location /withdown/ { proxy_pass http://withdown/; }
        location /flaky/    { proxy_pass http://flaky/flaky; }
        location /flaky2/   { proxy_pass http://flaky2/flaky; proxy_next_upstream error timeout http_500; }
        location /flaky3/   { proxy_pass http://flaky3/flaky; proxy_next_upstream error timeout http_500; }
        location /ch3/ { proxy_pass http://ch3/; }
        location /ch2/ { proxy_pass http://ch2/; }
        location /ph3/ { proxy_pass http://ph3/; }
        location /ph2/ { proxy_pass http://ph2/; }
        location /iph/ { proxy_pass http://iph/; }
        location /lc/  { proxy_pass http://lc/; }
        location /rr2/ { proxy_pass http://rr2/; }
        location /lt/  { proxy_pass http://lt/; }
        location /rr3/ { proxy_pass http://rr3/; }
        location /st/  { proxy_pass http://st/; }
        location /str/ { proxy_pass http://str/; }
    }
}
