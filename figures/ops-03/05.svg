<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, Helvetica, Arial, sans-serif" viewBox="0 0 1200 420" width="1200" height="420">
<rect x="0" y="0" width="1200" height="420" rx="16" fill="#FAFBFD" stroke="#DEE0E3" stroke-width="1" data-role="frame"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">二进制升级的回滚窗口：WINCH 后、QUIT 前用 HUP 恢复老 worker</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">从左到右是升级路径；WINCH 之后可反向回滚到重启老 worker</text>
<text x="144" y="165.8" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">初始</text>
<text x="448" y="165.8" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">USR2</text>
<text x="752" y="165.8" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">WINCH</text>
<text x="1056" y="165.8" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">QUIT</text>
<polyline points="252,224.3 330,224.3" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="330,218.3 340,224.3 330,230.3" fill="#8F959E"/>
<polyline points="556,224.3 634,224.3" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="634,218.3 644,224.3 634,230.3" fill="#8F959E"/>
<polyline points="860,224.3 938,224.3" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="938,218.3 948,224.3 938,230.3" fill="#8F959E"/>
<polyline points="714.6,271.8 714.6,293.8 485.4,293.8 485.4,281.8" fill="none" stroke="#8F959E" stroke-width="2" stroke-dasharray="6 4"/>
<polygon points="479.4,281.8 485.4,271.8 491.4,281.8" fill="#8F959E"/>
<rect x="40" y="180.8" width="208" height="87" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="144" y="208.7" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">老 master + 老</text>
<text x="144" y="230.7" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">worker</text>
<text x="144" y="250.5" font-size="12" fill="#646A73" text-anchor="middle">运行中</text>
<rect x="344" y="180.8" width="208" height="87" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="448" y="208.7" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">两套 master 和</text>
<text x="448" y="230.7" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">worker</text>
<text x="448" y="250.5" font-size="12" fill="#646A73" text-anchor="middle">共享监听 socket</text>
<rect x="648" y="180.8" width="208" height="87" rx="8" fill="#FFF5EB" stroke="#FFBA6B" stroke-width="1.5" data-role="node"/>
<text x="752" y="208.7" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">老 master 无</text>
<text x="752" y="230.7" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">worker + 新 master</text>
<text x="752" y="250.5" font-size="12" fill="#646A73" text-anchor="middle">回滚窗口</text>
<rect x="952" y="180.8" width="208" height="87" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="1056" y="208.7" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">只剩新 master + 新</text>
<text x="1056" y="230.7" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">worker</text>
<text x="1056" y="250.5" font-size="12" fill="#646A73" text-anchor="middle">升级完成</text>
<text x="291" y="215.3" font-size="12" fill="#646A73" text-anchor="middle">USR2</text>
<text x="595" y="215.3" font-size="12" fill="#646A73" text-anchor="middle">WINCH</text>
<text x="899" y="215.3" font-size="12" fill="#646A73" text-anchor="middle">QUIT</text>
<text x="600" y="284.8" font-size="12" fill="#646A73" text-anchor="middle">HUP（回滚）</text>
<text x="40" y="396" font-size="12" fill="#646A73" data-role="source">来源：nginx 源码、labs/ops-03 实验</text>
</svg>
