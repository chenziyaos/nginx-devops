# dev-09: the upstream machinery. One worker, so every request sees the same balancer state
# and the same connection cache. 19181-19183 are backends in the same nginx; 19198 has no
# listener. Only the front server (19180) logs at debug level, into logs/front.log.
worker_processes 1;
error_log logs/error.log warn;

events { worker_connections 256; }

http {
    log_format be '$server_port c=$connection_requests $request_uri';
    log_format fe '$request_uri $status ups=$upstream_addr st=$upstream_status';

    # backends: the body is the port; /close/ answers with "Connection: close"
    server {
        listen 127.0.0.1:19181;
        listen 127.0.0.1:19182;
        listen 127.0.0.1:19183;
        access_log logs/backend.log be;
        root out/run/files;

        location / { return 200 "$server_port\n"; }
        location /close/ { keepalive_timeout 0; return 200 "$server_port\n"; }
        location = /big.bin { }
        location = /xab.bin { add_header X-Accel-Buffering no; }
    }

    upstream one     { server 127.0.0.1:19181; }
    upstream shared  { server 127.0.0.1:19181; keepalive 16; }
    upstream nokeep  { server 127.0.0.1:19181; keepalive 0; }
    upstream reqs    { server 127.0.0.1:19182; keepalive 16; keepalive_requests 2; }
    upstream loc     { server 127.0.0.1:19181; }
    upstream cls     { server 127.0.0.1:19182; }
    upstream dead    { server 127.0.0.1:19198; server 127.0.0.1:19181; }
    upstream stk     { least_conn; sticky cookie srv; server 127.0.0.1:19181; server 127.0.0.1:19182; }
    upstream stk_bad { sticky cookie srv; least_conn; server 127.0.0.1:19181; server 127.0.0.1:19182; }

    server {
        listen 127.0.0.1:19180;
        error_log logs/front.log debug;
        access_log logs/access.log fe;

        location /one/     { proxy_pass http://one/; }
        location /shared/  { proxy_pass http://shared/; }
        location /shared2/ { proxy_pass http://shared/; }
        location /direct/  { proxy_pass http://127.0.0.1:19181/; }
        location /nokeep/  { proxy_pass http://nokeep/; }
        location /reqs/    { proxy_pass http://reqs/; }
        location /loc1/    { proxy_pass http://loc/; }
        location /loc2/    { proxy_pass http://loc/; }
        location /close/   { proxy_pass http://cls; }
        location /dead/    { proxy_pass http://dead/; }
        location /stk/     { proxy_pass http://stk/; }
        location /stkbad/  { proxy_pass http://stk_bad/; }

        location /buf/     { proxy_pass http://one/; proxy_buffers 4 8k; proxy_buffer_size 8k; }
        location /nobuf/   { proxy_pass http://one/; proxy_buffering off; }
        location /xab/     { proxy_pass http://one/; proxy_buffers 4 8k; proxy_buffer_size 8k; }
    }
}
