<text x="752" y="189.9" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">合法 JSON</text>
<text x="752" y="209.7" font-size="12" fill="#646A73" text-anchor="middle">$tenant = t-42；</text>
<text x="752" y="228.7" font-size="12" fill="#646A73" text-anchor="middle">$first_item = a1</text>
