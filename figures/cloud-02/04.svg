<polyline points="1020,460 472,460" fill="none" stroke="#8F959E" stroke-width="2" stroke-dasharray="6 4"/>
<polygon points="472,454 462,460 472,466" fill="#8F959E"/>
<text x="450" y="492.6" font-size="13" fill="#1F2329" text-anchor="end">200，$upstream_addr 记两个地址</text>
<polyline points="460,501 192,501" fill="none" stroke="#8F959E" stroke-width="2" stroke-dasharray="6 4"/>
<polygon points="192,495 182,501 192,507" fill="#8F959E"/>
<text x="40" y="555" font-size="12" fill="#646A73" data-role="source">来源：labs/cloud-02 实验输出；ngx_http_upstream.c（1.31.10）</text>
