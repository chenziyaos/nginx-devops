# conf/nginx.conf, but the C module comes from another file: nocurl-451.so, the same
# module built to answer 451 instead of 403.
load_module /usr/lib/nginx/modules/ngx_http_js_module.so;
load_module /usr/lib/nginx/modules/ngx_http_curl_module.so;
load_module /usr/lib/nginx/modules/nocurl-451.so;

error_log stderr notice;

events {}

http {
    access_log off;

    js_engine qjs;
    js_import nocurl from /etc/nginx/conf/nocurl.js;
    js_import buggy from /etc/nginx/conf/throw.js;

    server {
        listen 80;

        location /js {
            js_access nocurl.check;
            proxy_pass http://127.0.0.1:8081;
        }

        location /rust {
            curl on;
            proxy_pass http://127.0.0.1:8081;
        }

        location /c {
            nocurl on;
            proxy_pass http://127.0.0.1:8081;
        }

        location /buggy {
            js_access buggy.check;
            proxy_pass http://127.0.0.1:8081;
        }
    }

    # the backend: a request that got through the access phase ends here
    server {
        listen 127.0.0.1:8081;
        return 200 "passed\n";
    }
}
