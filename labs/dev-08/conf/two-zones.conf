worker_processes 1;
error_log logs/error.log debug;

events {
    worker_connections 64;
}

http {
    log_format v '$status $limit_req_status $arg_k';
    access_log logs/access.log v;

    limit_req_zone $binary_remote_addr zone=wide:1m rate=1r/m;
    limit_req_zone $binary_remote_addr zone=narrow:1m rate=1r/m;

    server {
        listen 127.0.0.1:19160;

        # wide is checked first, narrow last
        location /both {
            limit_req zone=wide burst=10 nodelay;
            limit_req zone=narrow;
            root html;
        }

        location /wide {
            limit_req zone=wide burst=10 nodelay;
            root html;
        }
    }
}
