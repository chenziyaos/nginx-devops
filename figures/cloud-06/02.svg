<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">reload 沿用同一块共享内存，容器重启换一块新的</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">stub_status 的 7 个计数器和 accept 锁在同一块共享内存里，由 master 分配；高亮一行是计数器归零的时刻</text>
<rect x="40" y="168" width="1120" height="128" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1" data-role="table"/>
<rect x="41" y="169" width="1118" height="43" rx="11" fill="#F5F6F7"/>
