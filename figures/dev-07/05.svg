<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, Helvetica, Arial, sans-serif" viewBox="0 0 1200 630" width="1200" height="630">
<rect x="0" y="0" width="1200" height="630" rx="16" fill="#FAFBFD" stroke="#DEE0E3" stroke-width="1" data-role="frame"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">last 重新匹配 location，break 留在原地，redirect 返回 302</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">从上到下是四条路径；蓝色是 rewrite 匹配成功后的行为</text>
