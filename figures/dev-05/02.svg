<text x="236.7" y="202.6" font-size="13" fill="#1F2329">kill -HUP</text>
<polyline points="226.7,211 588,211" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="588,205 598,211 588,217" fill="#8F959E"/>
<text x="610" y="243.6" font-size="13" fill="#1F2329">ngx_reconfigure = 1</text>
<polyline points="600,252 626,252 626,270 614,270" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="614,264 604,270 614,276" fill="#8F959E"/>
