<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, Helvetica, Arial, sans-serif" viewBox="0 0 1200 536" width="1200" height="536">
<rect x="0" y="0" width="1200" height="536" rx="16" fill="#FAFBFD" stroke="#DEE0E3" stroke-width="1" data-role="frame"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">指标、日志、追踪在 Pod 里各经过一个中间人</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">从左到右是数据从 nginx 出发到被人看到的路径；每条线中间那一站都会改变数据：exporter 把自己的抓取算进请求数，containerd 切长行，nginx-otel 改写</text>
<text x="40" y="114" font-size="14" fill="#646A73" data-role="subtitle">traceparent</text>
<text x="180" y="165" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">nginx 产出</text>
<text x="600" y="165" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">中间人</text>
<text x="1020" y="165" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">看到它</text>
<polyline points="294,222 476,222" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="476,216 486,222 476,228" fill="#8F959E"/>
<polyline points="294,326 476,326" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="476,320 486,326 476,332" fill="#8F959E"/>
<polyline points="294,430 476,430" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="476,424 486,430 476,436" fill="#8F959E"/>
<polyline points="714,222 896,222" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="896,216 906,222 896,228" fill="#8F959E"/>
<polyline points="714,326 896,326" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="896,320 906,326 896,332" fill="#8F959E"/>
<polyline points="714,430 896,430" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="896,424 906,430 896,436" fill="#8F959E"/>
<rect x="70" y="180" width="220" height="84" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="180" y="217.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">stub_status</text>
<text x="180" y="237.2" font-size="12" fill="#646A73" text-anchor="middle">127.0.0.1:8080</text>
<rect x="70" y="284" width="220" height="84" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="180" y="321.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">access log</text>
<text x="180" y="341.2" font-size="12" fill="#646A73" text-anchor="middle">escape=json 写 stdout</text>
<rect x="70" y="388" width="220" height="84" rx="8" fill="#F0F4FF" stroke="#82A7FC" stroke-width="1.5" data-role="node"/>
<text x="180" y="425.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">nginx-otel</text>
<text x="180" y="445.2" font-size="12" fill="#646A73" text-anchor="middle">span 经 OTLP 发给 Collector</text>
<rect x="490" y="180" width="220" height="84" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="600" y="217.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">exporter</text>
<text x="600" y="237.2" font-size="12" fill="#646A73" text-anchor="middle">sidecar，抓一次读一次</text>
<rect x="490" y="284" width="220" height="84" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="600" y="321.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">containerd</text>
<text x="600" y="341.2" font-size="12" fill="#646A73" text-anchor="middle">超过 16384 字节切成 P + F</text>
<rect x="490" y="388" width="220" height="84" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="600" y="425.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">traceparent</text>
<text x="600" y="445.2" font-size="12" fill="#646A73" text-anchor="middle">父 span 换成 nginx</text>
<rect x="910" y="180" width="220" height="84" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="1020" y="207.9" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">Prometheus</text>
<text x="1020" y="227.7" font-size="12" fill="#646A73" text-anchor="middle">3 个计数器、4 个 gauge、</text>
<text x="1020" y="246.7" font-size="12" fill="#646A73" text-anchor="middle">nginx_up</text>
<rect x="910" y="284" width="220" height="84" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="1020" y="321.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">kubectl logs</text>
<text x="1020" y="341.2" font-size="12" fill="#646A73" text-anchor="middle">按 P/F 拼回一行</text>
<rect x="910" y="388" width="220" height="84" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="1020" y="425.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">后端</text>
<text x="1020" y="445.2" font-size="12" fill="#646A73" text-anchor="middle">span 挂在 nginx 下面</text>
<text x="40" y="512" font-size="12" fill="#646A73" data-role="source">来源：labs/cloud-06 实验输出；nginx-prometheus-exporter v1.5.3、nginx-otel v0.1.2 源码</text>
