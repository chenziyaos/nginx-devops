<text x="779.5" y="178.2" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">Rust（ngx-rust）</text>
<text x="1049.9" y="178.2" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">C</text>
