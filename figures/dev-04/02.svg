<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">同名指令靠所在块唯一确定接收模块</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">每行是 server 出现在一种块里的情况；上下文位不同，指令表里匹配到的模块就不同</text>
