<text x="40" y="58" font-size="27" fill="#1F2329" font-weight="bold" data-role="title">ConfigMap 的更新经过 kubelet、sidecar、control API 才进入 nginx</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">从 kubectl apply 到 nginx 用上新配置；红色一段是最长的等待，间隔来自 kubelet 的同步周期</text>
