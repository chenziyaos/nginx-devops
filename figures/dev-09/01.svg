<text x="60" y="338.3" font-size="18" fill="#646A73" font-weight="bold">keepalive 层</text>
<rect x="271.9" y="312" width="872.1" height="40" rx="8" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="1" data-role="layer-chip"/>
