# ops-03: one worker per CPU, plus the cache manager and loader that proxy_cache_path brings
worker_processes auto;
error_log logs/error.log info;

events { worker_connections 64; }

http {
    proxy_cache_path cache keys_zone=c:1m;

    server {
        listen 127.0.0.1:18061;
        return 200 "ok\n";
    }
}
