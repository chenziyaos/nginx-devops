<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, Helvetica, Arial, sans-serif" viewBox="0 0 1200 514" width="1200" height="514">
<rect x="0" y="0" width="1200" height="514" rx="16" fill="#FAFBFD" stroke="#DEE0E3" stroke-width="1" data-role="frame"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">只有自己的、已发完的、排在最前面的缓冲才会被回收</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">从左到右是处理前后；绿色是被回收的，红色是保留在 busy 里的</text>
<text x="180" y="143" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">整理前</text>
<text x="600" y="143" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">处理</text>
<text x="1020" y="143" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">整理后</text>
<polyline points="294,304 476,304" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="476,298 486,304 476,310" fill="#8F959E"/>
<polyline points="714,304 807,304 807,200 896,200" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="896,194 906,200 896,206" fill="#8F959E"/>
<polyline points="714,304 896,304" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="896,298 906,304 896,310" fill="#8F959E"/>
<polyline points="714,304 807,304 807,408 896,408" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="896,402 906,408 896,414" fill="#8F959E"/>
<rect x="70" y="262" width="220" height="84" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="180" y="289.9" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">out 链</text>
<text x="180" y="309.7" font-size="12" fill="#646A73" text-anchor="middle">d(他人) → a(空)</text>
<text x="180" y="328.7" font-size="12" fill="#646A73" text-anchor="middle">b(剩 3B) → c(空)</text>
<rect x="490" y="262" width="220" height="84" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="600" y="308.9" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">扫描 out</text>
<rect x="910" y="158" width="220" height="84" rx="8" fill="#F0FBEF" stroke="#8EE085" stroke-width="1.5" data-role="node"/>
<text x="1020" y="195.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">free 链</text>
<text x="1020" y="215.2" font-size="12" fill="#646A73" text-anchor="middle">a（重置）</text>
<rect x="910" y="262" width="220" height="84" rx="8" fill="#FEF1F1" stroke="#F98E8B" stroke-width="1.5" data-role="node"/>
<text x="1020" y="289.9" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">busy 链</text>
<text x="1020" y="309.7" font-size="12" fill="#646A73" text-anchor="middle">b(剩 3B)</text>
<text x="1020" y="328.7" font-size="12" fill="#646A73" text-anchor="middle">c(空）→ 仍待处理</text>
<rect x="910" y="366" width="220" height="84" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="1020" y="393.9" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">pool-＞chain</text>
<text x="1020" y="413.7" font-size="12" fill="#646A73" text-anchor="middle">d 的节点</text>
<text x="1020" y="432.7" font-size="12" fill="#646A73" text-anchor="middle">（非自己的）</text>
<text x="40" y="490" font-size="12" fill="#646A73" data-role="source">来源：本文整理（实验值）</text>
</svg>
