<text x="1086.4" y="485.2" font-size="12" fill="#646A73" text-anchor="middle">状态 STALE</text>
<rect x="1012.8" y="560.5" width="147.2" height="141" rx="8" fill="#FEF1F1" stroke="#F98E8B" stroke-width="1.5" data-role="node"/>
<text x="1086.4" y="626.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">交给客户端</text>
<text x="1086.4" y="646.2" font-size="12" fill="#646A73" text-anchor="middle">把错误原样返回</text>
<text x="356.8" y="638" font-size="12" fill="#646A73" text-anchor="middle">能</text>
<text x="716.6" y="541.5" font-size="12" fill="#646A73" text-anchor="middle">不能</text>
<text x="969.8" y="514.2" font-size="12" fill="#646A73">是</text>
