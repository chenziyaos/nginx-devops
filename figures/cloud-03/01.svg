<rect x="40" y="158" width="208" height="84" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="144" y="195.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">Ingress</text>
<text x="144" y="215.2" font-size="12" fill="#646A73" text-anchor="middle">host、path、后端</text>
<rect x="40" y="262" width="208" height="84" rx="8" fill="#FEF1F1" stroke="#F98E8B" stroke-width="1.5" data-role="node"/>
<text x="144" y="299.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">注解</text>
<text x="144" y="319.2" font-size="12" fill="#646A73" text-anchor="middle">nginx.ingress.kubernetes.io/*</text>
<rect x="40" y="366" width="208" height="84" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="144" y="393.9" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">HTTPRoute</text>
<text x="144" y="413.7" font-size="12" fill="#646A73" text-anchor="middle">matches、backendRefs、</text>
<text x="144" y="432.7" font-size="12" fill="#646A73" text-anchor="middle">filters</text>
<rect x="344" y="210" width="208" height="84" rx="8" fill="#FEF1F1" stroke="#F98E8B" stroke-width="1.5" data-role="node"/>
