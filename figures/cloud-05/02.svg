<rect x="0" y="0" width="1200" height="420" rx="16" fill="#FAFBFD" stroke="#DEE0E3" stroke-width="1" data-role="frame"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">nginx-acme 在 0 号 worker 里续期，所有 worker 下一次握手就用上</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">实验里证书有效期 119 秒，序列号从 S1 换成 S2，worker 进程没有变，没有 SIGHUP</text>
<rect x="40" y="152" width="179.2" height="168" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="step"/>
<text x="60" y="190.1" font-size="16" fill="#1F2329" font-weight="bold">0 号 worker</text>
<text x="60" y="215.1" font-size="16" fill="#1F2329" font-weight="bold">定时检查</text>
<text x="60" y="243.9" font-size="14" fill="#646A73">两次检查至少隔</text>
<text x="60" y="265.9" font-size="14" fill="#646A73">30 秒</text>
<rect x="275.2" y="152" width="179.2" height="168" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="step"/>
<text x="295.2" y="192.3" font-size="18" fill="#1F2329" font-weight="bold">下单、应答、</text>
<text x="295.2" y="220.3" font-size="18" fill="#1F2329" font-weight="bold">取证书</text>
<text x="295.2" y="249.9" font-size="14" fill="#646A73">和首次申请相同</text>
<text x="295.2" y="271.9" font-size="14" fill="#646A73">授权可复用时不走</text>
<text x="295.2" y="293.9" font-size="14" fill="#646A73">挑战</text>
<rect x="510.4" y="152" width="179.2" height="168" rx="12" fill="#F0FBEF" stroke="#8EE085" stroke-width="1.5" data-role="step"/>
<text x="530.4" y="192.3" font-size="18" fill="#1F2329" font-weight="bold">共享内存就地</text>
<text x="530.4" y="220.3" font-size="18" fill="#1F2329" font-weight="bold">替换</text>
<text x="530.4" y="249.9" font-size="14" fill="#646A73">证书链和私钥</text>
<text x="530.4" y="271.9" font-size="14" fill="#646A73">加 data: 前缀</text>
<rect x="745.6" y="152" width="179.2" height="168" rx="12" fill="#F0FBEF" stroke="#8EE085" stroke-width="1.5" data-role="step"/>
<text x="765.6" y="192.3" font-size="18" fill="#1F2329" font-weight="bold">下一次握手</text>
<text x="765.6" y="221.9" font-size="14" fill="#646A73">任意 worker 求</text>
<text x="765.6" y="243.9" font-size="14" fill="#646A73">$acme_certificate</text>
<rect x="980.8" y="152" width="179.2" height="168" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="step"/>
<text x="1000.8" y="192.3" font-size="18" fill="#1F2329" font-weight="bold">缓存换键</text>
<text x="1000.8" y="221.9" font-size="14" fill="#646A73">内容就是键</text>
<text x="1000.8" y="243.9" font-size="14" fill="#646A73">旧条目等着被挤出</text>
