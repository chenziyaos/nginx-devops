# ops-09: burst=5 delay=2: the first 3 at once, the rest are paced
events { worker_connections 128; }

http {
    error_log  logs/error.log info;
    log_format lab '$status $limit_req_status';
    access_log logs/access.log lab;

    limit_req_zone $binary_remote_addr zone=perip:1m rate=1r/s;

    server {
        listen 127.0.0.1:18180;
        root   html;

        location / {
            limit_req zone=perip burst=5 delay=2;
        }
    }
}
