<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, Helvetica, Arial, sans-serif" viewBox="0 0 1200 420" width="1200" height="420">
<rect x="0" y="0" width="1200" height="420" rx="16" fill="#FAFBFD" stroke="#DEE0E3" stroke-width="1" data-role="frame"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">每个请求通过三步算出去哪台后端：加权、比较、扣减</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">从左到右是算法的三个步骤；最后每 7 个请求循环一次 A 5 次、B 和 C 各 1 次</text>
<rect x="40" y="172" width="238" height="118" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="step"/>
<text x="60" y="212.3" font-size="18" fill="#1F2329" font-weight="bold">所有可用后端</text>
<text x="60" y="241.9" font-size="14" fill="#646A73">current_weight +=</text>
<text x="60" y="263.9" font-size="14" fill="#646A73">effective_weight</text>
<rect x="334" y="172" width="238" height="118" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="step"/>
<text x="354" y="212.3" font-size="18" fill="#1F2329" font-weight="bold">比较</text>
<text x="354" y="241.9" font-size="14" fill="#646A73">选 current_weight 最大的</text>
<text x="354" y="263.9" font-size="14" fill="#646A73">并列取先出现的</text>
<rect x="628" y="172" width="238" height="118" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="step"/>
<text x="648" y="212.3" font-size="18" fill="#1F2329" font-weight="bold">扣减</text>
<text x="648" y="241.9" font-size="14" fill="#646A73">选中者：current_weight</text>
<text x="648" y="263.9" font-size="14" fill="#646A73">-= 总权重（例：7）</text>
<rect x="922" y="172" width="238" height="118" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="step"/>
<text x="942" y="212.3" font-size="18" fill="#1F2329" font-weight="bold">结果</text>
<text x="942" y="241.9" font-size="14" fill="#646A73">A A B A C A A</text>
<text x="942" y="263.9" font-size="14" fill="#646A73">每 7 个请求一轮</text>
<polyline points="284,231 318,231" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="318,225 328,231 318,237" fill="#8F959E"/>
<polyline points="578,231 612,231" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="612,225 622,231 612,237" fill="#8F959E"/>
<polyline points="872,231 906,231" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="906,225 916,231 906,237" fill="#8F959E"/>
<text x="40" y="396" font-size="12" fill="#646A73" data-role="source">来源：ngx_http_upstream_round_robin.c、labs/ops-07 实验（1.31.9）</text>
</svg>
