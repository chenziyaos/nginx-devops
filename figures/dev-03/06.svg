<text x="752" y="351.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">没有半满页</text>
<text x="752" y="371.2" font-size="12" fill="#646A73" text-anchor="middle">拿一张新页，初始化位图</text>
