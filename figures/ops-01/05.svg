<text x="226.7" y="153" font-size="14" fill="#245BDB" font-weight="bold" text-anchor="middle">nginx -s reload</text>
<line x1="600" y1="168" x2="600" y2="441" stroke="#C9CDD4" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="500" y="128" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="actor"/>
<text x="600" y="153" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">logs/nginx.pid</text>
<line x1="973.3" y1="168" x2="973.3" y2="441" stroke="#C9CDD4" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="873.3" y="128" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="actor"/>
<text x="973.3" y="153" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">master</text>
<text x="236.7" y="202.6" font-size="13" fill="#1F2329">解析配置得 pid 路径</text>
