<text x="113.6" y="383.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">EXPIRED，</text>
<text x="113.6" y="405.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">回源</text>
<rect x="283.2" y="158" width="147.2" height="141" rx="8" fill="#F0FBEF" stroke="#8EE085" stroke-width="1.5" data-role="node"/>
<text x="356.8" y="223.9" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">正常</text>
<text x="356.8" y="243.7" font-size="12" fill="#646A73" text-anchor="middle">新内容，重写缓存</text>
<rect x="283.2" y="319" width="147.2" height="141" rx="8" fill="#F0FBEF" stroke="#8EE085" stroke-width="1.5" data-role="node"/>
<text x="356.8" y="375.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">304</text>
<text x="356.8" y="395.2" font-size="12" fill="#646A73" text-anchor="middle">只更新有效期，状态</text>
<text x="356.8" y="414.2" font-size="12" fill="#646A73" text-anchor="middle">REVALIDATED</text>
<rect x="283.2" y="480" width="147.2" height="141" rx="8" fill="#FEF1F1" stroke="#F98E8B" stroke-width="1.5" data-role="node"/>
