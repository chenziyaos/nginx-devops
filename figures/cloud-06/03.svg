<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, Helvetica, Arial, sans-serif" viewBox="0 0 1200 420" width="1200" height="420">
<rect x="0" y="0" width="1200" height="420" rx="16" fill="#FAFBFD" stroke="#DEE0E3" stroke-width="1" data-role="frame"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">containerd 按 16 KiB 切行，kubectl logs 再按 P/F 拼回</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">一个 User-Agent 为 20000 字节的请求写出的那一行日志，从左到右经过的各站</text>
<rect x="40" y="172" width="238" height="118" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="step"/>
<text x="60" y="212.3" font-size="18" fill="#1F2329" font-weight="bold">nginx 写一行</text>
<text x="60" y="241.9" font-size="14" fill="#646A73">escape=json</text>
<text x="60" y="263.9" font-size="14" fill="#646A73">完整的一行 JSON</text>
<rect x="334" y="172" width="238" height="118" rx="12" fill="#FEF1F1" stroke="#F98E8B" stroke-width="1.5" data-role="step"/>
<text x="354" y="212.3" font-size="18" fill="#1F2329" font-weight="bold">containerd 切开</text>
<text x="354" y="241.9" font-size="14" fill="#646A73">每条记录最多</text>
<text x="354" y="263.9" font-size="14" fill="#646A73">16384 字节</text>
<rect x="628" y="172" width="238" height="118" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="step"/>
<text x="648" y="212.3" font-size="18" fill="#1F2329" font-weight="bold">节点上两条记录</text>
<text x="648" y="241.9" font-size="14" fill="#646A73">stdout P 16384</text>
<text x="648" y="263.9" font-size="14" fill="#646A73">stdout F 3789</text>
<rect x="922" y="172" width="238" height="118" rx="12" fill="#F0FBEF" stroke="#8EE085" stroke-width="1.5" data-role="step"/>
<text x="942" y="212.3" font-size="18" fill="#1F2329" font-weight="bold">kubelet 拼回</text>
<text x="942" y="241.9" font-size="14" fill="#646A73">kubectl logs 1 行</text>
<text x="942" y="263.9" font-size="14" fill="#646A73">20174 字节，合法 JSON</text>
<polyline points="284,231 318,231" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="318,225 328,231 318,237" fill="#8F959E"/>
<polyline points="578,231 612,231" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="612,225 622,231 612,237" fill="#8F959E"/>
<polyline points="872,231 906,231" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="906,225 916,231 906,237" fill="#8F959E"/>
<text x="40" y="396" font-size="12" fill="#646A73" data-role="source">来源：labs/cloud-06 实验输出</text>
</svg>
