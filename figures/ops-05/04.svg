<polyline points="600,419 238.7,419" fill="none" stroke="#8F959E" stroke-width="2" stroke-dasharray="6 4"/>
<polygon points="238.7,413 228.7,419 238.7,425" fill="#8F959E"/>
<rect x="40" y="435" width="289.8" height="24" rx="12" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1" data-role="pill"/>
<text x="184.9" y="451.2" font-size="12" fill="#646A73" text-anchor="middle" data-role="pill">open_file_cache_valid（默认 60 秒）开始计时</text>
