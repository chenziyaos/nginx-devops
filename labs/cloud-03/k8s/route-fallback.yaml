# The route of route.yaml with the / rule also matching PathPrefix /api, so a request to /api
# without the header has a rule registered under /api to fall back to.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shop
spec:
  parentRefs:
    - name: gw
  rules:
    - matches:
        - path: {type: PathPrefix, value: /api}
          headers:
            - {name: x-env, value: canary}
      backendRefs:
        - {name: v2, port: 80}
    # the / rule, also registered under /api
    - matches:
        - path: {type: PathPrefix, value: /api}
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - {name: v1, port: 80, weight: 80}
        - {name: v2, port: 80, weight: 20}
    - matches:
        - path: {type: PathPrefix, value: /missing}
      backendRefs:
        - {name: nosuch, port: 80}
