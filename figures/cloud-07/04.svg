<polygon points="728,332 738,338 728,344" fill="#8F959E"/>
<text x="730" y="370.6" font-size="13" fill="#1F2329" text-anchor="end">ngx_http_nocurl_module 解析到这里</text>
<polyline points="740,379 472,379" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="472,373 462,379 472,385" fill="#8F959E"/>
<text x="190" y="411.6" font-size="13" fill="#1F2329">旧 cycle 销毁，dlclose；仍被引用，不</text>
<text x="190" y="431.6" font-size="13" fill="#1F2329">卸载</text>
<polyline points="180,440 448,440" fill="none" stroke="#8F959E" stroke-width="2"/>
