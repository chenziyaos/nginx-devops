worker_processes 1;
error_log logs/error.log debug;

events {
    worker_connections 64;
}

http {
    log_format v '$status $limit_req_status $arg_k';
    access_log logs/access.log v;

    limit_req_zone $binary_remote_addr zone=one:1m rate=1r/m;

    # request start = $msec - $request_time, to compare the drained excess with the elapsed time
    log_format t '$msec $request_time $status';

    server {
        listen 127.0.0.1:19160;

        location / {
            limit_req zone=one burst=5 nodelay;
            root html;
            access_log logs/access.log v;
            access_log logs/msec.log t;
        }
    }
}
