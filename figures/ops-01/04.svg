<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">nginx -t 创建 *_temp 目录和空 pid 文件，像真正启动一样走初始化</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">从上到下是执行顺序；蓝色圆圈是关键副作用</text>
