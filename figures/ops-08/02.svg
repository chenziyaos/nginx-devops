<text x="1056" y="293.9" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">alert 112</text>
<text x="1056" y="313.7" font-size="12" fill="#646A73" text-anchor="middle">unrecognized_name，握手</text>
