<polygon points="938,558.5 948,564.5 938,570.5" fill="#8F959E"/>
<polyline points="448,309.5 448,325.5" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="442,325.5 448,335.5 454,325.5" fill="#8F959E"/>
<rect x="40" y="218.5" width="208" height="87" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="144" y="257.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">ngx_get_options</text>
<text x="144" y="277.2" font-size="12" fill="#646A73" text-anchor="middle">-p -c -g -s -t</text>
<rect x="344" y="218.5" width="208" height="87" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="448" y="257.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">ngx_os_init</text>
<text x="448" y="277.2" font-size="12" fill="#646A73" text-anchor="middle">ngx_add_inherited_sockets</text>
<rect x="344" y="339.5" width="208" height="87" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="448" y="368.9" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">preinit</text>
<text x="448" y="388.7" font-size="12" fill="#646A73" text-anchor="middle">ngx_preinit_modules，index</text>
