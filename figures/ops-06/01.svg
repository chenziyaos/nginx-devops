<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, Helvetica, Arial, sans-serif" viewBox="0 0 1200 420" width="1200" height="420">
<rect x="0" y="0" width="1200" height="420" rx="16" fill="#FAFBFD" stroke="#DEE0E3" stroke-width="1" data-role="frame"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">后端收到哪个 URI，先看变量，再看 rewrite，最后看 URI 部分</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">请求进入带 proxy_pass 的 location 后，从上往下第一个成立的条件决定发给后端的 URI</text>
<rect x="40" y="134.4" width="1120" height="212" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1" data-role="table"/>
<rect x="41" y="135.4" width="1118" height="43" rx="11" fill="#F5F6F7"/>
<rect x="41" y="166.4" width="1118" height="12" fill="#F5F6F7"/>
<line x1="40" y1="178.4" x2="1160" y2="178.4" stroke="#DEE0E3" stroke-width="1"/>
<line x1="41" y1="220.4" x2="1159" y2="220.4" stroke="#EFF0F1" stroke-width="1"/>
<line x1="41" y1="262.4" x2="1159" y2="262.4" stroke="#EFF0F1" stroke-width="1"/>
<line x1="41" y1="304.4" x2="1159" y2="304.4" stroke="#EFF0F1" stroke-width="1"/>
<text x="58" y="161.4" font-size="14" fill="#1F2329" font-weight="bold">顺序</text>
<text x="249.9" y="161.4" font-size="14" fill="#1F2329" font-weight="bold">条件</text>
<text x="610.5" y="161.4" font-size="14" fill="#1F2329" font-weight="bold">后端收到的 URI</text>
<text x="58" y="204.3" font-size="14" fill="#1F2329">①</text>
<text x="249.9" y="204.3" font-size="14" fill="#1F2329">proxy_pass 里有变量</text>
<text x="610.5" y="204.3" font-size="14" fill="#1F2329">用变量算出的 URI，不再拼接</text>
<text x="58" y="246.3" font-size="14" fill="#1F2329">②</text>
<text x="249.9" y="246.3" font-size="14" fill="#1F2329">rewrite ... break 改过 URI</text>
<text x="610.5" y="246.3" font-size="14" fill="#1F2329">改写后的完整 URI，忽略 proxy_pass 的 URI 部分</text>
<text x="58" y="288.3" font-size="14" fill="#1F2329">③</text>
<text x="249.9" y="288.3" font-size="14" fill="#1F2329">proxy_pass 不带 URI 部分</text>
<text x="610.5" y="288.3" font-size="14" fill="#D83931" font-weight="bold">客户端原始请求 URI：%2F、双斜杠、.. 都原样</text>
<text x="58" y="330.3" font-size="14" fill="#1F2329">④</text>
<text x="249.9" y="330.3" font-size="14" fill="#1F2329">proxy_pass 带 URI 部分</text>
<text x="610.5" y="330.3" font-size="14" fill="#1F2329">规范化后的 URI 去掉 location 前缀，接在 URI 部分后面</text>
<text x="40" y="396" font-size="12" fill="#646A73" data-role="source">来源：ngx_http_proxy_module.c（1.31.10）</text>
</svg>
