# ops-09: limit_conn counts requests in progress, per client address
events { worker_connections 128; }

http {
    error_log  logs/error.log info;
    log_format lab '$status $limit_conn_status';
    access_log logs/access.log lab;

    limit_conn_zone $binary_remote_addr zone=addr:1m;

    server {
        listen 127.0.0.1:18180;
        listen 127.0.0.1:18181;
        http2  on;
        root   html;

        location / {
            limit_conn      addr 1;
            limit_rate      2k;
            limit_rate_after 0;
        }
    }
}
