# ops-11: logging and monitoring. 18220 front, 18221 backend.
worker_processes 1;
error_log logs/error.log info;

events { worker_connections 64; }

http {
    log_format esc_default '$http_user_agent';
    log_format esc_json escape=json '{"ua":"$http_user_agent"}';
    log_format esc_none escape=none '$http_user_agent';
    log_format sizes '$status $bytes_sent $body_bytes_sent';
    log_format times '$uri rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time';
    log_format tries 'addr=[$upstream_addr] status=[$upstream_status] urt=[$upstream_response_time]';
    log_format plain '$status $uri';
    log_format tenant 'tenant=$tenant first_item=$first_item';

    limit_req_zone $server_port zone=slowhead:1m rate=20r/m;

    json_set $tenant     $http_x_ctx tenant.id;
    json_set $first_item $http_x_ctx items[0];

    map $status $loggable {
        ~^[23]  0;
        default 1;
    }

    upstream tries {
        server 127.0.0.1:18229;    # nothing listens here
        server 127.0.0.1:18221;
    }

    # backend
    server {
        listen 127.0.0.1:18221;
        access_log off;
        root out/run/www;

        # 3000 bytes at 1000 bytes/s: header at once, body over 2 to 3 s (the header counts too)
        location /slowbody { limit_rate 1000; }
        # at 20r/m the second request waits up to 3 s before the header
        # (a file, not "return": return runs in the rewrite phase, before limit_req)
        location /slowhead { limit_req zone=slowhead burst=5; }
        location /         { return 200 "backend\n"; }
    }

    server {
        listen 127.0.0.1:18220;
        root html;
        access_log off;

        location = /esc {
            access_log logs/esc_default.log esc_default;
            access_log logs/esc_json.log esc_json;
            access_log logs/esc_none.log esc_none;
            return 204;
        }
        location = /sizes { access_log logs/sizes.log sizes; }

        location /slow { access_log logs/times.log times; proxy_pass http://127.0.0.1:18221; }

        location = /tries { access_log logs/tries.log tries; proxy_pass http://tries/; }

        location /cond { access_log logs/cond.log plain if=$loggable; }

        location /buf { access_log logs/buf.log plain buffer=32k flush=3s; return 200; }

        location /nf  { access_log logs/access.log plain; }
        location /nf2 { access_log logs/access.log plain; log_not_found off; }

        location = /status { stub_status; }

        location = /json { access_log logs/json.log tenant; return 204; }

        location /rot { access_log logs/access.log plain; return 200; }
    }
}
