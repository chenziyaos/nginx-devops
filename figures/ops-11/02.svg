<rect x="756" y="129" width="11" height="11" fill="#F0FBEF"/>
<rect x="756" y="370" width="11" height="11" fill="#F0FBEF"/>
<rect x="756" y="129" width="403" height="43" rx="11" fill="#E4FAE1"/>
<rect x="756" y="129" width="11" height="11" fill="#E4FAE1"/>
<rect x="756" y="161" width="11" height="11" fill="#E4FAE1"/>
<rect x="1148" y="161" width="11" height="11" fill="#E4FAE1"/>
<line x1="40" y1="172" x2="1160" y2="172" stroke="#DEE0E3" stroke-width="1"/>
<line x1="41" y1="214" x2="1159" y2="214" stroke="#EFF0F1" stroke-width="1"/>
<line x1="41" y1="256" x2="1159" y2="256" stroke="#EFF0F1" stroke-width="1"/>
<line x1="41" y1="298" x2="1159" y2="298" stroke="#EFF0F1" stroke-width="1"/>
<line x1="41" y1="340" x2="1159" y2="340" stroke="#EFF0F1" stroke-width="1"/>
<line x1="756" y1="129" x2="756" y2="381" stroke="#8EE085" stroke-width="1"/>
<rect x="40" y="128" width="1120" height="254" rx="12" fill="none" stroke="#DEE0E3" stroke-width="1"/>
<text x="58" y="155" font-size="14" fill="#1F2329" font-weight="bold">字节</text>
<text x="466.8" y="155" font-size="14" fill="#1F2329" font-weight="bold">默认转义</text>
<text x="774" y="155" font-size="14" fill="#2EA121" font-weight="bold">escape=json</text>
<text x="58" y="197.9" font-size="14" fill="#1F2329">0x00–0x1F 控制字符</text>
<text x="466.8" y="197.9" font-size="14" fill="#1F2329">\xHH</text>
<text x="774" y="197.9" font-size="14" fill="#2EA121" font-weight="bold">\n \t 或 \u00XX</text>
<text x="58" y="239.9" font-size="14" fill="#1F2329">双引号、反斜杠</text>
<text x="466.8" y="239.9" font-size="14" fill="#1F2329">\xHH</text>
<text x="774" y="239.9" font-size="14" fill="#2EA121" font-weight="bold">前面加反斜杠</text>
<text x="58" y="281.9" font-size="14" fill="#1F2329">0x7F</text>
<text x="466.8" y="281.9" font-size="14" fill="#1F2329">\xHH</text>
<text x="774" y="281.9" font-size="14" fill="#2EA121" font-weight="bold">原样</text>
<text x="58" y="323.9" font-size="14" fill="#1F2329">0x80–0xFF</text>
<text x="466.8" y="323.9" font-size="14" fill="#D83931" font-weight="bold">\xHH</text>
<text x="774" y="323.9" font-size="14" fill="#2EA121" font-weight="bold">原样（UTF-8 保留）</text>
<text x="58" y="365.9" font-size="14" fill="#1F2329">其他可打印 ASCII</text>
<text x="466.8" y="365.9" font-size="14" fill="#1F2329">原样</text>
<text x="774" y="365.9" font-size="14" fill="#2EA121" font-weight="bold">原样</text>
<text x="40" y="422" font-size="12" fill="#646A73" data-role="source">来源：ngx_http_log_module.c、ngx_string.c（1.31.9）</text>
</svg>
