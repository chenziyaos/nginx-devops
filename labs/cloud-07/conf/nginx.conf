# One check, three implementations: njs (js_access), Rust (the ngx-rust "curl" example)
# and C (ngx_http_nocurl_module). Each location refuses a User-Agent starting with "curl"
# in the access phase, before its proxy_pass to the local backend runs.
load_module /usr/lib/nginx/modules/ngx_http_js_module.so;
load_module /usr/lib/nginx/modules/ngx_http_curl_module.so;
load_module /usr/lib/nginx/modules/ngx_http_nocurl_module.so;

error_log stderr notice;

events {}

http {
    access_log off;

    js_engine qjs;
    js_import nocurl from /etc/nginx/conf/nocurl.js;
    js_import buggy from /etc/nginx/conf/throw.js;

    server {
        listen 80;

        location /js {
            js_access nocurl.check;
            proxy_pass http://127.0.0.1:8081;
        }

        location /rust {
            curl on;
            proxy_pass http://127.0.0.1:8081;
        }

        location /c {
            nocurl on;
            proxy_pass http://127.0.0.1:8081;
        }

        location /buggy {
            js_access buggy.check;
            proxy_pass http://127.0.0.1:8081;
        }
    }

    # the backend: a request that got through the access phase ends here
    server {
        listen 127.0.0.1:8081;
        return 200 "passed\n";
    }
}
