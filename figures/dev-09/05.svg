<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, Helvetica, Arial, sans-serif" viewBox="0 0 1200 530.5" width="1200" height="530.5">
<rect x="0" y="0" width="1200" height="530.5" rx="16" fill="#FAFBFD" stroke="#DEE0E3" stroke-width="1" data-role="frame"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">四个条件任一成立就结束请求，否则换机器重试</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">从左到右：出错 → 记一次失败 → 查四个停止条件，任一成立就结束，全不成立就换下一台</text>
<text x="144" y="143" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">出错</text>
<text x="448" y="143" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">记失败</text>
<text x="752" y="143" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">停止条件</text>
<text x="1056" y="143" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">结果</text>
<polyline points="252,209.5 330,209.5" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="330,203.5 340,209.5 330,215.5" fill="#8F959E"/>
<polyline points="556,346.5 634,346.5" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="634,340.5 644,346.5 634,352.5" fill="#8F959E"/>
<polyline points="860,346.5 901,346.5 901,278 938,278" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="938,272 948,278 938,284" fill="#8F959E"/>
<polyline points="860,346.5 901,346.5 901,415 938,415" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="938,409 948,415 938,421" fill="#8F959E"/>
<polyline points="448,265 448,281" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="442,281 448,291 454,281" fill="#8F959E"/>
<rect x="40" y="158" width="208" height="103" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="144" y="195.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">后端出错</text>
<text x="144" y="215.2" font-size="12" fill="#646A73" text-anchor="middle">连接失败 / 超时 / 匹配的状</text>
<text x="144" y="234.2" font-size="12" fill="#646A73" text-anchor="middle">态码</text>
<rect x="344" y="158" width="208" height="103" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="448" y="204.9" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">分类错误</text>
<text x="448" y="224.7" font-size="12" fill="#646A73" text-anchor="middle">upstream_next(ft_type)</text>
<rect x="344" y="295" width="208" height="103" rx="8" fill="#F0F4FF" stroke="#82A7FC" stroke-width="1.5" data-role="node"/>
<text x="448" y="341.9" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">记一次失败</text>
<text x="448" y="361.7" font-size="12" fill="#646A73" text-anchor="middle">peer.free：fails++、tries--</text>
<rect x="648" y="295" width="208" height="103" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="752" y="322.9" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">四个停止条件</text>
<text x="752" y="342.7" font-size="12" fill="#646A73" text-anchor="middle">tries 用完 / ft_type 不在列表</text>
<text x="752" y="361.7" font-size="12" fill="#646A73" text-anchor="middle">/ 请求体已发且不缓冲 / 超过</text>
<text x="752" y="380.7" font-size="12" fill="#646A73" text-anchor="middle">next_upstream_timeout</text>
<rect x="952" y="226.5" width="208" height="103" rx="8" fill="#FEF1F1" stroke="#F98E8B" stroke-width="1.5" data-role="node"/>
<text x="1056" y="273.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">结束请求</text>
<text x="1056" y="293.2" font-size="12" fill="#646A73" text-anchor="middle">502 / 504 / 原状态码</text>
<rect x="952" y="363.5" width="208" height="103" rx="8" fill="#F0FBEF" stroke="#8EE085" stroke-width="1.5" data-role="node"/>
<text x="1056" y="410.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">换下一台</text>
<text x="1056" y="430.2" font-size="12" fill="#646A73" text-anchor="middle">关闭连接，connect → get</text>
<text x="919.5" y="269" font-size="12" fill="#646A73" text-anchor="middle">任意成立</text>
<text x="919.5" y="433" font-size="12" fill="#646A73" text-anchor="middle">全不成立</text>
<text x="40" y="506.5" font-size="12" fill="#646A73" data-role="source">来源：ngx_http_upstream_next、ngx_http_upstream.c（1.31.10）</text>
</svg>
