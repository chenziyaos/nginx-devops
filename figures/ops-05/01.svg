<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, Helvetica, Arial, sans-serif" viewBox="0 0 1200 420" width="1200" height="420">
<rect x="0" y="0" width="1200" height="420" rx="16" fill="#FAFBFD" stroke="#DEE0E3" stroke-width="1" data-role="frame"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">不开 sendfile 时 writev 分块发送，开了交给内核一次发出</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">static 模块打开文件之后的两条路径；sendfile 默认关闭，蓝色是打开后的路径</text>
<text x="180" y="147" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">打开文件</text>
<text x="600" y="147" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">sendfile</text>
<text x="1020" y="147" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">写到 socket</text>
<polyline points="294,256 387,256 387,204 476,204" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="476,198 486,204 476,210" fill="#8F959E"/>
<polyline points="294,256 387,256 387,308 476,308" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="476,302 486,308 476,314" fill="#8F959E"/>
<polyline points="714,204 896,204" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="896,198 906,204 896,210" fill="#8F959E"/>
<polyline points="714,308 896,308" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="896,302 906,308 896,314" fill="#8F959E"/>
<rect x="70" y="214" width="220" height="84" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="180" y="251.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">static 模块</text>
<text x="180" y="271.2" font-size="12" fill="#646A73" text-anchor="middle">打开文件</text>
<rect x="490" y="162" width="220" height="84" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="600" y="199.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">copy filter</text>
<text x="600" y="219.2" font-size="12" fill="#646A73" text-anchor="middle">读进 2 个 32 KB 缓冲区</text>
<rect x="490" y="266" width="220" height="84" rx="8" fill="#E1EAFF" stroke="#3370FF" stroke-width="2" data-role="node"/>
<text x="600" y="293.9" font-size="14" fill="#245BDB" font-weight="bold" text-anchor="middle">sendfile()</text>
<text x="600" y="313.7" font-size="12" fill="#646A73" text-anchor="middle">一次发出头和文件；单次上限</text>
<text x="600" y="332.7" font-size="12" fill="#646A73" text-anchor="middle">sendfile_max_chunk 2 MB</text>
<rect x="910" y="162" width="220" height="84" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="1020" y="199.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">writev 分块</text>
<text x="1020" y="219.2" font-size="12" fill="#646A73" text-anchor="middle">33027、32768 … 3392 字节</text>
<rect x="910" y="266" width="220" height="84" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="1020" y="303.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">tcp_nopush on</text>
<text x="1020" y="323.2" font-size="12" fill="#646A73" text-anchor="middle">Linux 上先设 TCP_CORK</text>
<text x="340.5" y="247" font-size="12" fill="#646A73" text-anchor="middle">off（默认）</text>
<text x="340.5" y="274" font-size="12" fill="#646A73" text-anchor="middle">on</text>
<text x="40" y="396" font-size="12" fill="#646A73" data-role="source">来源：ngx_http_core_module.c、ngx_linux_sendfile_chain.c（1.31.10）</text>
</svg>
