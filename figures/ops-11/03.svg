<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, Helvetica, Arial, sans-serif" viewBox="0 0 1200 420" width="1200" height="420">
<rect x="0" y="0" width="1200" height="420" rx="16" fill="#FAFBFD" stroke="#DEE0E3" stroke-width="1" data-role="frame"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">四个时间变量的起止点不同，能把慢请求分到不同环节</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">每行一个变量；高亮行只有 $request_time 包含客户端那一段</text>
<rect x="40" y="134.4" width="1120" height="212" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1" data-role="table"/>
<rect x="41" y="135.4" width="1118" height="43" rx="11" fill="#F5F6F7"/>
<rect x="41" y="166.4" width="1118" height="12" fill="#F5F6F7"/>
<rect x="41" y="304.4" width="1118" height="41" rx="11" fill="#F0FBEF"/>
<rect x="41" y="304.4" width="11" height="11" fill="#F0FBEF"/>
<rect x="1148" y="304.4" width="11" height="11" fill="#F0FBEF"/>
<line x1="40" y1="178.4" x2="1160" y2="178.4" stroke="#DEE0E3" stroke-width="1"/>
<line x1="41" y1="220.4" x2="1159" y2="220.4" stroke="#EFF0F1" stroke-width="1"/>
<line x1="41" y1="262.4" x2="1159" y2="262.4" stroke="#EFF0F1" stroke-width="1"/>
<line x1="41" y1="304.4" x2="1159" y2="304.4" stroke="#EFF0F1" stroke-width="1"/>
<line x1="41" y1="304.4" x2="1159" y2="304.4" stroke="#8EE085" stroke-width="1"/>
<rect x="40" y="134.4" width="1120" height="212" rx="12" fill="none" stroke="#DEE0E3" stroke-width="1"/>
<text x="58" y="161.4" font-size="14" fill="#1F2329" font-weight="bold">变量</text>
<text x="410.8" y="161.4" font-size="14" fill="#1F2329" font-weight="bold">起点</text>
<text x="816.4" y="161.4" font-size="14" fill="#1F2329" font-weight="bold">终点</text>
<text x="58" y="204.3" font-size="14" fill="#1F2329">$upstream_connect_time</text>
<text x="410.8" y="204.3" font-size="14" fill="#1F2329">开始连接后端 u-＞start_time</text>
<text x="816.4" y="204.3" font-size="14" fill="#1F2329">连接建立</text>
<text x="58" y="246.3" font-size="14" fill="#1F2329">$upstream_header_time</text>
<text x="410.8" y="246.3" font-size="14" fill="#1F2329">开始连接后端 u-＞start_time</text>
<text x="816.4" y="246.3" font-size="14" fill="#1F2329">响应头解析完</text>
<text x="58" y="288.3" font-size="14" fill="#1F2329">$upstream_response_time</text>
<text x="410.8" y="288.3" font-size="14" fill="#1F2329">开始连接后端 u-＞start_time</text>
<text x="816.4" y="288.3" font-size="14" fill="#1F2329">后端响应收完</text>
<text x="58" y="330.3" font-size="14" fill="#2EA121" font-weight="bold">$request_time</text>
<text x="410.8" y="330.3" font-size="14" fill="#2EA121" font-weight="bold">读到请求的第一批数据 r-＞start_sec</text>
<text x="816.4" y="330.3" font-size="14" fill="#2EA121" font-weight="bold">最后一个字节发给客户端，写日志</text>
<text x="40" y="396" font-size="12" fill="#646A73" data-role="source">来源：ngx_http_log_module.c、ngx_http_upstream.c（1.31.10）</text>
</svg>
