# Pebble, the test ACME server of Let's Encrypt, as the CA of this lab.
# It validates HTTP-01 challenges on port 80 of the names it is asked for, resolved through
# the cluster DNS. The variables turn off its built-in randomness: random sleeps before a
# validation, rejecting 5% of good nonces, and reusing a valid authorization 50% of the
# time. Here it is always reused, so a renewal by the same account needs no new challenge.
apiVersion: v1
kind: Pod
metadata:
  name: pebble
  labels:
    app: pebble
spec:
  containers:
    - name: pebble
      image: ghcr.io/letsencrypt/pebble:2.10.3
      args: ["-config", "/etc/pebble/pebble.json"]
      env:
        - name: PEBBLE_VA_NOSLEEP
          value: "1"
        - name: PEBBLE_WFE_NONCEREJECT
          value: "0"
        - name: PEBBLE_AUTHZREUSE
          value: "100"
      ports:
        - containerPort: 14000
        - containerPort: 15000
      readinessProbe:
        tcpSocket:
          port: 14000
        periodSeconds: 1
      volumeMounts:
        - name: conf
          mountPath: /etc/pebble/pebble.json
          subPath: pebble.json
        - name: tls
          mountPath: /etc/pebble/tls
  volumes:
    - name: conf
      configMap:
        name: pebble-conf
    - name: tls
      secret:
        secretName: pebble-tls
---
apiVersion: v1
kind: Service
metadata:
  name: pebble
spec:
  selector:
    app: pebble
  ports:
    - name: acme
      port: 14000
    - name: management
      port: 15000
