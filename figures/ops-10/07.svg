<text x="843.2" y="143" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">兜底</text>
<text x="1086.4" y="143" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">结果</text>
