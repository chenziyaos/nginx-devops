# config: bad-cert
# a TLS listener whose certificate Secret is not mounted
worker_processes 1;

events {
}

http {
    access_log off;

    server {
        listen 80;
        listen 443 ssl;
        ssl_certificate     /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        return 200 "v3\n";
    }
}
