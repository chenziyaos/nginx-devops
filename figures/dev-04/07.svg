<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, Helvetica, Arial, sans-serif" viewBox="0 0 1200 531" width="1200" height="531">
<rect x="0" y="0" width="1200" height="531" rx="16" fill="#FAFBFD" stroke="#DEE0E3" stroke-width="1" data-role="frame"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">端口不断靠的是同一个 fd 在新旧 cycle 之间传递</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">从上到下是 reload 时 master、旧 worker、新 worker 的交接顺序；数字（fd 5）和端口（19082、19084）来自实验输出</text>
<line x1="226.7" y1="168" x2="226.7" y2="467" stroke="#C9CDD4" stroke-width="1.5" stroke-dasharray="6 4"/>
