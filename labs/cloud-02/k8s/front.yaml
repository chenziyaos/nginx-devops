# The proxy, started after the backends are ready.
apiVersion: v1
kind: Pod
metadata:
  name: front
  labels: {app: front}
spec:
  containers:
    - name: nginx
      image: nginx-devops/nginx:1.31.10
      volumeMounts:
        - {name: conf, mountPath: /etc/nginx/nginx.conf, subPath: front.conf}
  volumes:
    - name: conf
      configMap: {name: lab-conf}
