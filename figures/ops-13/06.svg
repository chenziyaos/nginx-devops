<text x="361.9" y="201.1" font-size="18" fill="#1F2329" font-weight="bold">error.log</text>
<text x="361.9" y="229.1" font-size="18" fill="#1F2329" font-weight="bold">原文</text>
<text x="361.9" y="258.7" font-size="14" fill="#646A73">必要时调到 info</text>
<rect x="643.8" y="160.8" width="214.3" height="146" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="step"/>
<circle cx="834.1" cy="186.8" r="13" fill="#F5F6F7" stroke="#BBBFC4" stroke-width="2"/>
<text x="834.1" y="191.3" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">3</text>
<text x="663.8" y="201.1" font-size="18" fill="#1F2329" font-weight="bold">确认配置和</text>
<text x="663.8" y="229.1" font-size="18" fill="#1F2329" font-weight="bold">路径</text>
<text x="663.8" y="258.7" font-size="14" fill="#646A73">nginx -T 确认配置</text>
<text x="663.8" y="280.7" font-size="14" fill="#646A73">debug 日志看请求路径</text>
<rect x="945.7" y="160.8" width="214.3" height="146" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="step"/>
<circle cx="1136" cy="186.8" r="13" fill="#F5F6F7" stroke="#BBBFC4" stroke-width="2"/>
<text x="1136" y="191.3" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">4</text>
<text x="965.7" y="201.1" font-size="18" fill="#1F2329" font-weight="bold">对照规则</text>
<text x="965.7" y="230.7" font-size="14" fill="#646A73">§8 配置误区表</text>
