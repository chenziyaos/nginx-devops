# no worker_processes: the pod passes it with -g
error_log /var/log/nginx/error.log notice;

events {
}

http {
    log_format lab '"$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log lab;

    server {
        listen 80;

        location / {
            return 200 "$hostname\n";
        }

        # /srv/big is an emptyDir; run.sh writes a 1 MB file into it
        location /big/ {
            root /srv;
            limit_rate 200k;
        }
    }
}
