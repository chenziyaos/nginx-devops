# ops-03: two workers; /big/ is sent slowly so a request can be in flight during a reload
worker_processes 2;
error_log logs/error.log info;

events { worker_connections 64; }

http {
    log_format lab '$pid $uri $status $body_bytes_sent';
    access_log logs/access.log lab;

    server {
        listen 127.0.0.1:18060;
        root   html;

        location / {
            return 200 "v1 worker=$pid\n";
        }
        location /big/ {
            root       out/run;
            limit_rate 200k;
        }
    }
}
