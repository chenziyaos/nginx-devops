<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, Helvetica, Arial, sans-serif" viewBox="0 0 1200 488" width="1200" height="488">
<rect x="0" y="0" width="1200" height="488" rx="16" fill="#FAFBFD" stroke="#DEE0E3" stroke-width="1" data-role="frame"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">HTTPRoute 的每个字段在 nginx 配置里都有落点</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">实验的 route 在数据面 nginx -T 里对应的配置；绿色一行是本篇反复用到的事实</text>
<rect x="40" y="128" width="1120" height="296" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1" data-role="table"/>
<rect x="41" y="129" width="1118" height="43" rx="11" fill="#F5F6F7"/>
<rect x="41" y="160" width="1118" height="12" fill="#F5F6F7"/>
<rect x="41" y="214" width="1118" height="42" fill="#F0FBEF"/>
<line x1="40" y1="172" x2="1160" y2="172" stroke="#DEE0E3" stroke-width="1"/>
<line x1="41" y1="214" x2="1159" y2="214" stroke="#EFF0F1" stroke-width="1"/>
<line x1="41" y1="256" x2="1159" y2="256" stroke="#EFF0F1" stroke-width="1"/>
<line x1="41" y1="298" x2="1159" y2="298" stroke="#EFF0F1" stroke-width="1"/>
<line x1="41" y1="340" x2="1159" y2="340" stroke="#EFF0F1" stroke-width="1"/>
<line x1="41" y1="382" x2="1159" y2="382" stroke="#EFF0F1" stroke-width="1"/>
<line x1="41" y1="214" x2="1159" y2="214" stroke="#8EE085" stroke-width="1"/>
<line x1="41" y1="256" x2="1159" y2="256" stroke="#8EE085" stroke-width="1"/>
<rect x="40" y="128" width="1120" height="296" rx="12" fill="none" stroke="#DEE0E3" stroke-width="1"/>
<text x="58" y="155" font-size="14" fill="#1F2329" font-weight="bold">HTTPRoute 里写的</text>
<text x="310.4" y="155" font-size="14" fill="#1F2329" font-weight="bold">nginx 配置里的</text>
<text x="706.8" y="155" font-size="14" fill="#1F2329" font-weight="bold">说明</text>
<text x="58" y="197.9" font-size="14" fill="#1F2329">PathPrefix /api</text>
<text x="310.4" y="197.9" font-size="14" fill="#1F2329">location /api/ 和 location = /api</text>
<text x="706.8" y="197.9" font-size="14" fill="#1F2329">按路径段匹配</text>
<text x="58" y="239.9" font-size="14" fill="#2EA121" font-weight="bold">backendRefs: v1</text>
<text x="310.4" y="239.9" font-size="14" fill="#2EA121" font-weight="bold">upstream 命名空间_v1_80</text>
<text x="706.8" y="239.9" font-size="14" fill="#2EA121" font-weight="bold">server 是 Pod IP，不经过 kube-proxy</text>
<text x="58" y="281.9" font-size="14" fill="#1F2329">负载均衡</text>
<text x="310.4" y="281.9" font-size="14" fill="#1F2329">random two least_conn</text>
<text x="706.8" y="281.9" font-size="14" fill="#1F2329">NGF 的默认值</text>
<text x="58" y="323.9" font-size="14" fill="#1F2329">v1 80、v2 20</text>
<text x="310.4" y="323.9" font-size="14" fill="#1F2329">split_clients $request_id</text>
<text x="706.8" y="323.9" font-size="14" fill="#1F2329">逐请求随机，1000 个请求 v2 落在 14% 到 26%</text>
<text x="58" y="365.9" font-size="14" fill="#1F2329">header 条件</text>
<text x="310.4" y="365.9" font-size="14" fill="#1F2329">js_content httpmatches.redirect</text>
<text x="706.8" y="365.9" font-size="14" fill="#1F2329">njs 查 matches.json 后内部跳转</text>
<text x="58" y="407.9" font-size="14" fill="#1F2329">不存在的 Service</text>
<text x="310.4" y="407.9" font-size="14" fill="#1F2329">upstream invalid-backend-ref</text>
<text x="706.8" y="407.9" font-size="14" fill="#1F2329">status 写 BackendNotFound，请求得到 500</text>
<text x="40" y="464" font-size="12" fill="#646A73" data-role="source">来源：labs/cloud-03 实验输出；NGF v2.9.1 upstreams.go、split_clients_template.go</text>
</svg>
