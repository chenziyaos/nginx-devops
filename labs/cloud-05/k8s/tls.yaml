# nginx with the Secret web-tls mounted as a directory (conf/tls.conf).
apiVersion: v1
kind: Pod
metadata:
  name: tls
  labels:
    app: tls
spec:
  containers:
    - name: nginx
      image: nginx-devops/nginx:1.31.10
      command: ["nginx", "-c", "/etc/nginx/conf/tls.conf", "-g", "daemon off;"]
      volumeMounts:
        - name: conf
          mountPath: /etc/nginx/conf
        - name: tls
          mountPath: /etc/tls
  volumes:
    - name: conf
      configMap:
        name: tls-conf
    - name: tls
      secret:
        secretName: web-tls
