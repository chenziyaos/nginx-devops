<text x="60" y="197.9" font-size="14" fill="#646A73">ngx_http_init_connection</text>
<rect x="334" y="128" width="238" height="124" rx="12" fill="#F0FBEF" stroke="#8EE085" stroke-width="1.5" data-role="step"/>
<text x="354" y="168.3" font-size="18" fill="#1F2329" font-weight="bold">读请求行/头</text>
<text x="354" y="197.9" font-size="14" fill="#646A73">状态机换三次处理函数</text>
<rect x="628" y="128" width="238" height="124" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="step"/>
<text x="648" y="168.3" font-size="18" fill="#1F2329" font-weight="bold">整体校验</text>
<text x="648" y="197.9" font-size="14" fill="#646A73">ngx_http_process_request</text>
<text x="648" y="219.9" font-size="14" fill="#646A73">_header</text>
<rect x="922" y="128" width="238" height="124" rx="12" fill="#F0F4FF" stroke="#82A7FC" stroke-width="1.5" data-role="step"/>
<text x="942" y="168.3" font-size="18" fill="#1F2329" font-weight="bold">阶段数组</text>
<text x="942" y="197.9" font-size="14" fill="#646A73">ngx_http_core_run_phases</text>
<rect x="40" y="308" width="238" height="124" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="step"/>
<text x="60" y="348.3" font-size="18" fill="#1F2329" font-weight="bold">header / body</text>
<text x="60" y="376.3" font-size="18" fill="#1F2329" font-weight="bold">过滤</text>
<text x="60" y="405.9" font-size="14" fill="#646A73">模块链从后往前执行</text>
<rect x="334" y="308" width="238" height="124" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="step"/>
<text x="354" y="348.3" font-size="18" fill="#1F2329" font-weight="bold">finalize_request</text>
<text x="354" y="377.9" font-size="14" fill="#646A73">count 归零，释放请求</text>
<rect x="628" y="308" width="238" height="124" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="step"/>
<text x="648" y="348.3" font-size="18" fill="#1F2329" font-weight="bold">连接处理</text>
<text x="648" y="377.9" font-size="14" fill="#646A73">keepalive / 延迟关闭 / 关闭</text>
