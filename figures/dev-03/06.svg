<rect x="40" y="210" width="208" height="84" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="144" y="256.9" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">ngx_slab_alloc(size)</text>
<rect x="344" y="158" width="208" height="84" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="448" y="185.9" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">大块</text>
<text x="448" y="205.7" font-size="12" fill="#646A73" text-anchor="middle">size ＞ pagesize / 2：按页数，</text>
<text x="448" y="224.7" font-size="12" fill="#646A73" text-anchor="middle">8193 → 1 页，40000 → 3 页</text>
<rect x="344" y="262" width="208" height="84" rx="8" fill="#F0F4FF" stroke="#82A7FC" stroke-width="1.5" data-role="node"/>
<text x="448" y="289.9" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">小块</text>
<text x="448" y="309.7" font-size="12" fill="#646A73" text-anchor="middle">取 2 的幂，最小 8，slot =</text>
<text x="448" y="328.7" font-size="12" fill="#646A73" text-anchor="middle">shift - 3</text>
<rect x="648" y="210" width="208" height="84" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="752" y="256.9" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">有半满页</text>
