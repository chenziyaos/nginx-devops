<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, Helvetica, Arial, sans-serif" viewBox="0 0 1200 496" width="1200" height="496">
<rect x="0" y="0" width="1200" height="496" rx="16" fill="#FAFBFD" stroke="#DEE0E3" stroke-width="1" data-role="frame"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">读请求、跑阶段、发响应、count 归零才释放</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">从左到右；绿色是事件驱动的读写，蓝色是同步的阶段遍历</text>
<rect x="40" y="128" width="238" height="124" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="step"/>
