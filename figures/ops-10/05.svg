<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, Helvetica, Arial, sans-serif" viewBox="0 0 1200 643" width="1200" height="643">
<rect x="0" y="0" width="1200" height="643" rx="16" fill="#FAFBFD" stroke="#DEE0E3" stroke-width="1" data-role="frame"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">过期后，第一个请求拿旧内容并后台更新，其他请求也拿旧内容</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">顺序从上到下；蓝色是客户端见到的快速响应，后台更新不堵塞</text>
<line x1="180" y1="168" x2="180" y2="579" stroke="#C9CDD4" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="80" y="128" width="200" height="40" rx="8" fill="#F0F4FF" stroke="#82A7FC" stroke-width="1.5" data-role="actor"/>
<text x="180" y="153" font-size="14" fill="#245BDB" font-weight="bold" text-anchor="middle">客户端</text>
<line x1="460" y1="168" x2="460" y2="579" stroke="#C9CDD4" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="360" y="128" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="actor"/>
<text x="460" y="153" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">nginx</text>
<line x1="740" y1="168" x2="740" y2="579" stroke="#C9CDD4" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="640" y="128" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="actor"/>
<text x="740" y="153" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">后台子请求</text>
<line x1="1020" y1="168" x2="1020" y2="579" stroke="#C9CDD4" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="920" y="128" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="actor"/>
<text x="1020" y="153" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">后端</text>
<text x="190" y="202.6" font-size="13" fill="#1F2329">条目已过期</text>
<polyline points="180,211 448,211" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="448,205 458,211 448,217" fill="#8F959E"/>
<text x="470" y="243.6" font-size="13" fill="#1F2329">node.updating = 1，状态 STALE</text>
<polyline points="460,252 486,252 486,270 474,270" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="474,264 464,270 474,276" fill="#8F959E"/>
<text x="450" y="310.6" font-size="13" fill="#1F2329" text-anchor="end">立即返回旧内容</text>
<polyline points="460,319 192,319" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="192,313 182,319 192,325" fill="#8F959E"/>
<text x="470" y="351.6" font-size="13" fill="#1F2329">ngx_http_subrequest，BACKGROUND</text>
<polyline points="460,360 728,360" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="728,354 738,360 728,366" fill="#8F959E"/>
<text x="750" y="392.6" font-size="13" fill="#1F2329">回源</text>
<polyline points="740,401 1008,401" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="1008,395 1018,401 1008,407" fill="#8F959E"/>
<text x="1010" y="433.6" font-size="13" fill="#1F2329" text-anchor="end">新响应</text>
<polyline points="1020,442 752,442" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="752,436 742,442 752,448" fill="#8F959E"/>
<text x="730" y="474.6" font-size="13" fill="#1F2329" text-anchor="end">重写缓存文件，updating = 0</text>
<polyline points="740,483 472,483" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="472,477 462,483 472,489" fill="#8F959E"/>
<text x="190" y="515.5" font-size="13" fill="#1F2329">下一个请求</text>
<polyline points="180,524 448,524" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="448,518 458,524 448,530" fill="#8F959E"/>
<text x="450" y="556.5" font-size="13" fill="#1F2329" text-anchor="end">HIT，新内容</text>
<polyline points="460,565 192,565" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="192,559 182,565 192,571" fill="#8F959E"/>
<text x="40" y="619" font-size="12" fill="#646A73" data-role="source">来源：本文整理</text>
</svg>
