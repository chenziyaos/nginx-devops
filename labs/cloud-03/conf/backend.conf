# Every backend pod answers with its own name; /big is a 7 MB file sent at 512 KB/s, so a
# download stays in flight across a reload of the gateway.
worker_processes 1;

events {
}

http {
    access_log off;

    server {
        listen 80;

        location / {
            return 200 "$hostname\n";
        }

        location = /big {
            limit_rate 512k;
            default_type application/octet-stream;
            alias /usr/sbin/nginx;
        }
    }
}
