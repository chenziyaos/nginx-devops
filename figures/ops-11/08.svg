<text x="144" y="251.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">$http_x_ctx</text>
<text x="144" y="271.2" font-size="12" fill="#646A73" text-anchor="middle">请求头里的 JSON</text>
<rect x="344" y="214" width="208" height="84" rx="8" fill="#E1EAFF" stroke="#3370FF" stroke-width="2" data-role="node"/>
<text x="448" y="251.4" font-size="14" fill="#245BDB" font-weight="bold" text-anchor="middle">第一次使用</text>
