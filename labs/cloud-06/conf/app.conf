# The app behind the edge: logs the request id and traceparent it received.
error_log stderr notice;

events {}

http {
    log_format json escape=json
        '{"hop":"app","request_id":"$http_x_request_id","uri":"$request_uri","status":$status,'
        '"traceparent":"$http_traceparent"}';

    access_log /dev/stdout json;

    server {
        listen 80;

        location / {
            return 200 "app\n";
        }

        # about 2 MB at 256 KB/s: a download that lasts several seconds
        location = /slow {
            limit_rate 256k;
            alias /usr/sbin/nginx;
        }
    }
}
