# dev-05: one worker with debug logging, to follow the event loop
worker_processes 1;
error_log logs/error.log debug;
events { }

http {
    access_log off;

    server {
        listen 127.0.0.1:19100;
        location / { return 200 "ok\n"; }
    }

    server {
        listen 127.0.0.1:19101;
        client_header_timeout 1s;
        location / { return 200 "ok\n"; }
    }
}
