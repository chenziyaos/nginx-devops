# nginx with the three extension modules; its config and scripts come from the ConfigMap
# ext-conf, mounted as a directory so an update can reach it.
apiVersion: v1
kind: Pod
metadata:
  name: ext
  labels:
    app: ext
spec:
  containers:
    - name: nginx
      image: nginx-devops/nginx-ext:1.31.10
      command: ["nginx", "-c", "/etc/nginx/conf/nginx.conf", "-g", "daemon off;"]
      volumeMounts:
        - name: conf
          mountPath: /etc/nginx/conf
  volumes:
    - name: conf
      configMap:
        name: ext-conf
