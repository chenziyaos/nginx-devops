# The same config for nginx 1.26.3, 1.30.8 and 1.31.10: two ways to proxy to a local
# backend, which logs the connection number of every request it gets.
error_log stderr notice;

events {}

http {
    access_log off;
    log_format conn '$connection';

    # an explicit upstream block
    upstream backend {
        server 127.0.0.1:8081;
    }

    server {
        listen 80;

        location = /ready {
            return 200 "ready\n";
        }

        location /explicit {
            proxy_pass http://backend;
        }

        # an address in proxy_pass: an implicit upstream
        location /implicit {
            proxy_pass http://127.0.0.1:8082;
        }
    }

    server {
        listen 127.0.0.1:8081;
        access_log /tmp/backend-8081.log conn;
        return 200 "backend\n";
    }

    server {
        listen 127.0.0.1:8082;
        access_log /tmp/backend-8082.log conn;
        return 200 "backend\n";
    }
}
