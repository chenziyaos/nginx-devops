<text x="691.6" y="167" font-size="14" fill="#1F2329" text-anchor="middle">shctx</text>
<text x="691.6" y="187" font-size="12" fill="#646A73" text-anchor="middle">红黑树根 + 哨兵 + 队列根</text>
