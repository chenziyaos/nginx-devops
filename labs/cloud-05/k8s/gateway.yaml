# A Gateway with an HTTP listener, where cert-manager's HTTP-01 solver attaches its
# HTTPRoute, and an HTTPS listener whose certificate is the Secret web-tls.
# NGF provisions the data plane (Deployment and Service gw-nginx) for it.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw
spec:
  gatewayClassName: nginx
  listeners:
    - name: http
      port: 80
      protocol: HTTP
    - name: https
      port: 443
      protocol: HTTPS
      hostname: gw-nginx.lab-cloud-05.svc.cluster.local
      tls:
        mode: Terminate
        certificateRefs:
          - name: web-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app
spec:
  parentRefs:
    - name: gw
      sectionName: https
  rules:
    - backendRefs:
        - name: app
          port: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: app
  labels:
    app: app
spec:
  containers:
    - name: nginx
      image: nginx-devops/nginx:1.31.10
      command: ["nginx", "-c", "/etc/nginx/conf/app.conf", "-g", "daemon off;"]
      volumeMounts:
        - name: conf
          mountPath: /etc/nginx/conf
  volumes:
    - name: conf
      configMap:
        name: app-conf
---
apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  selector:
    app: app
  ports:
    - port: 80
