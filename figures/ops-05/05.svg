<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, Helvetica, Arial, sans-serif" viewBox="0 0 1200 420" width="1200" height="420">
<rect x="0" y="0" width="1200" height="420" rx="16" fill="#FAFBFD" stroke="#DEE0E3" stroke-width="1" data-role="frame"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">到达三个上限之一就关闭连接</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">每个请求开始时依次检查；都没到才保持连接，空闲超过 keepalive_timeout 后关闭</text>
<rect x="40" y="151.2" width="1120" height="170" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1" data-role="table"/>
<rect x="41" y="152.2" width="1118" height="43" rx="11" fill="#F5F6F7"/>
<rect x="41" y="183.2" width="1118" height="12" fill="#F5F6F7"/>
<line x1="40" y1="195.2" x2="1160" y2="195.2" stroke="#DEE0E3" stroke-width="1"/>
<line x1="41" y1="237.2" x2="1159" y2="237.2" stroke="#EFF0F1" stroke-width="1"/>
<line x1="41" y1="279.2" x2="1159" y2="279.2" stroke="#EFF0F1" stroke-width="1"/>
<text x="58" y="178.2" font-size="14" fill="#1F2329" font-weight="bold">检查</text>
<text x="261.5" y="178.2" font-size="14" fill="#1F2329" font-weight="bold">指令（默认）</text>
<text x="645.8" y="178.2" font-size="14" fill="#1F2329" font-weight="bold">条件</text>
<text x="887.7" y="178.2" font-size="14" fill="#1F2329" font-weight="bold">到达后</text>
<text x="58" y="221.1" font-size="14" fill="#1F2329">空闲超时</text>
<text x="261.5" y="221.1" font-size="14" fill="#1F2329">keepalive_timeout（75 秒）</text>
<text x="645.8" y="221.1" font-size="14" fill="#1F2329">设为 0</text>
<text x="887.7" y="221.1" font-size="14" fill="#D83931" font-weight="bold">Connection: close</text>
<text x="58" y="263.1" font-size="14" fill="#1F2329">请求数</text>
<text x="261.5" y="263.1" font-size="14" fill="#1F2329">keepalive_requests（1000）</text>
<text x="645.8" y="263.1" font-size="14" fill="#1F2329">已处理 ≥ 上限</text>
<text x="887.7" y="263.1" font-size="14" fill="#D83931" font-weight="bold">Connection: close</text>
<text x="58" y="305.1" font-size="14" fill="#1F2329">连接时长</text>
<text x="261.5" y="305.1" font-size="14" fill="#1F2329">keepalive_time（1 小时）</text>
<text x="645.8" y="305.1" font-size="14" fill="#1F2329">存在超过上限</text>
<text x="887.7" y="305.1" font-size="14" fill="#D83931" font-weight="bold">Connection: close</text>
<text x="40" y="396" font-size="12" fill="#646A73" data-role="source">来源：ngx_http_core_module.c、ngx_http_request.c（1.31.9）</text>
</svg>
