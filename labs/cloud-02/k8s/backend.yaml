# Three backend pods behind two Services: a normal one with a ClusterIP, and a headless
# one whose DNS name returns the address of every ready pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 3
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      containers:
        - name: nginx
          image: nginx-devops/nginx:1.31.10
          readinessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 1
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/nginx.conf, subPath: backend.conf}
      volumes:
        - name: conf
          configMap: {name: lab-conf}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector: {app: backend}
  ports:
    - port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: backend-headless
spec:
  clusterIP: None
  selector: {app: backend}
  ports:
    - port: 80
