<text x="752" y="388.7" font-size="12" fill="#646A73" text-anchor="middle">create_conf →</text>
<text x="752" y="407.7" font-size="12" fill="#646A73" text-anchor="middle">ngx_conf_parse → init_conf</text>
<rect x="952" y="158" width="208" height="87" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
