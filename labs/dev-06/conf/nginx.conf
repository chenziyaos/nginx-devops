# dev-06: one server for the request lifecycle, one that plays the backend of a subrequest
worker_processes 1;
error_log logs/error.log debug;

events {
    worker_connections 64;
}

http {
    log_format lab '"$request" $status';
    access_log logs/access.log lab;

    types {
        text/html  html shtml;
        text/plain txt;
    }

    # small buffers so that the header limits are easy to reach (defaults: 1k, 4 8k, 1000)
    client_header_buffer_size 1k;
    large_client_header_buffers 2 4k;
    max_headers 10;

    server {
        listen 127.0.0.1:19120;
        root html;

        location /r/ {
            rewrite ^/r/(.*)$ /static/$1 last;
        }

        location /static/ {
            alias html/;
        }

        location /loop/ {
            rewrite ^/loop/(.*)$ /loop/x$1 last;
        }

        location /deny {
            deny all;
        }

        location /missing {
            error_page 404 /a.txt;
        }

        location = /page.shtml {
            ssi on;
        }

        location /slow {
            proxy_pass http://127.0.0.1:19121/;
        }
    }

    server {
        listen 127.0.0.1:19121;
        return 200 "slow\n";
    }
}
