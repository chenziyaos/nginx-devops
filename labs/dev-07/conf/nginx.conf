# dev-07: the rewrite module and the variables it reads and writes
worker_processes 1;
error_log logs/error.log debug;

events {
    worker_connections 64;
}

http {
    log_format lab '"$request" $status uri=$uri args=$args ct=$sent_http_content_type';
    access_log logs/access.log lab;

    server {
        listen 127.0.0.1:19140;
        root html;
        rewrite_log on;

        # server level, no flag: the URI changes and the location is chosen for the new one
        rewrite ^/old/(.*)$ /new/$1;

        location /new/ {
            return 200 "new uri=$uri args=$args\n";
        }

        location /chain/ {
            rewrite ^/chain/(.*)$ /step1/$1;
            rewrite ^/step1/(.*)$ /step2/$1 last;
            rewrite ^ /never;
        }

        location /step2/ {
            return 200 "step2 uri=$uri\n";
        }

        location /brk/ {
            rewrite ^/brk/(.*)$ /files/$1 break;
            return 403;
        }

        location /args/ {
            rewrite ^/args/(.*)$ /new/$1?x=1;
        }

        location /noargs/ {
            rewrite ^/noargs/(.*)$ /new/$1?x=1?;
        }

        location /redir/ {
            rewrite ^/redir/(.*)$ http://example.test/$1 permanent;
        }

        location /set/ {
            set $a "x";
            set $b "$a-$uri";
            if ($arg_mode = "deny") {
                return 403;
            }
            if ($http_x_name ~* ^(\w+)$) {
                set $c $1;
            }
            return 200 "a=$a b=$b c=$c\n";
        }

        location /flush/ {
            set $u1 $uri;
            rewrite ^ /flushed;
            set $u2 $uri;
            return 200 "u1=$u1 u2=$u2\n";
        }

        location /cache/ {
            set $early $sent_http_content_type;
            return 200 "early=[$early]\n";
        }

        location /nocache/ {
            return 200 "ok\n";
        }
    }
}
