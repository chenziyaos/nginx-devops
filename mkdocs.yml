# Online edition of README.md, ops/, dev/ and cloud/, published to GitHub Pages by .github/workflows/pages.yml.
# Local preview: pip install -r docs-site/requirements.txt && mkdocs serve
site_name: nginx-devops
site_url: https://zyaochen.github.io/nginx-devops/
site_description: 基于 nginx 1.31.10 源码的中文教程：运维篇 13 章、开发篇 10 章、云原生篇，每章配可复现的实验。
repo_url: https://github.com/zyaochen/nginx-devops
repo_name: zyaochen/nginx-devops
edit_uri: blob/master/
docs_dir: docs-site/pages
site_dir: site
copyright: <a href="https://zyaochen.github.io/">zyaochen</a>

theme:
  name: material
  custom_dir: docs-site/overrides
  language: zh
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - navigation.tracking
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: blue
      toggle: { icon: material/weather-night, name: 切换到暗色 }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle: { icon: material/weather-sunny, name: 切换到亮色 }
  font: false
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      # lunr.zh needs a server-side segmenter; split on every CJK character instead.
      lang: en
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])|(?<=[\u3400-\u9fff])|(?=[\u3400-\u9fff])'

hooks:
  - docs-site/hooks.py

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: math
          class: arithmatex
          format: !!python/object/apply:pymdownx.arithmatex.arithmatex_fenced_format {kwds: {mode: generic, tag: pre}}
  - pymdownx.arithmatex:
      generic: true
      inline_syntax: [round]
      block_syntax: [dollar, square]

extra:
  nav_sections:
    ops: 运维篇
    dev: 开发篇
    cloud: 云原生篇
  katex: false
  repo_branch: master
  repo_prefix: ""
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/zyaochen
