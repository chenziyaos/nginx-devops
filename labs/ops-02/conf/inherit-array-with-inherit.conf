events {
    worker_connections 1024;
}

http {
    access_log logs/access.log combined;

    server {
        listen 127.0.0.1:18046;
        server_name _;

        # Parent add_headers
        add_header X-Parent "from-server";

        location / {
            # With add_header_inherit merge, child headers + parent headers both included
            add_header_inherit merge;
            add_header X-Child "from-location";
            return 200 "test\n";
        }

        location /on {
            # With add_header_inherit on (default), child overrides
            add_header_inherit on;
            add_header X-Child "from-location";
            return 200 "test\n";
        }

        location /off {
            # With add_header_inherit off, neither inherited nor merged
            add_header_inherit off;
            add_header X-Child "from-location";
            return 200 "test\n";
        }

        location /off-no-header {
            # With add_header_inherit off and no child add_header, parent is also not inherited
            add_header_inherit off;
            return 200 "test\n";
        }
    }
}
