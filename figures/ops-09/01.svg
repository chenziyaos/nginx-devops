<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, Helvetica, Arial, sans-serif" viewBox="0 0 1200 420" width="1200" height="420">
<rect x="0" y="0" width="1200" height="420" rx="16" fill="#FAFBFD" stroke="#DEE0E3" stroke-width="1" data-role="frame"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">return 在 REWRITE 阶段就结束请求，限流没有机会运行</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">只画出和本篇有关的阶段；从左到右是请求经过的顺序，蓝色是限流模块所在的阶段</text>
<text x="144" y="147" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">SERVER_REWRITE / REWRITE</text>
<text x="448" y="147" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">PREACCESS</text>
<text x="752" y="147" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">ACCESS</text>
<text x="1056" y="147" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">CONTENT</text>
<polyline points="252,256 293,256 293,204 330,204" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="330,198 340,204 330,210" fill="#8F959E"/>
<polyline points="252,256 293,256 293,308 330,308" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="330,302 340,308 330,314" fill="#8F959E"/>
<polyline points="556,308 634,308" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="634,302 644,308 634,314" fill="#8F959E"/>
<polyline points="860,308 938,308" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="938,302 948,308 938,314" fill="#8F959E"/>
<rect x="40" y="214" width="208" height="84" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="144" y="251.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">rewrite 模块</text>
<text x="144" y="271.2" font-size="12" fill="#646A73" text-anchor="middle">return 200 · rewrite · set</text>
<rect x="344" y="162" width="208" height="84" rx="8" fill="#FEF1F1" stroke="#F98E8B" stroke-width="1.5" data-role="node"/>
<text x="448" y="199.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">直接生成响应</text>
<text x="448" y="219.2" font-size="12" fill="#646A73" text-anchor="middle">限流模块没有运行</text>
<rect x="344" y="266" width="208" height="84" rx="8" fill="#E1EAFF" stroke="#3370FF" stroke-width="2" data-role="node"/>
<text x="448" y="293.9" font-size="14" fill="#245BDB" font-weight="bold" text-anchor="middle">限流</text>
<text x="448" y="313.7" font-size="12" fill="#646A73" text-anchor="middle">realip → limit_req →</text>
<text x="448" y="332.7" font-size="12" fill="#646A73" text-anchor="middle">limit_conn</text>
<rect x="648" y="266" width="208" height="84" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="752" y="303.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">访问控制</text>
<text x="752" y="323.2" font-size="12" fill="#646A73" text-anchor="middle">allow / deny · auth_basic</text>
<rect x="952" y="266" width="208" height="84" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="1056" y="303.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">生成内容</text>
<text x="1056" y="323.2" font-size="12" fill="#646A73" text-anchor="middle">静态文件 · proxy_pass</text>
<text x="311.5" y="195" font-size="12" fill="#646A73" text-anchor="middle">return</text>
<text x="311.5" y="326" font-size="12" fill="#646A73" text-anchor="middle">无 return</text>
<text x="40" y="396" font-size="12" fill="#646A73" data-role="source">来源：ngx_http_core_module.h、ngx_http_limit_req_module.c（1.31.9）</text>
</svg>
