<text x="452" y="168.3" font-size="18" fill="#1F2329" font-weight="bold">解析配置文件</text>
<text x="452" y="197.9" font-size="14" fill="#646A73">syntax is ok</text>
<rect x="824" y="128" width="336" height="96" rx="12" fill="#E1EAFF" stroke="#3370FF" stroke-width="2" data-role="step"/>
