<text x="226.7" y="153" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">master</text>
<line x1="600" y1="168" x2="600" y2="467" stroke="#C9CDD4" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="500" y="128" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="actor"/>
<text x="600" y="153" font-size="13" fill="#1F2329" font-weight="bold" text-anchor="middle">旧 worker（旧 cycle）</text>
<line x1="973.3" y1="168" x2="973.3" y2="467" stroke="#C9CDD4" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="873.3" y="128" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="actor"/>
<text x="973.3" y="153" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">新 worker</text>
<text x="236.7" y="202.6" font-size="13" fill="#1F2329">ngx_init_cycle(old)：19082 fd 5、19084 新建</text>
<polyline points="226.7,211 252.7,211 252.7,229 240.7,229" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="240.7,223 230.7,229 240.7,235" fill="#8F959E"/>
<text x="236.7" y="269.6" font-size="13" fill="#1F2329">关闭 19083、释放旧 cycle 内存池</text>
<polyline points="226.7,278 252.7,278 252.7,296 240.7,296" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="240.7,290 230.7,296 240.7,302" fill="#8F959E"/>
<text x="236.7" y="336.6" font-size="13" fill="#1F2329">fork（继承 fd 5 和新 fd）</text>
