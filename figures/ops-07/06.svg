<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, Helvetica, Arial, sans-serif" viewBox="0 0 1200 420" width="1200" height="420">
<rect x="0" y="0" width="1200" height="420" rx="16" fill="#FAFBFD" stroke="#DEE0E3" stroke-width="1" data-role="frame"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">least_time 按平均时间乘以 (1 + 连接数) 选最小值</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">从左到右：收集平均响应时间 → 离散化 → 加权 → 比较选最小</text>
<rect x="40" y="172" width="238" height="118" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="step"/>
<text x="60" y="212.3" font-size="18" fill="#1F2329" font-weight="bold">平均时间</text>
<text x="60" y="241.9" font-size="14" fill="#646A73">每次新值占 5%</text>
<text x="60" y="263.9" font-size="14" fill="#646A73">的加权平均</text>
<rect x="334" y="172" width="238" height="118" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="step"/>
<text x="354" y="212.3" font-size="18" fill="#1F2329" font-weight="bold">离散化</text>
<text x="354" y="241.9" font-size="14" fill="#646A73">向上取整到 20 ms</text>
<text x="354" y="263.9" font-size="14" fill="#646A73">超过 5000 ms 按 5000</text>
<rect x="628" y="172" width="238" height="118" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="step"/>
<text x="648" y="212.3" font-size="18" fill="#1F2329" font-weight="bold">加权</text>
<text x="648" y="241.9" font-size="14" fill="#646A73">时间 × (1 + 连接数)</text>
<rect x="922" y="172" width="238" height="118" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="step"/>
<text x="942" y="212.3" font-size="18" fill="#1F2329" font-weight="bold">比较</text>
<text x="942" y="241.9" font-size="14" fill="#646A73">选最小值</text>
<text x="942" y="263.9" font-size="14" fill="#646A73">并列时轮询</text>
<polyline points="284,231 318,231" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="318,225 328,231 318,237" fill="#8F959E"/>
