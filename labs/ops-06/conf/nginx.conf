# ops-06: one nginx is both the backend (18120) and the proxies in front of it.
# 18139 is never listened on: it is the "dead backend".
events { worker_connections 256; }

http {
    error_log  logs/error.log info;
    log_format up  '$uri $status [$upstream_addr] [$upstream_status]';
    log_format tn  '$request $status';
    log_format tm  '$uri $status $request_time $upstream_response_time';
    access_log logs/access.log up;

    limit_req_zone $binary_remote_addr zone=slow:1m rate=6r/m;

    # ---- backend: echoes what it received ----
    server {
        listen 127.0.0.1:18120;
        http2  on;
        access_log off;

        location / {
            return 200 "uri=$request_uri\n";
        }
        location /h/ {
            return 200 "host=[$http_host] connection=[$http_connection] upgrade=[$http_upgrade] te=[$http_te] x-a=[$http_x_a] x-b=[$http_x_b] xff=[$http_x_forwarded_for]\n";
        }
        location /conn/ {
            return 200 "proto=$server_protocol conn=$connection req=$connection_requests\n";
        }
        # a static file behind limit_req: the second request within 10 s waits up to 10 s
        location = /slow.txt {
            root      html;
            limit_req zone=slow burst=5;
        }
        location /big/ {
            root out/run;
        }
    }

    upstream be {
        server 127.0.0.1:18120;
    }
    upstream be_shared {
        server 127.0.0.1:18120;
        keepalive 8;
    }
    upstream be_off {
        server 127.0.0.1:18120;
        keepalive 0;
    }
    upstream retry {
        server 127.0.0.1:18139;
        server 127.0.0.1:18120;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # ---- the proxy ----
    server {
        listen 127.0.0.1:18121;
        proxy_set_header X-B from-server;

        # URI rewriting
        location /a/      { proxy_pass http://127.0.0.1:18120; }
        location /b/      { proxy_pass http://127.0.0.1:18120/new/; }
        location /c0      { proxy_pass http://127.0.0.1:18120/new; }
        location /d/      { proxy_pass http://127.0.0.1:18120/; }
        location ~ ^/re/  { proxy_pass http://127.0.0.1:18120; }
        location /rw/ {
            rewrite ^/rw/(.*)$ /new/$1 break;
            proxy_pass http://127.0.0.1:18120/ignored/;
        }

        # request headers
        location /h/      { proxy_pass http://127.0.0.1:18120; }
        location /h-up/   { proxy_pass http://be/h/; }
        location /h-loc/ {
            proxy_pass http://127.0.0.1:18120/h/;
            proxy_set_header X-A from-location;
        }
        location /h-host/ {
            proxy_pass http://127.0.0.1:18120/h/;
            proxy_set_header Host $host;
        }
        location /h-empty/ {
            proxy_pass http://127.0.0.1:18120/h/;
            proxy_set_header Host "";
        }
        location /h-xff/ {
            proxy_pass http://127.0.0.1:18120/h/;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /h-ws/ {
            proxy_pass http://127.0.0.1:18120/h/;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # connections to the backend
        location /k-implicit/ { proxy_pass http://127.0.0.1:18120/conn/; }
        location /k-up/       { proxy_pass http://be/conn/; }
        location /k-up2/      { proxy_pass http://be/conn/; }
        location /k-sh1/      { proxy_pass http://be_shared/conn/; }
        location /k-sh2/      { proxy_pass http://be_shared/conn/; }
        location /k-10/ {
            proxy_pass http://be/conn/;
            proxy_http_version 1.0;
        }
        location /k-off/      { proxy_pass http://be_off/conn/; }
        location /k-h2/ {
            proxy_pass http://be/conn/;
            proxy_http_version 2;
        }

        # failures
        location /dead/       { proxy_pass http://127.0.0.1:18139; }
        location = /slow.txt {
            proxy_pass http://127.0.0.1:18120;
            proxy_read_timeout 300ms;
        }
        location /retry/      { proxy_pass http://retry/conn/; }

        # buffering
        location /big/ {
            proxy_pass http://127.0.0.1:18120;
            access_log logs/timing.log tm;
        }
        location /big-off/ {
            proxy_pass http://127.0.0.1:18120/big/;
            proxy_buffering off;
            access_log logs/timing.log tm;
        }
    }

    # ---- realip ----
    server {
        listen 127.0.0.1:18122;
        set_real_ip_from 127.0.0.1;
        set_real_ip_from 10.0.0.0/8;
        real_ip_header   X-Forwarded-For;

        location / {
            return 200 "remote_addr=$remote_addr realip_remote_addr=$realip_remote_addr\n";
        }
        # too late: the server-level settings were applied in POST_READ already
        location /rec/ {
            real_ip_recursive on;
            return 200 "remote_addr=$remote_addr realip_remote_addr=$realip_remote_addr\n";
        }
    }
    server {
        listen 127.0.0.1:18125;
        set_real_ip_from  127.0.0.1;
        set_real_ip_from  10.0.0.0/8;
        real_ip_header    X-Forwarded-For;
        real_ip_recursive on;

        location / {
            return 200 "remote_addr=$remote_addr realip_remote_addr=$realip_remote_addr\n";
        }
    }

    # ---- CONNECT tunnel ----
    map $host:$request_port $tunnel_ok {
        127.0.0.1:18120 1;
        default         0;
    }
    server {
        listen 127.0.0.1:18123;
        access_log logs/tunnel.log tn;

        if ($tunnel_ok = 0) {
            return 403;
        }
        location / {
            tunnel_pass;
        }
    }
}
