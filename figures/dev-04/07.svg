<polygon points="961.3,339 971.3,345 961.3,351" fill="#8F959E"/>
<text x="236.7" y="377.6" font-size="13" fill="#1F2329">QUIT</text>
<polyline points="226.7,386 588,386" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="588,380 598,386 588,392" fill="#8F959E"/>
<text x="610" y="418.6" font-size="13" fill="#1F2329">处理完手上的请求后退出</text>
<polyline points="600,427 626,427 626,445 614,445" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="614,439 604,445 614,451" fill="#8F959E"/>
<text x="40" y="507" font-size="12" fill="#646A73" data-role="source">来源：ngx_cycle.c、labs/dev-04 实验输出</text>
