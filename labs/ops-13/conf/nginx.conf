# ops-13: one status code per location, and the error.log line that explains it.
worker_processes 1;
# the same messages at two levels: client errors are logged at "info"
error_log logs/error.log info;
error_log logs/error-default.log;

events { worker_connections 64; }

http {
    log_format t '$status $request_method $uri up=$upstream_status';
    access_log logs/access.log t;
    root html;

    include upstreams.conf;

    limit_req_zone $server_port zone=lim:1m rate=1r/m;
    limit_req_zone $uri zone=slow:1m rate=1r/m;

    server {
        listen 127.0.0.1:18260;
        large_client_header_buffers 4 1k;
        client_max_body_size 1k;
        client_header_timeout 1s;

        location /hdr { return 200 "x_token=[$http_x_token]\n"; }
        location /loop { rewrite ^ /loop last; }
        location /limited { limit_req zone=lim; }

        location /refused { proxy_pass http://127.0.0.1:18279; }
        location /closed  { proxy_pass http://127.0.0.1:18261/close; }
        location /reset   { proxy_pass http://127.0.0.1:18275; }
        location /big {
            proxy_buffer_size 1k;
            proxy_pass http://127.0.0.1:18261/echo;
        }
        location /nolive  { proxy_pass http://dead2; }
        location /t504 {
            proxy_read_timeout 1s;
            proxy_pass http://127.0.0.1:18261/slow;
        }
        location /t499 { proxy_pass http://127.0.0.1:18261/slow2; }
    }

    # backend
    server {
        listen 127.0.0.1:18261;
        access_log logs/backend.log t;
        # 444: close the connection without a response
        location /close { return 444; }
        # a 1200-byte response header, more than the front's proxy_buffer_size 1k
        location /echo {
            set $p 0123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789;
            add_header X-Big $p$p$p$p$p$p$p$p$p$p$p$p;
            return 200 "echo\n";
        }
        # the first request passes, the next one waits 60 s (a file, not "return":
        # return runs in the rewrite phase, before limit_req)
        location /slow { limit_req zone=slow burst=5; try_files /slow =404; }
        location /slow2 { limit_req zone=slow burst=5; try_files /slow =404; }
    }

    # one request traced with a debug log
    server {
        listen 127.0.0.1:18262;
        error_log logs/debug.log debug;
        location / { return 200 "traced\n"; }
    }
}

stream {
    # closes at once without reading the request: the client gets a reset
    server {
        listen 127.0.0.1:18275;
        return "";
    }
}
