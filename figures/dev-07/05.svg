<polygon points="896,302.5 906,308.5 896,314.5" fill="#8F959E"/>
<polyline points="714,415.5 896,415.5" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="896,409.5 906,415.5 896,421.5" fill="#8F959E"/>
<polyline points="714,522.5 896,522.5" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="896,516.5 906,522.5 896,528.5" fill="#8F959E"/>
<rect x="70" y="318.5" width="220" height="87" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="180" y="366.9" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">执行替换</text>
<rect x="490" y="158" width="220" height="87" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="600" y="196.9" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">无标志</text>
<text x="600" y="216.7" font-size="12" fill="#646A73" text-anchor="middle">继续执行下一条指令</text>
<rect x="490" y="265" width="220" height="87" rx="8" fill="#E1EAFF" stroke="#3370FF" stroke-width="2" data-role="node"/>
<text x="600" y="303.9" font-size="14" fill="#245BDB" font-weight="bold" text-anchor="middle">last</text>
<text x="600" y="323.7" font-size="12" fill="#646A73" text-anchor="middle">stop，uri_changed = 1</text>
<rect x="490" y="372" width="220" height="87" rx="8" fill="#E1EAFF" stroke="#3370FF" stroke-width="2" data-role="node"/>
<text x="600" y="410.9" font-size="14" fill="#245BDB" font-weight="bold" text-anchor="middle">break</text>
<text x="600" y="430.7" font-size="12" fill="#646A73" text-anchor="middle">stop，uri_changed = 0</text>
<rect x="490" y="479" width="220" height="87" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="600" y="506.9" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">redirect /</text>
<text x="600" y="528.9" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">permanent</text>
<text x="600" y="548.7" font-size="12" fill="#646A73" text-anchor="middle">stop，status 302 / 301</text>
<rect x="910" y="158" width="220" height="87" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="1020" y="196.9" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">继续下一条</text>
