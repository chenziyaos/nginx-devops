<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, Helvetica, Arial, sans-serif" viewBox="0 0 1200 473" width="1200" height="473">
<rect x="0" y="0" width="1200" height="473" rx="16" fill="#FAFBFD" stroke="#DEE0E3" stroke-width="1" data-role="frame"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">三种方式分 worker 连接：都监听、独占、按 socket 分</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">三种方式对比监听 socket 数和 worker 行为；默认配置由 EPOLLEXCLUSIVE 保证只唤醒一个</text>
<rect x="40" y="128" width="357.3" height="281" rx="12" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="1.5" data-role="card"/>
<text x="60" y="168.5" font-size="20" fill="#646A73" font-weight="bold" data-role="card-title">默认</text>
<line x1="60" y1="193" x2="377.3" y2="193" stroke="#EFF0F1" stroke-width="1"/>
<text x="60" y="227" font-size="14" fill="#646A73">accept_mutex</text>
<text x="377.3" y="227" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="end">off</text>
<line x1="60" y1="241" x2="377.3" y2="241" stroke="#EFF0F1" stroke-width="1"/>
<text x="60" y="265" font-size="14" fill="#646A73">监听 socket 数</text>
<text x="377.3" y="265" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="end">1 个</text>
<line x1="60" y1="279" x2="377.3" y2="279" stroke="#EFF0F1" stroke-width="1"/>
<text x="60" y="303" font-size="14" fill="#646A73">worker 注册</text>
<text x="377.3" y="303" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="end">4 个都注册</text>
<line x1="60" y1="317" x2="377.3" y2="317" stroke="#EFF0F1" stroke-width="1"/>
<text x="60" y="341" font-size="14" fill="#646A73">内核分配</text>
<text x="377.3" y="341" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="end">EPOLLEXCLUSIVE 只唤醒一个</text>
<line x1="60" y1="355" x2="377.3" y2="355" stroke="#EFF0F1" stroke-width="1"/>
<text x="60" y="379" font-size="14" fill="#646A73">开销</text>
<text x="377.3" y="379" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="end">全连接比赛</text>
<rect x="421.3" y="128" width="357.3" height="281" rx="12" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="1.5" data-role="card"/>
<text x="441.3" y="168.5" font-size="20" fill="#646A73" font-weight="bold" data-role="card-title">accept_mutex on</text>
<line x1="441.3" y1="193" x2="758.7" y2="193" stroke="#EFF0F1" stroke-width="1"/>
<text x="441.3" y="227" font-size="14" fill="#646A73">accept_mutex</text>
<text x="758.7" y="227" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="end">on</text>
<line x1="441.3" y1="241" x2="758.7" y2="241" stroke="#EFF0F1" stroke-width="1"/>
<text x="441.3" y="265" font-size="14" fill="#646A73">监听 socket 数</text>
<text x="758.7" y="265" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="end">1 个</text>
<line x1="441.3" y1="279" x2="758.7" y2="279" stroke="#EFF0F1" stroke-width="1"/>
<text x="441.3" y="303" font-size="14" fill="#646A73">持锁 worker</text>
<text x="758.7" y="303" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="end">注册，kevent 等 -1</text>
<line x1="441.3" y1="317" x2="758.7" y2="317" stroke="#EFF0F1" stroke-width="1"/>
<text x="441.3" y="341" font-size="14" fill="#646A73">其他 worker</text>
<text x="758.7" y="341" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="end">每 500 ms 抢一次锁</text>
<line x1="441.3" y1="355" x2="758.7" y2="355" stroke="#EFF0F1" stroke-width="1"/>
<text x="441.3" y="379" font-size="14" fill="#646A73">开销</text>
<text x="758.7" y="379" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="end">未持锁的 worker 空转</text>
<rect x="802.7" y="128" width="357.3" height="281" rx="12" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="1.5" data-role="card"/>
<text x="822.7" y="168.5" font-size="20" fill="#646A73" font-weight="bold" data-role="card-title">reuseport</text>
<line x1="822.7" y1="193" x2="1140" y2="193" stroke="#EFF0F1" stroke-width="1"/>
<text x="822.7" y="227" font-size="14" fill="#646A73">listen 参数</text>
<text x="1140" y="227" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="end">reuseport</text>
<line x1="822.7" y1="241" x2="1140" y2="241" stroke="#EFF0F1" stroke-width="1"/>
<text x="822.7" y="265" font-size="14" fill="#646A73">监听 socket 数</text>
<text x="1140" y="265" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="end">4 个（同地址）</text>
<line x1="822.7" y1="279" x2="1140" y2="279" stroke="#EFF0F1" stroke-width="1"/>
<text x="822.7" y="303" font-size="14" fill="#646A73">worker 行为</text>
<text x="1140" y="303" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="end">各注册自己的 socket</text>
<line x1="822.7" y1="317" x2="1140" y2="317" stroke="#EFF0F1" stroke-width="1"/>
<text x="822.7" y="341" font-size="14" fill="#646A73">内核分配</text>
<text x="1140" y="341" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="end">哈希在 4 个 socket 间</text>
<line x1="822.7" y1="355" x2="1140" y2="355" stroke="#EFF0F1" stroke-width="1"/>
<text x="822.7" y="379" font-size="14" fill="#646A73">风险</text>
<rect x="857.1" y="364" width="282.9" height="24" rx="8" fill="#FEF1F1" stroke="#F98E8B" stroke-width="1" data-role="value-chip"/>
<text x="1132" y="379" font-size="14" fill="#D83931" font-weight="bold" text-anchor="end">卡住的 worker 拖住分给它的连接</text>
<text x="40" y="449" font-size="12" fill="#646A73" data-role="source">来源：src/event/ngx_event.c、src/core/ngx_connection.c、labs/dev-05（1.31.9）</text>
</svg>
