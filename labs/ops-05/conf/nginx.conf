# ops-05: static files, conditional requests, Range, gzip, expires, open_file_cache,
# keepalive and request body limits. Files under out/run/ are created by run.sh.
worker_processes 1;

events { worker_connections 64; }

http {
    types {
        text/html                html;
        text/css                 css;
        text/plain               txt;
        application/javascript   js;
    }
    default_type application/octet-stream;

    log_format t '$request_uri $status $connection $connection_requests';
    access_log logs/access.log t;

    server {
        listen 127.0.0.1:18100;
        root   html;

        # sendfile is off unless it is switched on
        location /sf-default/ { alias out/run/sf/; error_log logs/sf-default.log debug; }
        location /sf-on/      { alias out/run/sf/; error_log logs/sf-on.log debug; sendfile on; }

        location /ims-before/ { alias html/cond/; if_modified_since before; }

        location /range1/ { alias html/range/; max_ranges 1; }

        location /gzip/ {
            gzip      on;
            gzip_vary on;
        }

        location /gzs/ {
            alias       out/run/gzs/;
            gzip_static on;
        }

        location /exp/     { expires 1h; }
        location /exp-mod/ { alias html/exp/; expires modified 1h; }

        location /ofc/   { alias out/run/ofc/; open_file_cache max=10; open_file_cache_valid 30s; }
        location /noofc/ { alias out/run/ofc/; }

        location /upload/ {
            client_max_body_size 1k;
            proxy_pass http://127.0.0.1:18101;
        }

        location /upload-big/ {
            client_body_buffer_size 8k;
            error_log logs/error.log warn;
            proxy_pass http://127.0.0.1:18101;
        }
    }

    # the backend for the upload locations: answers with the body length it received
    server {
        listen 127.0.0.1:18101;
        location / { return 200 "got $content_length\n"; }
    }

    server {
        listen 127.0.0.1:18102;
        root   html;
        keepalive_requests 3;
        keepalive_timeout  75s 60s;
    }
}
