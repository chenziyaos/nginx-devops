events {
    worker_connections 1024;
}

http {
    proxy_connect_timeout 5s;

    server {
        listen 127.0.0.1:18043;
        server_name _;

        location /inherited {
            # No proxy_connect_timeout set here, should inherit 5s from http block
            proxy_pass http://127.0.0.1:18044;
            access_log off;
        }

        location /override {
            proxy_connect_timeout 10s;
            proxy_pass http://127.0.0.1:18044;
            access_log off;
        }
    }

    server {
        listen 127.0.0.1:18044;
        server_name _;

        location / {
            return 200 "backend\n";
        }
    }
}
