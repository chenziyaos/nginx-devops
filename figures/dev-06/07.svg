<polygon points="896,354.5 906,360.5 896,366.5" fill="#8F959E"/>
<polyline points="714,360.5 807,360.5 807,445.5 896,445.5" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="896,439.5 906,445.5 896,451.5" fill="#8F959E"/>
<rect x="70" y="243" width="220" height="65" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="180" y="270.9" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">finalize</text>
<text x="180" y="290.7" font-size="12" fill="#646A73" text-anchor="middle">ngx_http_finalize_request</text>
<rect x="490" y="158" width="220" height="65" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="600" y="185.9" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">还有输出或子请求</text>
<text x="600" y="205.7" font-size="12" fill="#646A73" text-anchor="middle">writer 等写事件</text>
<rect x="490" y="243" width="220" height="65" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="600" y="270.9" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">count ＞ 1</text>
<text x="600" y="290.7" font-size="12" fill="#646A73" text-anchor="middle">count--，等其他引用</text>
<rect x="490" y="328" width="220" height="65" rx="8" fill="#F0F4FF" stroke="#82A7FC" stroke-width="1.5" data-role="node"/>
<text x="600" y="355.9" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">count == 1</text>
<text x="600" y="375.7" font-size="12" fill="#646A73" text-anchor="middle">可以释放</text>
<rect x="910" y="243" width="220" height="65" rx="8" fill="#F0FBEF" stroke="#8EE085" stroke-width="1.5" data-role="node"/>
<text x="1020" y="270.9" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">keepalive</text>
<text x="1020" y="290.7" font-size="12" fill="#646A73" text-anchor="middle">set_keepalive</text>
<rect x="910" y="328" width="220" height="65" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="1020" y="355.9" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">延迟关闭</text>
<text x="1020" y="375.7" font-size="12" fill="#646A73" text-anchor="middle">set_lingering_close</text>
<rect x="910" y="413" width="220" height="65" rx="8" fill="#FEF1F1" stroke="#F98E8B" stroke-width="1.5" data-role="node"/>
<text x="1020" y="440.9" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">关闭</text>
<text x="1020" y="460.7" font-size="12" fill="#646A73" text-anchor="middle">close_request，跑 LOG 阶段</text>
<text x="40" y="518" font-size="12" fill="#646A73" data-role="source">来源：ngx_http_request.c（1.31.10）</text>
