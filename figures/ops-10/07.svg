<text x="356.8" y="575.2" font-size="12" fill="#646A73" text-anchor="middle">或 500</text>
<rect x="526.4" y="480" width="147.2" height="141" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="600" y="555.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">还能换下一台？</text>
<rect x="769.6" y="480" width="147.2" height="141" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="843.2" y="507.9" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">能用旧内容吗？</text>
<text x="843.2" y="527.7" font-size="12" fill="#646A73" text-anchor="middle">失败类型在</text>
<text x="843.2" y="546.7" font-size="12" fill="#646A73" text-anchor="middle">proxy_cache_use_s</text>
<text x="843.2" y="565.7" font-size="12" fill="#646A73" text-anchor="middle">tale 里，或</text>
<text x="843.2" y="584.7" font-size="12" fill="#646A73" text-anchor="middle">stale-if-error 未</text>
<text x="843.2" y="603.7" font-size="12" fill="#646A73" text-anchor="middle">到期</text>
<rect x="1012.8" y="399.5" width="147.2" height="141" rx="8" fill="#F0F4FF" stroke="#82A7FC" stroke-width="1.5" data-role="node"/>
