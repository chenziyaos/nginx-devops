<text x="752" y="143" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">slots[slot]</text>
<text x="1056" y="143" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">找位置</text>
