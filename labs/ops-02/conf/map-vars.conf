events {
    worker_connections 1024;
}

http {
    access_log logs/access.log combined;

    # Map to select value based on request arg
    map $arg_device $device_type {
        default   "unknown";
        mobile    "phone";
        tablet    "pad";
        desktop   "computer";
    }

    server {
        listen 127.0.0.1:18047;
        server_name _;

        location / {
            # Return the mapped value as response body
            return 200 "device=$device_type\n";
        }
    }
}
