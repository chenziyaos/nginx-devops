<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, Helvetica, Arial, sans-serif" viewBox="0 0 1200 420" width="1200" height="420">
<rect x="0" y="0" width="1200" height="420" rx="16" fill="#FAFBFD" stroke="#DEE0E3" stroke-width="1" data-role="frame"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">四种拿证书的写法在续期、多副本和 reload 上的差别</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">续期一列是实验里新证书出现的方式；高亮一行是续期后需要有人触发 reload 的写法</text>
<rect x="40" y="134.4" width="1120" height="212" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1" data-role="table"/>
<rect x="41" y="135.4" width="1118" height="43" rx="11" fill="#F5F6F7"/>
<rect x="41" y="166.4" width="1118" height="12" fill="#F5F6F7"/>
<rect x="41" y="220.4" width="1118" height="42" fill="#F0FBEF"/>
<line x1="40" y1="178.4" x2="1160" y2="178.4" stroke="#DEE0E3" stroke-width="1"/>
<line x1="41" y1="220.4" x2="1159" y2="220.4" stroke="#EFF0F1" stroke-width="1"/>
<line x1="41" y1="262.4" x2="1159" y2="262.4" stroke="#EFF0F1" stroke-width="1"/>
<line x1="41" y1="304.4" x2="1159" y2="304.4" stroke="#EFF0F1" stroke-width="1"/>
<line x1="41" y1="220.4" x2="1159" y2="220.4" stroke="#8EE085" stroke-width="1"/>
<line x1="41" y1="262.4" x2="1159" y2="262.4" stroke="#8EE085" stroke-width="1"/>
<rect x="40" y="134.4" width="1120" height="212" rx="12" fill="none" stroke="#DEE0E3" stroke-width="1"/>
<text x="58" y="161.4" font-size="14" fill="#1F2329" font-weight="bold">方式</text>
<text x="404.2" y="161.4" font-size="14" fill="#1F2329" font-weight="bold">续期后 nginx 怎么用上</text>
<text x="712.6" y="161.4" font-size="14" fill="#1F2329" font-weight="bold">要 reload 吗</text>
<text x="864" y="161.4" font-size="14" fill="#1F2329" font-weight="bold">多副本</text>
<text x="58" y="204.3" font-size="14" fill="#1F2329">nginx-acme（每个 nginx 自己申请）</text>
<text x="404.2" y="204.3" font-size="14" fill="#1F2329">共享内存就地替换，下一次握手</text>
<text x="712.6" y="204.3" font-size="14" fill="#1F2329">不用</text>
<text x="864" y="204.3" font-size="14" fill="#1F2329">挑战落到别的副本就 404</text>
<text x="58" y="246.3" font-size="14" fill="#2EA121" font-weight="bold">cert-manager + 普通路径</text>
<text x="404.2" y="246.3" font-size="14" fill="#2EA121" font-weight="bold">kubelet 换文件，reload 后</text>
<text x="712.6" y="246.3" font-size="14" fill="#2EA121" font-weight="bold">要</text>
<text x="864" y="246.3" font-size="14" fill="#2EA121" font-weight="bold">Secret 一份，各副本各自 reload</text>
<text x="58" y="288.3" font-size="14" fill="#1F2329">cert-manager + 路径带变量</text>
<text x="404.2" y="288.3" font-size="14" fill="#1F2329">kubelet 换文件，下一次握手</text>
<text x="712.6" y="288.3" font-size="14" fill="#1F2329">不用</text>
<text x="864" y="288.3" font-size="14" fill="#1F2329">Secret 一份，各副本自动用上</text>
<text x="58" y="330.3" font-size="14" fill="#1F2329">cert-manager + NGF 2.9</text>
<text x="404.2" y="330.3" font-size="14" fill="#1F2329">agent 换文件，缓存过期后的握手</text>
<text x="712.6" y="330.3" font-size="14" fill="#1F2329">不用</text>
<text x="864" y="330.3" font-size="14" fill="#1F2329">NGF 给每个数据面写文件</text>
<text x="40" y="396" font-size="12" fill="#646A73" data-role="source">来源：labs/cloud-05 实验输出</text>
</svg>
