<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">kill -HUP 只在主循环的下一轮才真正执行，处理函数只置标志</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">信号处理函数和主循环之间只隔着一个标志位；真正的工作（ngx_init_cycle、启动 worker）在 sigsuspend 返回后</text>
