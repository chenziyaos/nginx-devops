<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">装上 nginx-otel，后端的父 span 从客户端换成 nginx</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">时间从上向下；T 是 trace id，C 是客户端的 span id，N 是 nginx 生成的 span id；上半段是不装模块的 edge，下半段是装了 nginx-otel 的 traced</text>
