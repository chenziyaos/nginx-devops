<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, Helvetica, Arial, sans-serif" viewBox="0 0 1200 945" width="1200" height="945">
<rect x="0" y="0" width="1200" height="945" rx="16" fill="#FAFBFD" stroke="#DEE0E3" stroke-width="1" data-role="frame"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">open_file_cache 有效期内不重新打开文件，发布后可能返回旧内容</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">从上到下是两次文件请求的时间顺序；蓝色是缓存取用、红色是缓存返回旧内容</text>
