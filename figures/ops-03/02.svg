<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, Helvetica, Arial, sans-serif" viewBox="0 0 1200 699" width="1200" height="699">
<rect x="0" y="0" width="1200" height="699" rx="16" fill="#FAFBFD" stroke="#DEE0E3" stroke-width="1" data-role="frame"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">新配置成功才启动新 worker，失败时老 worker 照常工作</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">时间从上向下；alt/else 分支代表新配置是否通过验证</text>
<line x1="180" y1="186" x2="180" y2="635" stroke="#C9CDD4" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="80" y="128" width="200" height="58" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="actor"/>
<text x="180" y="162" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">运维</text>
<line x1="460" y1="186" x2="460" y2="635" stroke="#C9CDD4" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="360" y="128" width="200" height="58" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="actor"/>
<text x="460" y="162" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">master</text>
<line x1="740" y1="186" x2="740" y2="635" stroke="#C9CDD4" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="640" y="128" width="200" height="58" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="actor"/>
<text x="740" y="153" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">老 worker</text>
<text x="740" y="172" font-size="12" fill="#646A73" text-anchor="middle">用老配置</text>
<line x1="1020" y1="186" x2="1020" y2="635" stroke="#C9CDD4" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="920" y="128" width="200" height="58" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="actor"/>
<text x="1020" y="153" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">新 worker</text>
<text x="1020" y="172" font-size="12" fill="#646A73" text-anchor="middle">用新配置</text>
<text x="190" y="220.6" font-size="13" fill="#1F2329">HUP（nginx -s reload）</text>
<polyline points="180,229 448,229" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="448,223 458,229 448,235" fill="#8F959E"/>
<text x="470" y="261.6" font-size="13" fill="#1F2329">ngx_init_cycle（新配置）</text>
<polyline points="460,270 486,270 486,288 474,288" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="474,282 464,288 474,294" fill="#8F959E"/>
<rect x="40" y="312" width="85.6" height="24" rx="12" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1" data-role="pill"/>
<text x="82.8" y="328.2" font-size="12" fill="#646A73" text-anchor="middle" data-role="pill">新配置有错</text>
<line x1="133.6" y1="324" x2="1160" y2="324" stroke="#EFF0F1" stroke-width="1"/>
<text x="470" y="362.6" font-size="13" fill="#1F2329">记 emerg，继续用老 cycle</text>
<polyline points="460,371 486,371 486,389 474,389" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="474,383 464,389 474,395" fill="#8F959E"/>
<rect x="40" y="413" width="85.6" height="24" rx="12" fill="#F5F6F7" stroke="#DEE0E3" stroke-width="1" data-role="pill"/>
<text x="82.8" y="429.2" font-size="12" fill="#646A73" text-anchor="middle" data-role="pill">新配置成功</text>
<line x1="133.6" y1="425" x2="1160" y2="425" stroke="#EFF0F1" stroke-width="1"/>
<text x="470" y="463.6" font-size="13" fill="#1F2329">fork 新 worker（JUST_RESPAWN）</text>
<polyline points="460,472 1008,472" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="1008,466 1018,472 1008,478" fill="#8F959E"/>
<text x="470" y="504.6" font-size="13" fill="#1F2329">QUIT</text>
<polyline points="460,513 728,513" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="728,507 738,513 728,519" fill="#8F959E"/>
<text x="750" y="545.5" font-size="13" fill="#1F2329">关监听和空闲连接，做完手上的请求</text>
<polyline points="740,554 766,554 766,572 754,572" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="754,566 744,572 754,578" fill="#8F959E"/>
<text x="730" y="612.5" font-size="13" fill="#1F2329" text-anchor="end">退出（SIGCHLD）</text>
<polyline points="740,621 472,621" fill="none" stroke="#8F959E" stroke-width="2" stroke-dasharray="6 4"/>
<polygon points="472,615 462,621 472,627" fill="#8F959E"/>
<text x="40" y="675" font-size="12" fill="#646A73" data-role="source">来源：nginx 源码、labs/ops-03 实验</text>
</svg>
