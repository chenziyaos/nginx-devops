<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, Helvetica, Arial, sans-serif" viewBox="0 0 1200 420" width="1200" height="420">
<rect x="0" y="0" width="1200" height="420" rx="16" fill="#FAFBFD" stroke="#DEE0E3" stroke-width="1" data-role="frame"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">upstream 块默认保持连接，直接写地址的 proxy_pass 每次新建</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">proxy_pass 的目标和 keepalive 写法决定空闲连接能不能复用；proxy_http_version 1.0 时都不复用</text>
<rect x="40" y="134.4" width="1120" height="212" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1" data-role="table"/>
<rect x="41" y="135.4" width="1118" height="43" rx="11" fill="#F5F6F7"/>
<rect x="41" y="166.4" width="1118" height="12" fill="#F5F6F7"/>
<rect x="41" y="220.4" width="1118" height="42" fill="#F0F4FF"/>
<line x1="40" y1="178.4" x2="1160" y2="178.4" stroke="#DEE0E3" stroke-width="1"/>
<line x1="41" y1="220.4" x2="1159" y2="220.4" stroke="#EFF0F1" stroke-width="1"/>
<line x1="41" y1="262.4" x2="1159" y2="262.4" stroke="#EFF0F1" stroke-width="1"/>
<line x1="41" y1="304.4" x2="1159" y2="304.4" stroke="#EFF0F1" stroke-width="1"/>
<line x1="41" y1="220.4" x2="1159" y2="220.4" stroke="#82A7FC" stroke-width="1"/>
<line x1="41" y1="262.4" x2="1159" y2="262.4" stroke="#82A7FC" stroke-width="1"/>
<rect x="40" y="134.4" width="1120" height="212" rx="12" fill="none" stroke="#DEE0E3" stroke-width="1"/>
<text x="58" y="161.4" font-size="14" fill="#1F2329" font-weight="bold">proxy_pass 的目标</text>
<text x="341.1" y="161.4" font-size="14" fill="#1F2329" font-weight="bold">keepalive</text>
<text x="631.9" y="161.4" font-size="14" fill="#1F2329" font-weight="bold">结果</text>
<text x="58" y="204.3" font-size="14" fill="#1F2329">直接写 IP:端口或域名</text>
<text x="341.1" y="204.3" font-size="14" fill="#1F2329">—（隐式 upstream）</text>
<text x="631.9" y="204.3" font-size="14" fill="#D83931" font-weight="bold">不保持连接，每个请求新建</text>
<text x="58" y="246.3" font-size="14" fill="#245BDB" font-weight="bold">upstream {} 块</text>
<text x="341.1" y="246.3" font-size="14" fill="#245BDB" font-weight="bold">没写</text>
<text x="631.9" y="246.3" font-size="14" fill="#245BDB" font-weight="bold">等价 keepalive 32 local：只在同一个 location 内复用</text>
<text x="58" y="288.3" font-size="14" fill="#1F2329">upstream {} 块</text>
<text x="341.1" y="288.3" font-size="14" fill="#1F2329">keepalive 0</text>
<text x="631.9" y="288.3" font-size="14" fill="#1F2329">不保持连接，每个请求新建</text>
<text x="58" y="330.3" font-size="14" fill="#1F2329">upstream {} 块</text>
<text x="341.1" y="330.3" font-size="14" fill="#1F2329">keepalive N</text>
<text x="631.9" y="330.3" font-size="14" fill="#1F2329">所有用这个块的 location 共享 N 条空闲连接</text>
<text x="40" y="396" font-size="12" fill="#646A73" data-role="source">来源：ngx_http_upstream_keepalive_module.c、ngx_http_proxy_module.c（1.31.9）</text>
</svg>
