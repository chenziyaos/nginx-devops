<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, Helvetica, Arial, sans-serif" viewBox="0 0 1200 420" width="1200" height="420">
<rect x="0" y="0" width="1200" height="420" rx="16" fill="#FAFBFD" stroke="#DEE0E3" stroke-width="1" data-role="frame"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">if 的条件和判断是独立的两条指令，通过栈传递结果</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">从左到右展示执行过程；括号内是当前的栈状态</text>
<rect x="40" y="163.2" width="238" height="140" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="step"/>
<text x="60" y="203.5" font-size="18" fill="#1F2329" font-weight="bold">push_var</text>
<text x="60" y="231.5" font-size="18" fill="#1F2329" font-weight="bold">$arg_mode</text>
<text x="60" y="261.1" font-size="14" fill="#646A73">(ok)</text>
<rect x="334" y="163.2" width="238" height="140" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="step"/>
<text x="354" y="203.5" font-size="18" fill="#1F2329" font-weight="bold">push_value deny</text>
<text x="354" y="233.1" font-size="14" fill="#646A73">(ok, deny)</text>
<rect x="628" y="163.2" width="238" height="140" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="step"/>
<text x="648" y="203.5" font-size="18" fill="#1F2329" font-weight="bold">equal</text>
<text x="648" y="233.1" font-size="14" fill="#646A73">弹两个，压结果</text>
<text x="648" y="255.1" font-size="14" fill="#646A73">(空串)</text>
<rect x="922" y="163.2" width="238" height="140" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="step"/>
<text x="942" y="203.5" font-size="18" fill="#1F2329" font-weight="bold">if 判断</text>
<text x="942" y="233.1" font-size="14" fill="#646A73">空串为假</text>
<text x="942" y="255.1" font-size="14" fill="#646A73">跳到 push_var</text>
<text x="942" y="277.1" font-size="14" fill="#646A73">$http_x_name</text>
<polyline points="284,233.2 318,233.2" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="318,227.2 328,233.2 318,239.2" fill="#8F959E"/>
<polyline points="578,233.2 612,233.2" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="612,227.2 622,233.2 612,239.2" fill="#8F959E"/>
<polyline points="872,233.2 906,233.2" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="906,227.2 916,233.2 906,239.2" fill="#8F959E"/>
<text x="40" y="396" font-size="12" fill="#646A73" data-role="source">来源：ngx_http_script.c、ngx_http_rewrite_module.c（1.31.9）</text>
</svg>
