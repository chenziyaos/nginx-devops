<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">同样写成 yes，Rust 示例照常启动，C 模块启动失败</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">两份只差一个指令的配置；高亮一行是 nginx -t 的结论</text>
<rect x="40" y="151.2" width="1120" height="170" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1" data-role="table"/>
<rect x="41" y="152.2" width="1118" height="43" rx="11" fill="#F5F6F7"/>
<rect x="41" y="183.2" width="1118" height="12" fill="#F5F6F7"/>
<rect x="41" y="237.2" width="1118" height="42" fill="#F0FBEF"/>
<line x1="40" y1="195.2" x2="1160" y2="195.2" stroke="#DEE0E3" stroke-width="1"/>
<line x1="41" y1="237.2" x2="1159" y2="237.2" stroke="#EFF0F1" stroke-width="1"/>
<line x1="41" y1="279.2" x2="1159" y2="279.2" stroke="#EFF0F1" stroke-width="1"/>
<line x1="41" y1="237.2" x2="1159" y2="237.2" stroke="#8EE085" stroke-width="1"/>
<line x1="41" y1="279.2" x2="1159" y2="279.2" stroke="#8EE085" stroke-width="1"/>
<rect x="40" y="151.2" width="1120" height="170" rx="12" fill="none" stroke="#DEE0E3" stroke-width="1"/>
<text x="58" y="178.2" font-size="14" fill="#1F2329" font-weight="bold"></text>
<text x="354.4" y="178.2" font-size="14" fill="#1F2329" font-weight="bold">curl yes;（Rust 示例）</text>
<text x="789.5" y="178.2" font-size="14" fill="#1F2329" font-weight="bold">nocurl yes;（C）</text>
<text x="58" y="221.1" font-size="14" fill="#1F2329">解析函数</text>
<text x="354.4" y="221.1" font-size="14" fill="#1F2329">自己写：只认 on 和 off，其余当 off</text>
<text x="789.5" y="221.1" font-size="14" fill="#1F2329">ngx_conf_set_flag_slot</text>
<text x="58" y="263.1" font-size="14" fill="#2EA121" font-weight="bold">nginx -t</text>
<text x="354.4" y="263.1" font-size="14" fill="#2EA121" font-weight="bold">test is successful</text>
<text x="789.5" y="263.1" font-size="14" fill="#2EA121" font-weight="bold">[emerg] invalid value "yes"</text>
<text x="58" y="305.1" font-size="14" fill="#1F2329">运行起来 curl 请求</text>
<text x="354.4" y="305.1" font-size="14" fill="#1F2329">200，放行</text>
<text x="789.5" y="305.1" font-size="14" fill="#1F2329">起不来</text>
<text x="40" y="396" font-size="12" fill="#646A73" data-role="source">来源：labs/cloud-07 实验输出；ngx-rust v0.5.0 examples/curl.rs</text>
