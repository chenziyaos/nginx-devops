# The edge proxy: JSON access log on stdout, a request id passed to the app,
# stub_status for the exporter on 127.0.0.1:8080.
error_log stderr notice;

events {}

http {
    # header lines up to 32k, so the 20000-byte User-Agent of the lab is logged, not refused
    large_client_header_buffers 4 32k;

    # keep a request id that came with the request, make one otherwise
    map $http_x_request_id $rid {
        ""      $request_id;
        default $http_x_request_id;
    }

    log_format json escape=json
        '{"hop":"edge","request_id":"$rid","uri":"$request_uri","status":$status,'
        '"request_time":$request_time,"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"traceparent":"$http_traceparent","user_agent":"$http_user_agent"}';

    access_log /dev/stdout json;

    upstream app {
        server app.lab-cloud-06.svc.cluster.local:80;
    }

    server {
        listen 80;

        location / {
            proxy_set_header X-Request-ID $rid;
            proxy_pass http://app;
        }
    }

    server {
        listen 127.0.0.1:8080;
        access_log off;

        location = /stub_status {
            stub_status;
        }
    }
}
