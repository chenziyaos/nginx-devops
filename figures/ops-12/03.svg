<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, Helvetica, Arial, sans-serif" viewBox="0 0 1200 420" width="1200" height="420">
<rect x="0" y="0" width="1200" height="420" rx="16" fill="#FAFBFD" stroke="#DEE0E3" stroke-width="1" data-role="frame"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">后端故障后摘除、超期后权重逐步恢复</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">从左到右表示后端状态转移；fail_timeout 周期内保持摘除</text>
<text x="180" y="167" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">可用</text>
<text x="600" y="167" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">摘除</text>
<text x="1020" y="167" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">恢复中</text>
<polyline points="294,224 476,224" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="476,218 486,224 476,230" fill="#8F959E"/>
<polyline points="714,224 896,224" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="896,218 906,224 896,230" fill="#8F959E"/>
<polyline points="980.4,270 980.4,292 219.6,292 219.6,280" fill="none" stroke="#8F959E" stroke-width="2" stroke-dasharray="6 4"/>
<polygon points="213.6,280 219.6,270 225.6,280" fill="#8F959E"/>
<rect x="70" y="182" width="220" height="84" rx="8" fill="#F0FBEF" stroke="#8EE085" stroke-width="1.5" data-role="node"/>
<text x="180" y="219.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">可用</text>
<text x="180" y="239.2" font-size="12" fill="#646A73" text-anchor="middle">effective_weight = weight</text>
<rect x="490" y="182" width="220" height="84" rx="8" fill="#FEF1F1" stroke="#F98E8B" stroke-width="1.5" data-role="node"/>
<text x="600" y="209.9" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">摘除</text>
<text x="600" y="229.7" font-size="12" fill="#646A73" text-anchor="middle">fails ≥ max_fails，ew 扣到 0；</text>
<text x="600" y="248.7" font-size="12" fill="#646A73" text-anchor="middle">fail_timeout 内再失败留在此</text>
<rect x="910" y="182" width="220" height="84" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="1020" y="219.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">恢复中</text>
<text x="1020" y="239.2" font-size="12" fill="#646A73" text-anchor="middle">参与选择，ew 每轮加 1</text>
<text x="385" y="215" font-size="12" fill="#646A73" text-anchor="middle">连接失败</text>
<text x="805" y="215" font-size="12" fill="#646A73" text-anchor="middle">超过 fail_timeout</text>
<text x="600" y="283" font-size="12" fill="#646A73" text-anchor="middle">被选中且成功</text>
<text x="40" y="396" font-size="12" fill="#646A73" data-role="source">来源：ngx_stream_upstream_round_robin.c（1.31.9）</text>
</svg>
