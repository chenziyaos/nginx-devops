<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, Helvetica, Arial, sans-serif" viewBox="0 0 1200 494" width="1200" height="494">
<rect x="0" y="0" width="1200" height="494" rx="16" fill="#FAFBFD" stroke="#DEE0E3" stroke-width="1" data-role="frame"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">proxy_cache_lock 时，第一个请求去后端，其他请求等锁释放后读文件</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">顺序从上到下；请求 1 回源时，其余请求每 500 毫秒检查一次锁</text>
<line x1="180" y1="168" x2="180" y2="430" stroke="#C9CDD4" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="80" y="128" width="200" height="40" rx="8" fill="#F0F4FF" stroke="#82A7FC" stroke-width="1.5" data-role="actor"/>
<text x="180" y="153" font-size="14" fill="#245BDB" font-weight="bold" text-anchor="middle">请求 1</text>
<line x1="460" y1="168" x2="460" y2="430" stroke="#C9CDD4" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="360" y="128" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="actor"/>
<text x="460" y="153" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">请求 2..5</text>
<line x1="740" y1="168" x2="740" y2="430" stroke="#C9CDD4" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="640" y="128" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="actor"/>
<text x="740" y="153" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">nginx 共享内存</text>
<line x1="1020" y1="168" x2="1020" y2="430" stroke="#C9CDD4" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="920" y="128" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="actor"/>
<text x="1020" y="153" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">后端</text>
<text x="190" y="202.6" font-size="13" fill="#1F2329">节点不存在，建节点，updating = 1</text>
<polyline points="180,211 728,211" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="728,205 738,211 728,217" fill="#8F959E"/>
<text x="470" y="243.6" font-size="13" fill="#1F2329">updating = 1，等待</text>
<polyline points="460,252 728,252" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="728,246 738,252 728,258" fill="#8F959E"/>
<text x="190" y="284.6" font-size="13" fill="#1F2329">回源，响应 2–3 秒</text>
<polyline points="180,293 1008,293" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="1008,287 1018,293 1008,299" fill="#8F959E"/>
<text x="470" y="325.6" font-size="13" fill="#1F2329">每 500 毫秒检查：锁还在吗?</text>
<polyline points="460,334 728,334" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="728,328 738,334 728,340" fill="#8F959E"/>
<text x="1010" y="366.6" font-size="13" fill="#1F2329" text-anchor="end">响应完成，写缓存文件，updating = 0</text>
<polyline points="1020,375 192,375" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="192,369 182,375 192,381" fill="#8F959E"/>
<text x="470" y="407.6" font-size="13" fill="#1F2329">锁已释放，读文件，HIT</text>
<polyline points="460,416 728,416" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="728,410 738,416 728,422" fill="#8F959E"/>
<text x="40" y="470" font-size="12" fill="#646A73" data-role="source">来源：本文整理</text>
</svg>
