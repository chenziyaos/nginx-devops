<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">每个块只看自己的直接父级，子级 UNSET 时才继承</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">从左到右是 http → server → location 的嵌套；“设了”是本块写了值，UNSET 的块取直接父级合并后的值</text>
