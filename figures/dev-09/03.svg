<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, Helvetica, Arial, sans-serif" viewBox="0 0 1200 660" width="1200" height="660">
<rect x="0" y="0" width="1200" height="660" rx="16" fill="#FAFBFD" stroke="#DEE0E3" stroke-width="1" data-role="frame"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">算法模块在配置阶段只登记函数，所有的选择都发生在请求里</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">左列是配置阶段，右列是请求阶段；init_upstream 设好的 peer.init 在每个请求开始时调用，填进 get / free</text>
<text x="390" y="143" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">配置阶段</text>
<text x="810" y="143" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">请求阶段</text>
<polyline points="504,318 686,318" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="686,312 696,318 686,324" fill="#8F959E"/>
<polyline points="390,246 390,262" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="384,262 390,272 396,262" fill="#8F959E"/>
<polyline points="810,364 810,380" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="804,380 810,390 816,380" fill="#8F959E"/>
<polyline points="810,482 810,498" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="804,498 810,508 816,498" fill="#8F959E"/>
<rect x="280" y="158" width="220" height="84" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="390" y="185.9" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">算法指令</text>
<text x="390" y="205.7" font-size="12" fill="#646A73" text-anchor="middle">least_conn / hash / …，写</text>
<text x="390" y="224.7" font-size="12" fill="#646A73" text-anchor="middle">init_upstream</text>
<rect x="280" y="276" width="220" height="84" rx="8" fill="#F0F4FF" stroke="#82A7FC" stroke-width="1.5" data-role="node"/>
<text x="390" y="303.9" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">init_upstream</text>
<text x="390" y="323.7" font-size="12" fill="#646A73" text-anchor="middle">(cf, us)：建 peers 链表，设</text>
<text x="390" y="342.7" font-size="12" fill="#646A73" text-anchor="middle">peer.init</text>
<rect x="700" y="276" width="220" height="84" rx="8" fill="#F0F4FF" stroke="#82A7FC" stroke-width="1.5" data-role="node"/>
<text x="810" y="303.9" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">peer.init</text>
<text x="810" y="323.7" font-size="12" fill="#646A73" text-anchor="middle">(r, us)：分配 rrp，设 tries、</text>
<text x="810" y="342.7" font-size="12" fill="#646A73" text-anchor="middle">get、free</text>
<rect x="700" y="394" width="220" height="84" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="810" y="431.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">发起连接</text>
<text x="810" y="451.2" font-size="12" fill="#646A73" text-anchor="middle">connect_peer 调 get</text>
<rect x="700" y="512" width="220" height="84" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="810" y="549.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">尝试结束</text>
<text x="810" y="569.2" font-size="12" fill="#646A73" text-anchor="middle">调用 free(state)</text>
<text x="40" y="636" font-size="12" fill="#646A73" data-role="source">来源：ngx_http_upstream.c、ngx_http_upstream_init_main_conf（1.31.10）</text>
</svg>
