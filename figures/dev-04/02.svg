<text x="58" y="161.4" font-size="14" fill="#1F2329" font-weight="bold">所在块</text>
<text x="360.4" y="161.4" font-size="14" fill="#1F2329" font-weight="bold">上下文位</text>
<text x="712.4" y="161.4" font-size="14" fill="#1F2329" font-weight="bold">处理模块</text>
<text x="1102" y="161.4" font-size="14" fill="#1F2329" font-weight="bold">含义</text>
<text x="58" y="204.3" font-size="14" fill="#1F2329">http{}</text>
<text x="360.4" y="204.3" font-size="14" fill="#1F2329">NGX_HTTP_MAIN_CONF</text>
<text x="712.4" y="204.3" font-size="14" fill="#1F2329">ngx_http_core_module</text>
<text x="1102" y="204.3" font-size="14" fill="#1F2329">虚拟主机</text>
<text x="58" y="246.3" font-size="14" fill="#1F2329">upstream{}</text>
<text x="360.4" y="246.3" font-size="14" fill="#1F2329">NGX_HTTP_UPS_CONF</text>
<text x="712.4" y="246.3" font-size="14" fill="#1F2329">ngx_http_upstream_module</text>
