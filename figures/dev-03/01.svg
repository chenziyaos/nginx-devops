<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, Helvetica, Arial, sans-serif" viewBox="0 0 1300 420" width="1300" height="420">
<rect x="0" y="0" width="1300" height="420" rx="16" fill="#FAFBFD" stroke="#DEE0E3" stroke-width="1" data-role="frame"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">选内存池还是共享内存只看数据要活多久、要不要跨 worker</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">前三行在一个 worker 内、按生命周期选内存池；高亮行要跨 worker 共享，只能用共享内存 zone</text>
<rect x="40" y="134.4" width="1220" height="212" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1" data-role="table"/>
<rect x="41" y="135.4" width="1218" height="43" rx="11" fill="#F5F6F7"/>
<rect x="41" y="166.4" width="1218" height="12" fill="#F5F6F7"/>
<rect x="41" y="304.4" width="1218" height="41" rx="11" fill="#F0F4FF"/>
<rect x="41" y="304.4" width="11" height="11" fill="#F0F4FF"/>
<rect x="1248" y="304.4" width="11" height="11" fill="#F0F4FF"/>
<line x1="40" y1="178.4" x2="1260" y2="178.4" stroke="#DEE0E3" stroke-width="1"/>
<line x1="41" y1="220.4" x2="1259" y2="220.4" stroke="#EFF0F1" stroke-width="1"/>
<line x1="41" y1="262.4" x2="1259" y2="262.4" stroke="#EFF0F1" stroke-width="1"/>
<line x1="41" y1="304.4" x2="1259" y2="304.4" stroke="#EFF0F1" stroke-width="1"/>
<line x1="41" y1="304.4" x2="1259" y2="304.4" stroke="#82A7FC" stroke-width="1"/>
<rect x="40" y="134.4" width="1220" height="212" rx="12" fill="none" stroke="#DEE0E3" stroke-width="1"/>
<text x="58" y="161.4" font-size="14" fill="#1F2329" font-weight="bold">数据要活多久</text>
<text x="351.1" y="161.4" font-size="14" fill="#1F2329" font-weight="bold">从哪分配</text>
<text x="628.1" y="161.4" font-size="14" fill="#1F2329" font-weight="bold">说明</text>
<text x="58" y="204.3" font-size="14" fill="#1F2329">一轮配置</text>
<text x="351.1" y="204.3" font-size="14" fill="#1F2329">cycle-＞pool</text>
<text x="628.1" y="204.3" font-size="14" fill="#1F2329">reload 时整池换掉</text>
<text x="58" y="246.3" font-size="14" fill="#1F2329">一个连接</text>
<text x="351.1" y="246.3" font-size="14" fill="#1F2329">c-＞pool</text>
<text x="628.1" y="246.3" font-size="14" fill="#1F2329">connection_pool_size 512</text>
<text x="58" y="288.3" font-size="14" fill="#1F2329">一个请求</text>
<text x="351.1" y="288.3" font-size="14" fill="#1F2329">r-＞pool</text>
<text x="628.1" y="288.3" font-size="14" fill="#1F2329">request_pool_size 4096</text>
<text x="58" y="330.3" font-size="14" fill="#245BDB" font-weight="bold">跨 worker 共享</text>
<text x="351.1" y="330.3" font-size="14" fill="#245BDB" font-weight="bold">共享内存 zone</text>
<text x="628.1" y="330.3" font-size="14" fill="#245BDB" font-weight="bold">ngx_slab_pool_t 分配，limit_req、proxy_cache 等都用它</text>
<text x="40" y="396" font-size="12" fill="#646A73" data-role="source">来源：本文整理</text>
</svg>
