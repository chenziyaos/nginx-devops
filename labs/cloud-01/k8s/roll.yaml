# Two replicas behind the Service "roll"; run.sh restarts the Deployment under load,
# first as is, then with the preStop sleep of k8s/roll-prestop.yaml patched in.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: roll
spec:
  replicas: 2
  selector:
    matchLabels: {app: roll}
  template:
    metadata:
      labels: {app: roll}
    spec:
      containers:
        - name: nginx
          image: nginx-devops/nginx:1.31.10
          readinessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 1
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf}
      volumes:
        - name: conf
          configMap: {name: lab-conf}
---
apiVersion: v1
kind: Service
metadata:
  name: roll
spec:
  selector: {app: roll}
  ports:
    - port: 80
