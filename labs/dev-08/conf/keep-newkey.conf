worker_processes 1;
error_log logs/error.log debug;

events {
    worker_connections 64;
}

http {
    log_format v '$status $limit_req_status $arg_k';
    access_log logs/access.log v;

    # same zone name and size, different key
    limit_req_zone $remote_addr zone=keep:1m rate=1r/m;

    server {
        listen 127.0.0.1:19160;

        location / {
            limit_req zone=keep;
            root html;
        }
    }
}
