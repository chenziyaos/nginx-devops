<text x="306" y="184.2" font-size="13" fill="#646A73">process_request_line</text>
<rect x="670" y="129.6" width="240" height="76" rx="12" fill="#F0FBEF" stroke="#8EE085" stroke-width="1.5" data-role="step"/>
<circle cx="890" cy="151.6" r="13" fill="#E4FAE1" stroke="#34C724" stroke-width="2"/>
<text x="890" y="156.1" font-size="13" fill="#2EA121" font-weight="bold" text-anchor="middle">2</text>
