<text x="236.7" y="220.6" font-size="13" fill="#1F2329">GET /f.txt</text>
<polyline points="226.7,229 588,229" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="588,223 598,229 588,235" fill="#8F959E"/>
<text x="610" y="261.6" font-size="13" fill="#1F2329">open + fstat</text>
<polyline points="600,270 961.3,270" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="961.3,264 971.3,270 961.3,276" fill="#8F959E"/>
