worker_processes 1;
error_log logs/error.log debug;

events {
    worker_connections 64;
}

http {
    log_format v '$status $limit_req_status $arg_k';
    access_log logs/access.log v;

    # 128k is the smallest zone on a 16 KB page system (8 pages); one node per $arg_k
    limit_req_zone $arg_k zone=tiny:128k rate=1r/m;

    server {
        listen 127.0.0.1:19160;

        location / {
            limit_req zone=tiny;
            root html;
        }
    }
}
