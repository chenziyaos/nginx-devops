<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, Helvetica, Arial, sans-serif" viewBox="0 0 1200 420" width="1200" height="420">
<rect x="0" y="0" width="1200" height="420" rx="16" fill="#FAFBFD" stroke="#DEE0E3" stroke-width="1" data-role="frame"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">worker 之间、reload 前后都不共享静态变量，要共享就得用共享内存</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">从左到右：master 先后 fork 两代 worker，每个进程有自己的一份计数；虚线表示进程退出</text>
<text x="180" y="162.2" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">master</text>
<text x="600" y="162.2" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">两代 worker</text>
<text x="1020" y="162.2" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">退出</text>
<polyline points="294,252.2 387,252.2 387,209.7 476,209.7" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="476,203.7 486,209.7 476,215.7" fill="#8F959E"/>
<polyline points="294,252.2 387,252.2 387,294.7 476,294.7" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="476,288.7 486,294.7 476,300.7" fill="#8F959E"/>
<polyline points="714,209.7 896,209.7" fill="none" stroke="#8F959E" stroke-width="2" stroke-dasharray="6 4"/>
<polygon points="896,203.7 906,209.7 896,215.7" fill="#8F959E"/>
<rect x="70" y="219.7" width="220" height="65" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="180" y="247.6" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">master</text>
<text x="180" y="267.4" font-size="12" fill="#646A73" text-anchor="middle">dlopen .so，计数 = 0</text>
<rect x="490" y="177.2" width="220" height="65" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="600" y="205.1" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">旧 worker</text>
<text x="600" y="224.9" font-size="12" fill="#646A73" text-anchor="middle">reload 前 fork，计数 6</text>
<rect x="490" y="262.2" width="220" height="65" rx="8" fill="#F0F4FF" stroke="#82A7FC" stroke-width="1.5" data-role="node"/>
<text x="600" y="290.1" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">新 worker</text>
<text x="600" y="309.9" font-size="12" fill="#646A73" text-anchor="middle">HUP 后 fork，计数 0 → 1</text>
<rect x="910" y="177.2" width="220" height="65" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="1020" y="214.6" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">计数随进程消失</text>
<text x="805" y="200.7" font-size="12" fill="#646A73" text-anchor="middle">请求处理完退出</text>
<text x="40" y="396" font-size="12" fill="#646A73" data-role="source">来源：本文整理（1.31.9）</text>
</svg>
