# dev-04: three levels of configuration, walked by cf.c after nginx -t
events { }

http {
    client_max_body_size 2m;

    server {
        listen 127.0.0.1:19080;
        server_name a;

        location /a {
            client_max_body_size 5m;

            location /a/b { }
        }

        location /c { }
        location = /exact { }
        location ~ \.php$ { }
    }

    server {
        listen 127.0.0.1:19080;
        server_name b;
        client_max_body_size 1m;

        location / { }
    }
}
