<text x="1056" y="341.9" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">route status</text>
<text x="1056" y="361.7" font-size="12" fill="#646A73" text-anchor="middle">不支持的字段、找不到的后端写</text>
<text x="1056" y="380.7" font-size="12" fill="#646A73" text-anchor="middle">在这里</text>
<rect x="952" y="418" width="208" height="84" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="1056" y="445.9" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">nginx + agent</text>
<text x="1056" y="465.7" font-size="12" fill="#646A73" text-anchor="middle">每个 Gateway 一个 Pod，</text>
<text x="1056" y="484.7" font-size="12" fill="#646A73" text-anchor="middle">agent 发 SIGHUP reload</text>
<text x="40" y="542" font-size="12" fill="#646A73" data-role="source">来源：labs/cloud-03 实验输出；NGF v2.9.1 源码</text>
