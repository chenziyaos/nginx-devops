# dev-01: debug only for connections from 127.0.0.1; [::1] stays at info
worker_processes 1;
error_log logs/dc.log info;

events {
    worker_connections 64;
    debug_connection   127.0.0.1;
}

http {
    access_log off;

    server {
        listen 127.0.0.1:19021;
        listen [::1]:19021;
        root   html;
    }
}
