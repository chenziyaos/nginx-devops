<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">slab 先按大小选档、再在半满页链上找空位、找不到才拿新页</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">从左到右：大块按页数整页分配；小块先在同档的半满页上找空位，没有才拿新页</text>
