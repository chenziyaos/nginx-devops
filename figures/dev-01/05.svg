<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">main() 先解析命令行、加载配置，最后才决定进程模式</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">从左到右是启动顺序；蓝色的 ngx_init_cycle 里建好阶段引擎和过滤器链，右列是四种结局</text>
