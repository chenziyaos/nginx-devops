# dev-03: one request with debug logging, to see the connection and request pools
worker_processes 1;
error_log logs/error.log debug;
events { }

http {
    access_log off;

    server {
        listen 127.0.0.1:19060;

        location / {
            return 200 "ok\n";
        }
    }

    server {
        listen 127.0.0.1:19061;
        request_pool_size 16k;

        location / {
            return 200 "ok\n";
        }
    }
}
