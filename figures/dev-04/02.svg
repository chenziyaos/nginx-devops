<text x="360.4" y="288.3" font-size="14" fill="#1F2329">NGX_STREAM_MAIN_CONF</text>
<text x="712.4" y="288.3" font-size="14" fill="#1F2329">ngx_stream_core_module</text>
<text x="1102" y="288.3" font-size="14" fill="#1F2329">—</text>
