<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, Helvetica, Arial, sans-serif" viewBox="0 0 1200 479" width="1200" height="479">
<rect x="0" y="0" width="1200" height="479" rx="16" fill="#FAFBFD" stroke="#DEE0E3" stroke-width="1" data-role="frame"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">流水线请求在同一轮循环末尾通过投递队列处理，不用再等 kevent</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">kevent 返回 → 处理第一个请求 → 把剩余字节投递到队列 → ngx_process_events 返回 → 本轮末尾处理第二个；用户态的数据内核不会再通知</text>
<line x1="226.7" y1="168" x2="226.7" y2="415" stroke="#C9CDD4" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="126.7" y="128" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="actor"/>
<text x="226.7" y="153" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">kevent</text>
<line x1="600" y1="168" x2="600" y2="415" stroke="#C9CDD4" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="500" y="128" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="actor"/>
<text x="600" y="153" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">请求处理</text>
<line x1="973.3" y1="168" x2="973.3" y2="415" stroke="#C9CDD4" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="873.3" y="128" width="200" height="40" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="actor"/>
<text x="973.3" y="153" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">ngx_posted_events</text>
<text x="236.7" y="202.6" font-size="13" fill="#1F2329">fd 3 可读（两请求）</text>
<polyline points="226.7,211 588,211" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="588,205 598,211 588,217" fill="#8F959E"/>
<text x="610" y="243.6" font-size="13" fill="#1F2329">处理第一个请求</text>
<polyline points="600,252 626,252 626,270 614,270" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="614,264 604,270 614,276" fill="#8F959E"/>
<text x="610" y="310.6" font-size="13" fill="#1F2329">剩余字节投递</text>
<polyline points="600,319 961.3,319" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="961.3,313 971.3,319 961.3,325" fill="#8F959E"/>
<text x="236.7" y="351.6" font-size="13" fill="#1F2329">ngx_process_events 返回</text>
<polyline points="226.7,360 588,360" fill="none" stroke="#8F959E" stroke-width="2" stroke-dasharray="6 4"/>
<polygon points="588,354 598,360 588,366" fill="#8F959E"/>
<text x="963.3" y="392.6" font-size="13" fill="#1F2329" text-anchor="end">处理第二个请求</text>
<polyline points="973.3,401 612,401" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="612,395 602,401 612,407" fill="#8F959E"/>
<text x="40" y="455" font-size="12" fill="#646A73" data-role="source">来源：src/http/ngx_http_request.c、labs/dev-05 实验（1.31.10）</text>
</svg>
