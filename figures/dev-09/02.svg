<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, Helvetica, Arial, sans-serif" viewBox="0 0 1200 601" width="1200" height="601">
<rect x="0" y="0" width="1200" height="601" rx="16" fill="#FAFBFD" stroke="#DEE0E3" stroke-width="1" data-role="frame"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">upstream 的每一步都由事件驱动，函数返回就意味着在等下一个事件</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">从上到下：init_request → connect → send_request → process_header → send_response，然后按 buffering 分为两条路径最后都到 finalize</text>
<text x="144" y="143" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">请求建立与连接</text>
<text x="448" y="143" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">请求发送与响应读取</text>
<text x="752" y="143" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">响应体处理</text>
<text x="1056" y="143" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">清理</text>
<polyline points="252,318 330,318" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="330,312 340,318 330,324" fill="#8F959E"/>
<polyline points="556,436 597,436 597,377 634,377" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="634,371 644,377 634,383" fill="#8F959E"/>
<polyline points="556,436 597,436 597,495 634,495" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="634,489 644,495 634,501" fill="#8F959E"/>
<polyline points="860,377 901,377 901,436 938,436" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="938,430 948,436 938,442" fill="#8F959E"/>
<polyline points="860,495 901,495 901,436 938,436" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="938,430 948,436 938,442" fill="#8F959E"/>
<polyline points="144,246 144,262" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="138,262 144,272 150,262" fill="#8F959E"/>
<polyline points="448,364 448,380" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="442,380 448,390 454,380" fill="#8F959E"/>
<rect x="40" y="158" width="208" height="84" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="144" y="195.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">init_request</text>
<text x="144" y="215.2" font-size="12" fill="#646A73" text-anchor="middle">生成请求，调 peer.init</text>
<rect x="40" y="276" width="208" height="84" rx="8" fill="#F0F4FF" stroke="#82A7FC" stroke-width="1.5" data-role="node"/>
<text x="144" y="313.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">connect</text>
<text x="144" y="333.2" font-size="12" fill="#646A73" text-anchor="middle">建立连接或复用</text>
<rect x="344" y="276" width="208" height="84" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="448" y="313.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">send_request</text>
<text x="448" y="333.2" font-size="12" fill="#646A73" text-anchor="middle">发送请求到后端</text>
<rect x="344" y="394" width="208" height="84" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="448" y="431.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">process_header</text>
<text x="448" y="451.2" font-size="12" fill="#646A73" text-anchor="middle">读响应头</text>
<rect x="648" y="335" width="208" height="84" rx="8" fill="#FFF5EB" stroke="#FFBA6B" stroke-width="1.5" data-role="node"/>
<text x="752" y="362.9" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">buffering on</text>
<text x="752" y="382.7" font-size="12" fill="#646A73" text-anchor="middle">process_upstream：</text>
<text x="752" y="401.7" font-size="12" fill="#646A73" text-anchor="middle">event pipe</text>
<rect x="648" y="453" width="208" height="84" rx="8" fill="#FFF5EB" stroke="#FFBA6B" stroke-width="1.5" data-role="node"/>
<text x="752" y="490.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">buffering off</text>
<text x="752" y="510.2" font-size="12" fill="#646A73" text-anchor="middle">non_buffered：直转</text>
<rect x="952" y="394" width="208" height="84" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="1056" y="431.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">finalize</text>
<text x="1056" y="451.2" font-size="12" fill="#646A73" text-anchor="middle">peer.free，连接放回缓存</text>
<text x="605" y="410.5" font-size="12" fill="#646A73">on</text>
<text x="605" y="469.5" font-size="12" fill="#646A73">off</text>
<text x="40" y="577" font-size="12" fill="#646A73" data-role="source">来源：ngx_http_upstream.c、ngx_http_upstream_handler（1.31.9）</text>
</svg>
