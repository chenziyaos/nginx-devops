<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, Helvetica, Arial, sans-serif" viewBox="0 0 1200 473" width="1200" height="473">
<rect x="0" y="0" width="1200" height="473" rx="16" fill="#FAFBFD" stroke="#DEE0E3" stroke-width="1" data-role="frame"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">数组越靠后的过滤器越先执行</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">左边是 postconfiguration 的执行顺序，每个模块把自己压到链头；右边是 header filter 被调用的顺序，正好反过来</text>
<rect x="40" y="128" width="548" height="281" rx="12" fill="#FFFFFF" stroke="#C9CDD4" stroke-width="1.5" data-role="card"/>
<text x="60" y="168.5" font-size="20" fill="#646A73" font-weight="bold" data-role="card-title">cycle-＞modules 数组顺序</text>
<line x1="60" y1="193" x2="568" y2="193" stroke="#EFF0F1" stroke-width="1"/>
<text x="60" y="227" font-size="14" fill="#646A73">1</text>
<text x="568" y="227" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="end">headers_filter</text>
<line x1="60" y1="241" x2="568" y2="241" stroke="#EFF0F1" stroke-width="1"/>
<text x="60" y="265" font-size="14" fill="#646A73">2</text>
