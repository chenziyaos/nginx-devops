# dev-10: the tutorial's own module (modules/ngx_http_hello_module), built as a dynamic
# module by tools/build.sh. run.sh links modules/ to ../../.nginx/modules. One worker, so
# $hello_requests counts every request of the lab.
load_module modules/ngx_http_hello_module.so;

worker_processes 1;
error_log logs/error.log notice;

events { worker_connections 64; }

http {
    log_format lab '$request_uri $status before=$before now=$hello_requests';
    access_log logs/access.log lab;

    server {
        listen 127.0.0.1:19200;
        root html;

        hello_header "srv";

        # content handler: the directive sets clcf->handler
        location = /hello { hello "hi from the module"; }

        # rewrite phase reads the variable before the content handler counts
        location = /count { set $before $hello_requests; hello "counted"; }

        # header filter: the server-level value is inherited, "" switches it off,
        # a location value may use variables
        location /files/  { alias html/; add_header X-Add 1; }
        location /off/    { alias html/; hello_header ""; }
        location /var/    { alias html/; hello_header "uri=$uri"; }

        location = /total { return 200 "$hello_requests\n"; }
    }
}
