<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, Helvetica, Arial, sans-serif" viewBox="0 0 1200 500" width="1200" height="500">
<rect x="0" y="0" width="1200" height="500" rx="16" fill="#FAFBFD" stroke="#DEE0E3" stroke-width="1" data-role="frame"/>
<text x="40" y="58" font-size="27" fill="#1F2329" font-weight="bold" data-role="title">连接从 accept 到 keepalive 或关闭，对应 stub_status 中不同的计数器</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">从上到下是连接的生命周期；颜色标记每个阶段更新的计数器</text>
<text x="144" y="143" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">建立和初始化</text>
<text x="448" y="143" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">处理请求</text>
<text x="752" y="143" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">连接复用</text>
<text x="1056" y="143" font-size="13" fill="#646A73" font-weight="bold" text-anchor="middle">连接关闭</text>
<polyline points="252,340 330,340" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="330,334 340,340 330,346" fill="#8F959E"/>
<polyline points="556,340 634,340" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="634,334 644,340 634,346" fill="#8F959E"/>
<polyline points="860,340 938,340" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="938,334 948,340 938,346" fill="#8F959E"/>
<polyline points="714.6,246 714.6,408 485.4,408 485.4,396" fill="none" stroke="#8F959E" stroke-width="2" stroke-dasharray="6 4"/>
<polygon points="479.4,396 485.4,386 491.4,396" fill="#8F959E"/>
<polyline points="752,294 752,256" fill="none" stroke="#8F959E" stroke-width="2"/>
<polygon points="746,256 752,246 758,256" fill="#8F959E"/>
<rect x="40" y="298" width="208" height="84" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="144" y="325.9" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">accept</text>
<text x="144" y="345.7" font-size="12" fill="#646A73" text-anchor="middle">accepts +1；handled +1；</text>
<text x="144" y="364.7" font-size="12" fill="#646A73" text-anchor="middle">Active +1</text>
<rect x="344" y="298" width="208" height="84" rx="8" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="node"/>
<text x="448" y="335.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">Reading → Writing</text>
<text x="448" y="355.2" font-size="12" fill="#646A73" text-anchor="middle">requests +1；处理和发送</text>
<rect x="648" y="158" width="208" height="84" rx="8" fill="#F0FBEF" stroke="#8EE085" stroke-width="1.5" data-role="node"/>
<text x="752" y="195.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">Waiting</text>
<text x="752" y="215.2" font-size="12" fill="#646A73" text-anchor="middle">空闲，等下一个请求</text>
<rect x="648" y="298" width="208" height="84" rx="8" fill="#E1EAFF" stroke="#3370FF" stroke-width="2" data-role="node"/>
<text x="752" y="335.4" font-size="14" fill="#245BDB" font-weight="bold" text-anchor="middle">keepalive？</text>
<text x="752" y="355.2" font-size="12" fill="#646A73" text-anchor="middle">响应发完，看连接能否复用</text>
<rect x="952" y="298" width="208" height="84" rx="8" fill="#FFF5EB" stroke="#FFBA6B" stroke-width="1.5" data-role="node"/>
<text x="1056" y="335.4" font-size="14" fill="#1F2329" font-weight="bold" text-anchor="middle">关闭</text>
<text x="1056" y="355.2" font-size="12" fill="#646A73" text-anchor="middle">Active -1</text>
<text x="760" y="279" font-size="12" fill="#646A73">keepalive</text>
<text x="600" y="399" font-size="12" fill="#646A73" text-anchor="middle">循环</text>
<text x="899" y="331" font-size="12" fill="#646A73" text-anchor="middle">关闭</text>
<text x="40" y="476" font-size="12" fill="#646A73" data-role="source">来源：ngx_event_accept.c、ngx_http_request.c、ngx_connection.c（1.31.10）、labs/ops-11 实验输出</text>
</svg>
