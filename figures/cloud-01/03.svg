<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, Helvetica, Arial, sans-serif" viewBox="0 0 1200 420" width="1200" height="420">
<rect x="0" y="0" width="1200" height="420" rx="16" fill="#FAFBFD" stroke="#DEE0E3" stroke-width="1" data-role="frame"/>
<text x="40" y="58" font-size="28" fill="#1F2329" font-weight="bold" data-role="title">停止信号和两道上限决定在途请求怎么结束</text>
<text x="40" y="92" font-size="14" fill="#646A73" data-role="subtitle">5 秒的下载进行到 1 秒时停止 Pod；只有 nginx 自己收尾的两行在 access log 里留下记录</text>
<rect x="40" y="134.4" width="1120" height="212" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1" data-role="table"/>
<rect x="41" y="135.4" width="1118" height="43" rx="11" fill="#F5F6F7"/>
<rect x="41" y="166.4" width="1118" height="12" fill="#F5F6F7"/>
<line x1="40" y1="178.4" x2="1160" y2="178.4" stroke="#DEE0E3" stroke-width="1"/>
<line x1="41" y1="220.4" x2="1159" y2="220.4" stroke="#EFF0F1" stroke-width="1"/>
<line x1="41" y1="262.4" x2="1159" y2="262.4" stroke="#EFF0F1" stroke-width="1"/>
<line x1="41" y1="304.4" x2="1159" y2="304.4" stroke="#EFF0F1" stroke-width="1"/>
<text x="58" y="161.4" font-size="14" fill="#1F2329" font-weight="bold">怎么停</text>
<text x="442.4" y="161.4" font-size="14" fill="#1F2329" font-weight="bold">下载</text>
<text x="706.9" y="161.4" font-size="14" fill="#1F2329" font-weight="bold">access log</text>
<text x="934.9" y="161.4" font-size="14" fill="#1F2329" font-weight="bold">谁收的尾</text>
<text x="58" y="204.3" font-size="14" fill="#1F2329">删 Pod，STOPSIGNAL 是 SIGQUIT</text>
<text x="442.4" y="204.3" font-size="14" fill="#1F2329">完整收到 1048576 字节</text>
<text x="706.9" y="204.3" font-size="14" fill="#1F2329">有，200</text>
<text x="934.9" y="204.3" font-size="14" fill="#1F2329">nginx 做完再退出</text>
<text x="58" y="246.3" font-size="14" fill="#1F2329">kill -TERM 1</text>
<text x="442.4" y="246.3" font-size="14" fill="#1F2329">被切断</text>
<text x="706.9" y="246.3" font-size="14" fill="#1F2329">没有</text>
<text x="934.9" y="246.3" font-size="14" fill="#1F2329">worker 直接退出</text>
<text x="58" y="288.3" font-size="14" fill="#1F2329">terminationGracePeriodSeconds 2</text>
<text x="442.4" y="288.3" font-size="14" fill="#1F2329">删除后约 2 秒切断</text>
<text x="706.9" y="288.3" font-size="14" fill="#1F2329">没有</text>
<text x="934.9" y="288.3" font-size="14" fill="#1F2329">kubelet 发 SIGKILL</text>
<text x="58" y="330.3" font-size="14" fill="#1F2329">worker_shutdown_timeout 1s</text>
<text x="442.4" y="330.3" font-size="14" fill="#1F2329">删除后约 1 秒切断</text>
<text x="706.9" y="330.3" font-size="14" fill="#1F2329">有，200，字节不足</text>
<text x="934.9" y="330.3" font-size="14" fill="#1F2329">nginx 关闭连接</text>
<text x="40" y="396" font-size="12" fill="#646A73" data-role="source">来源：labs/cloud-01 实验输出</text>
</svg>
