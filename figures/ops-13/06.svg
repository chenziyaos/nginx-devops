<text x="60" y="252.7" font-size="14" fill="#646A73">和 $upstream_status</text>
<rect x="341.9" y="160.8" width="214.3" height="146" rx="12" fill="#FFFFFF" stroke="#DEE0E3" stroke-width="1.5" data-role="step"/>
